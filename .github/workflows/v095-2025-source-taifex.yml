name: JARVIS v0.95 2025 TAIFEX isolated native Bronze candidate intake
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v095-2025-source-taifex.yml'
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: read
concurrency:
  group: jarvis-v095-2025-source-taifex-single-writer
  cancel-in-progress: false
jobs:
  intake-taifex-2025:
    if: github.repository == 'danny541690/C1-RAW-DOWNLOADER'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      V095_BRONZE_SOURCE: 'TAIFEX'
      V095_DATA_YEAR: '2025'
      V095_ARCHIVE_BATCH: '3'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native archive Drive validation dependencies
        run: python -m pip install --disable-pip-version-check pyarrow openpyxl google-api-python-client google-auth google-auth-httplib2
      - name: Check isolation and 2025 archive provenance
        run: |
          python -m py_compile scripts/v095_2026_four_source_archive_intake.py
          python - <<'PY'
          import os,json
          x=json.load(open('governance/v095/PHASE1_FLAGS.json'))
          assert x['BULK_COPY_APPROVED'] is False and x['RELEASE_APPROVED'] is False
          assert os.environ['V095_DATA_YEAR']=='2025'
          PY
      - name: Validate native 2025 historical source ZIP CRC SHA manifest without redownloading accepted
        run: python -u -m scripts.v095_2026_four_source_archive_intake
      - name: Publish 2025 source run receipt to Drive
        if: always()
        env:
          V095_RECEIPT_LANE: 'BRONZE'
        run: python -u -m scripts.v095_2026_publish_run_receipt
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v095-2025-taifex-bronze-${{ github.run_id }}
          path: |
            v095_2025_source_archives/result.json
            v095_2026_run_receipt/drive_receipt.json
          if-no-files-found: warn
          retention-days: 90
