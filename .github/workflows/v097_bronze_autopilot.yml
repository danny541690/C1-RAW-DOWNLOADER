name: JARVIS v097 Bronze Autopilot 74750 Seven Sources
on:
  workflow_dispatch:
    inputs:
      chain_depth:
        description: 'Self-continuation cycle, stop at 60 per chain'
        required: false
        default: '0'
        type: string
  workflow_call:
  push:
    paths:
      - scripts/v097_bronze_autopilot.py
      - scripts/v097_ap_silver_input_gate.py
      - scripts/v097_ap_silver_input_gate_all.py
      - scripts/v097_ap_publish_artifacts.py
      - scripts/v097_ap_continuation.py
      - .github/workflows/v097_bronze_autopilot.yml
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
  actions: write
concurrency:
  group: v097-bronze-autopilot-74750
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests
      - name: Test parser, dates and safe ZIP
        run: PYTHONPATH=. python scripts/v097_bronze_autopilot.py selftest
      - name: Initialize immutable seven-source queues from frozen 74750 checkpoint
        if: github.event_name != 'schedule'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: PYTHONPATH=. python scripts/v097_bronze_autopilot.py init
  source-qa:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        source: [TWSE, TPEx, MOPS, TDCC, TAIFEX, NDC, FinMind]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests
      - name: Resume from per-source Drive checkpoint; never overwrite raw data
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          AUTOPILOT_BATCH: '350'
          AUTOPILOT_CYCLES: '3'
        run: PYTHONPATH=. python scripts/v097_bronze_autopilot.py worker --source '${{ matrix.source }}'
  source-release:
    needs: [preflight, source-qa]
    if: always() && needs.preflight.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        source: [TWSE, TPEx, MOPS, TDCC, TAIFEX, NDC, FinMind]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests
      - name: Seven-source gate positive and negative self-test
        run: PYTHONPATH=. python scripts/v097_ap_silver_input_gate_all.py selftest
      - name: Verify immutable source QA receipt and emit source-specific Silver input release
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: PYTHONPATH=. python scripts/v097_ap_silver_input_gate_all.py '${{ matrix.source }}'
  final-status:
    needs: [preflight, source-qa, source-release]
    if: always() && needs.preflight.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests
      - name: Write non-fabricated Bronze readiness summary
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: PYTHONPATH=. python scripts/v097_bronze_autopilot.py finalize
      - name: Verify all seven source gates completed
        run: PYTHONPATH=. python scripts/v097_ap_silver_input_gate_all.py selftest
      - name: Test acceptance publisher
        run: PYTHONPATH=. python scripts/v097_ap_publish_artifacts.py selftest
      - name: Save Bronze adapter rulebook, sharded file ledger, exception register, and READY manifest
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: PYTHONPATH=. python scripts/v097_ap_publish_artifacts.py
      - name: Test persistent postrun continuation
        run: PYTHONPATH=. python scripts/v097_ap_continuation.py selftest
      - name: Examine same-run checkpoint and decide next batch
        id: advance
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: PYTHONPATH=. python scripts/v097_ap_continuation.py postrun
      - name: Dispatch next batch from persistent checkpoint (not cron)
        if: steps.advance.outputs.continue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHAIN_DEPTH: ${{ inputs.chain_depth || '0' }}
        run: |
          if ! [[ "$CHAIN_DEPTH" =~ ^[0-9]+$ ]]; then
            echo "REJECT_NONNUMERIC_CHAIN_DEPTH"; exit 1
          fi
          if [ "$CHAIN_DEPTH" -ge 60 ]; then
            echo "CHAIN_DEPTH_60_REACHED - watchdog retains responsibility"; exit 0
          fi
          next=$((CHAIN_DEPTH + 1))
          gh workflow run v097_bronze_autopilot.yml --ref main -f chain_depth="$next"
          echo "NEXT_RUN_ACCEPTED source_run=${GITHUB_RUN_ID} chain_depth=$next"

