name: JARVIS Operational Control and Bounded Recovery
# Preserve completed evidence and share one time budget across short repair units.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'bootstrap includes one-month shadow; auto includes bounded repair'
        type: choice
        options: [bootstrap, auto, monitor, daily, repair]
        default: bootstrap
  schedule:
    - cron: '17 * * * *'
  workflow_run:
    workflows: ['JARVIS 2023 Layer02 Conversion', 'JARVIS v0.93 Offline Engine Tests', 'JARVIS Layer02 R3 2025-2026 Parser Repair and Structural QA', 'JARVIS Parallel Repair and Feature Preparation', 'JARVIS Independent Feature History']
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: jarvis-operational-control-single-writer
  cancel-in-progress: false
jobs:
  code_gate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.evidence.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - name: Reuse consolidated code acceptance
        id: evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m scripts.v093_ci_gate
  control:
    needs: code_gate
    if: needs.code_gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-qa.lock
      - run: pip install -r requirements-qa.lock
      - name: Preserve active workers, reconcile paths and update durable control
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          MODE: ${{ github.event.inputs.mode || ((github.event_name == 'push' || github.event_name == 'workflow_run') && 'monitor' || 'daily') }}
        run: python -u -m scripts.v093_operations --mode "$MODE"
