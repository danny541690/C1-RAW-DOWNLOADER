name: JARVIS R3 FinMind 2000 2009 2022 reproducible native API G2 investigation
# Rerun with full historical 2009 native accounting key alias and value-by-origin validation.
on:
  push:
    branches: [r3-bronze-silver-ready-staging-20261118]
    paths: ['.github/workflows/v097_r3_finmind_reproducible_vintages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jarvis-r3-finmind-three-vintages-data-id-original-proof
  cancel-in-progress: false
jobs:
  finmind-three-original-vintages:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: Reproduce 2000, 2009 and 2022 FinMind historical API by exact data_id and month
        run: |
          set -euo pipefail
          python -m py_compile scripts/v097_r3_finmind_reproducible_vintages.py
          PYTHONPATH=. python scripts/v097_r3_finmind_reproducible_vintages.py
      - if: always()
        run: echo 'Query includes manifest dataset, data_id stock code, start/end. Full native row diff, no token logging, original Bronze never modified, G2 fail closed.' >> "$GITHUB_STEP_SUMMARY"
