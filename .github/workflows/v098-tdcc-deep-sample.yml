name: JARVIS v0.98 TDCC bounded format sample
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/v098-tdcc-deep-sample.yml
      - scripts/v098_tdcc_deep_sample.py
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Read TDCC historical format samples
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python3 scripts/v098_tdcc_deep_sample.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jarvis-v098-tdcc-deep-schema
          path: tdcc_depth_probe/
