name: JARVIS v0.98 R22 Synthetic Remote GitHub CAS Concurrency
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/v098_r22_remote_cas_test.py'
permissions:
  contents: write
concurrency:
  group: jarvis-v098-r22-real-remote-cas
  cancel-in-progress: false
jobs:
  remote-cas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Eight workers race one remote GitHub content SHA, reject stale worker, verify takeover
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/v098_r22_remote_cas_test.py --out r22_final/remote_cas.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r22-synthetic-remote-cas-report
          path: r22_final/
          if-no-files-found: warn
