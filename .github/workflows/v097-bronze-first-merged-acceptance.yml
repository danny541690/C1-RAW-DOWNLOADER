name: JARVIS v0.97 - Bronze-first merged RAW copy QA acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v097-bronze-first-merged-acceptance.yml'
      - 'scripts/v097_bronze_first_merged_acceptance.py'
  workflow_run:
    workflows:
      - JARVIS v0.97 - BRONZE FIRST 12+6+6 verified-copy autopilot
    types: [completed]
permissions:
  contents: read
concurrency:
  group: v097-bronze-first-merged-acceptance-single
  cancel-in-progress: false
jobs:
  merged-acceptance:
    if: github.repository == 'danny541690/C1-RAW-DOWNLOADER' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only Drive client dependencies
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib
      - name: Combined syntax, RAW source, ZIP, sidecar, PIT-scope and checkpoint rules
        run: |
          python -m py_compile scripts/v097_bronze_first_pipeline.py scripts/v097_bronze_first_batch_v3.py scripts/v097_bronze_first_merged_acceptance.py
          PYTHONPATH=. python scripts/v097_bronze_first_merged_acceptance.py
      - name: LIVE receipt reconciliation, six-lane copy versus independent Bronze QA, exception report
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          BF_ACCEPTANCE_LIVE: '1'
        run: PYTHONPATH=. python scripts/v097_bronze_first_merged_acceptance.py
