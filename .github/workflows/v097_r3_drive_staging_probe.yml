name: JARVIS R3 isolated DRIVE COMMIT READBACK PRELAUNCH
on:
  push:
    branches:
      - r3-bronze-silver-ready-staging-20261118
    paths:
      - 'scripts/v097_r3_drive_staging_commit_probe.py'
      - '.github/workflows/v097_r3_drive_staging_probe.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jarvis-r3-staging-drive-write
  cancel-in-progress: false
jobs:
  r3-namespace-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: Isolated staging receipt atomic create and readback (not production G5)
        run: |
          set -euo pipefail
          python -m py_compile scripts/v097_r3_drive_staging_commit_probe.py
          PYTHONPATH=. python scripts/v097_r3_drive_staging_commit_probe.py staging-readback
      - name: Always record explicit nonrelease
        if: always()
        run: echo 'STAGING RECEIPT ONLY / NOT A G5 CERTIFICATE / R1 V3 MASTERS UNCHANGED / NO SILVER OR GOLD' >> "$GITHUB_STEP_SUMMARY"
