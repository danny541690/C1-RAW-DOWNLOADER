name: JARVIS 2026 FinMind FREE All-Year Backfill
on:
  push:
    paths:
      - .github/workflows/v093-finmind-free-2026-backfill.yml
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
concurrency:
  group: finmind-free-2026-backfill
  cancel-in-progress: false
jobs:
  ingest-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-api-python-client google-auth google-auth-httplib2
      - name: Download safe FREE 2026 stock/dataset annual API and split to existing monthly folders
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python -u -m scripts.v093_finmind_free_2026_backfill --max-requests 120
