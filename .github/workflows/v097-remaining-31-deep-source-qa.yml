name: JARVIS v0.97 - Remaining 31 original dataset cross-format QA
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v097_remaining_31_deep_source_qa.py'
      - '.github/workflows/v097-remaining-31-deep-source-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  six-source-schema-lanes:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        lane: [0,1,2,3,4,5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: Deep original 31 ZIP CRC manifest, large JSON TDCC 1-1/1-2 official current schema and MOPS/TDCC HTML
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          V097_31_LANE: ${{ matrix.lane }}
        run: |
          python -m py_compile scripts/v097_remaining_31_deep_source_qa.py
          PYTHONPATH=. python scripts/v097_remaining_31_deep_source_qa.py
