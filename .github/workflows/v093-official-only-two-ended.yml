# Adopt proven primary historical frontier once; preserve newer gap backlog for repairs.
# Preserve prior downloaded/checked records; reuse QA RAW index; keep current cursors.
name: JARVIS official-only first pass - two ends
on:
  push:
    paths:
      - '.github/workflows/v093-official-only-two-ended.yml'
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: jarvis-official-firstpass-prepare-v2
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-qa.lock
      - run: pip install -r requirements-qa.lock
      - name: Verify official-only rules and immutable batch capture
        run: python -m unittest tests.test_official_firstpass tests.test_stage07_ascending -q
      - name: Wait for control API budget before cutover
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.v093_github_budget --minimum 150 --max-wait 1200
      - name: Confirm legacy workers stopped and create both independent control folders
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import json,os,time,urllib.request,urllib.error
          base='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          own='.github/workflows/v093-official-only-two-ended.yml'
          def api(path,method='GET'):
              req=urllib.request.Request(base+path,method=method,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  raw=r.read();return json.loads(raw) if raw else {}
          # Explicitly retire all seven old schedules, including the former recovery loop.
          for name in ['v093-v2-01-raw.yml','v093-v2-02-qa.yml','v093-v2-03-price.yml','v093-v2-04-financial.yml','v093-v2-05-chip.yml','v093-v2-06-reconcile-repair.yml','v093-v2-07-raw-ascending.yml']:
              w=api('/actions/workflows/'+name)
              if w['state']=='active':api('/actions/workflows/'+name+'/disable','PUT')
          deadline=time.monotonic()+240
          while True:
              active=[]
              for page in range(1,5):
                  runs=api('/actions/runs?per_page=100&page='+str(page))['workflow_runs']
                  for r in runs:
                      if r['path']=='.github/workflows/v093-live-resume-watchdog.yml':continue
                      older_deploy=(os.environ.get('GITHUB_EVENT_NAME')=='push' and r['path']==own and r['id']<int(os.environ['GITHUB_RUN_ID']))
                      legacy=r['path'] not in (own,'.github/workflows/v093-official-only-repair.yml','.github/workflows/v093-tdcc-independent.yml')
                      if not (legacy or older_deploy) or r['status']=='completed':continue
                      try:api('/actions/runs/'+str(r['id'])+'/cancel','POST')
                      except urllib.error.HTTPError as e:
                          if e.code not in (409,422):raise
                      if r['status']=='in_progress':active.append(r)
                      else:print('QUEUED_LEGACY_CANCEL_REQUESTED',r['id'],flush=True)
                  if len(runs)<100:break
              if not active:break
              for r in active:
                  try:api('/actions/runs/'+str(r['id'])+'/force-cancel','POST')
                  except urllib.error.HTTPError as e:
                      if e.code not in (409,422):raise
              if time.monotonic()>deadline:raise RuntimeError('LEGACY_WORKER_STILL_ACTIVE_NO_SOURCE_REQUEST_STARTED')
              time.sleep(5)
          from scripts.annual_actual_firstpass import Drive,service
          from scripts.v093_live_five_stage import RUN
          from scripts.v093_three_year_repair import REPORT_ROOT
          drive=Drive(service())
          root=drive.folder(REPORT_ROOT,RUN)
          for direction in ('DESC','ASC'):
              folder=drive.folder(root,'OFFICIAL_ONLY_'+direction)
              print('OFFICIAL_CONTROL_READY',direction,folder,flush=True)
          print('OFFICIAL_ONLY_CUTOVER_READY',flush=True)
          PY
  download:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        direction: [DESC, ASC]
    name: Official download ${{ matrix.direction }}
    concurrency:
      group: jarvis-official-firstpass-${{ matrix.direction }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-qa.lock
      - run: pip install -r requirements-qa.lock
      - name: Check control API budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.v093_github_budget --minimum 150 --max-wait 300
      - name: Download missing official RAW only; resume durable checkpoint
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          DIRECTION: ${{ matrix.direction }}
        run: python -m scripts.v093_official_firstpass --direction "$DIRECTION" --minutes 50
