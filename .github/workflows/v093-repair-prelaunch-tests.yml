name: JARVIS shared repair prelaunch tests
on:
  push:
    branches: ['fix/prelaunch-shared-repair-20261024']
  pull_request:
    paths: ['scripts/**', 'tests/**', '.github/workflows/v093-repair-prelaunch-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-prelaunch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-qa.lock
      - name: Test parsers, meeting election, preservation, retry caps and readback
        run: python -m unittest discover -s tests -p 'test_*.py' -q
