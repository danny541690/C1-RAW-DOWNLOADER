name: JARVIS R3 G2 TAIFEX FinMind actual original API recheck
on:
  push:
    branches: [r3-bronze-silver-ready-staging-20261118]
    paths: ['.github/workflows/v097_r3_g2_four_source_endpoint.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jarvis-r3-four-source-api-independent-recheck
  cancel-in-progress: false
jobs:
  recheck-official-provider-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: Official TAIFEX and FinMind historic source API actual response proof
        run: |
          set -euo pipefail
          python -m py_compile scripts/v097_r3_g2_four_source_endpoint_recheck.py
          PYTHONPATH=. python scripts/v097_r3_g2_four_source_endpoint_recheck.py
      - if: always()
        run: echo 'No G2 PASS merely on provider response availability; source original hash, version and publication as-of required.' >> "$GITHUB_STEP_SUMMARY"
