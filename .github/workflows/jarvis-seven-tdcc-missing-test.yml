name: JARVIS TDCC actual missing download and cold-resume acceptance
on:
  push:
    branches: [codex/seven-source-closed-loop-design-20261029]
    paths: [scripts/v093_tdcc_missing_live.py]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: jarvis-tdcc-missing-qa
  cancel-in-progress: false
jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-qa.lock
      - name: Restore immutable original and reviewed ledgers
        run: |
          mkdir frozen
          git fetch --depth=1 origin refs/heads/jarvis-handoff-replay/20261029-40812627597:refs/remotes/origin/frozen
          git archive refs/remotes/origin/frozen | tar -x -C frozen
      - run: python -m scripts.v093_source_preflight --out results/preflight
      - name: Download proven missing TDCC weekly tasks and inject post-save interruption
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python -m scripts.v093_tdcc_missing_live start --namespace tdcc-missing-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Automatically preserve acceptance evidence in Git and Drive
        if: always()
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python -m scripts.v093_acceptance_publish --source 'TDCC' --job 'start' --status '${{ job.status }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tdcc-missing-start
          path: results
          retention-days: 90
  resume:
    needs: start
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-qa.lock
      - uses: actions/download-artifact@v4
        with:
          name: tdcc-missing-start
          path: expected
      - name: Recover actual saved RAW and revalidate in a fresh runner
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python -m scripts.v093_tdcc_missing_live resume --namespace tdcc-missing-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Automatically preserve acceptance evidence in Git and Drive
        if: always()
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python -m scripts.v093_acceptance_publish --source 'TDCC' --job 'resume' --status '${{ job.status }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tdcc-missing-resume
          path: results
          retention-days: 90
