name: JARVIS v097 Seven Independent Source Watchdog 15m
on:
  workflow_dispatch:
    inputs:
      source:
        description: One source or all seven
        type: choice
        options: [ALL, TWSE, TPEx, MOPS, TDCC, TAIFEX, NDC, FinMind]
        default: ALL
        required: true
  schedule:
    - cron: '3,18,33,48 * * * *'
  push:
    paths:
      - .github/workflows/v097_seven_independent_15m_watchdog.yml
permissions:
  contents: read
  actions: write
jobs:
  dispatch-all:
    if: github.event_name == 'schedule' || github.event_name == 'push' || inputs.source == 'ALL'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Schedule all sources independently; source failures never block peers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -u
          failed=0
          for source in TWSE TPEx MOPS TDCC TAIFEX NDC FinMind; do
            if gh workflow run v097_seven_independent_15m_watchdog.yml --ref main -f source="$source"; then
              echo "SOURCE_DISPATCH_ACCEPTED=$source"
            else
              echo "SOURCE_DISPATCH_FAILED=$source" >&2
              failed=$((failed+1))
            fi
          done
          echo "SOURCE_DISPATCH_ERRORS=$failed"
          test "$failed" -eq 0
  per-source-independent:
    if: github.event_name == 'workflow_dispatch' && inputs.source != 'ALL'
    name: Independently check ${{ inputs.source }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    concurrency:
      group: v097-independent-proof-${{ inputs.source }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: All seven format and source-specific negative controls
        run: |
          PYTHONPATH=. python scripts/v097_seven_independent_depth.py selftest
          PYTHONPATH=. python scripts/v097_seven_source_specific_resolvers.py selftest
          PYTHONPATH=. python scripts/v097_d_seven_source_gate.py selftest
          PYTHONPATH=. python scripts/v097_seven_independent_publisher_bridge.py selftest
      - name: Recheck source original SHA, historical schema and missing full-file proofs
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          EVIDENCE_DEPTH_BATCH: '12'
        run: PYTHONPATH=. python scripts/v097_seven_independent_depth.py '${{ inputs.source }}'
      - name: Independent official HTTP and dataset-specific value probes
        if: success()
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          WITNESS_SAMPLES: '6'
          WITNESS_CK_PREFIX: 'v097_WATCHDOG_PRICE_WITNESS_CK_'
        run: PYTHONPATH=. python scripts/v097_seven_independent_publisher_bridge.py '${{ inputs.source }}'

  d-recheck:
    needs: per-source-independent
    if: always() && github.event_name == 'workflow_dispatch' && inputs.source != 'ALL'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: v097-d-gate-${{ inputs.source }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests
      - name: "Strict negative checks: never promote a sample or a forged evidence receipt"
        run: PYTHONPATH=. python scripts/v097_d_seven_source_gate.py selftest
      - name: Reconsider changed native formats and independent numeric evidence without altering formal release
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          D_BATCH: '120'
        run: PYTHONPATH=. python scripts/v097_d_seven_source_gate.py '${{ inputs.source }}'
