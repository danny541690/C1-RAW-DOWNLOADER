name: JARVIS v0.968 R8 | six source RAW Drive autopilot
on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
permissions:
  contents: read
concurrency:
  group: v0968-r8-raw-autopilot-workflow
  cancel-in-progress: false
jobs:
  server-side-raw-copy:
    if: github.repository == 'danny541690/C1-RAW-DOWNLOADER'
    runs-on: ubuntu-latest
    timeout-minutes: 29
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        source: [TWSE, TPEx, MOPS, TDCC, TAIFEX, NDC]
    # independent source lanes; never permit simultaneous writers for a source
    concurrency:
      group: v0968-r8-raw-${{ matrix.source }}
      cancel-in-progress: false
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      V0968_SOURCE: ${{ matrix.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Google Drive SDK
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2
      - name: Strict syntax check of RAW-only worker
        run: python -m py_compile scripts/v0968_r8_2026_sixlane_raw_copy.py
      - name: Server-side copy legacy RAW -> separate v0.968 R8 Bronze
        run: python -u -m scripts.v0968_r8_2026_sixlane_raw_copy --source "$V0968_SOURCE" --limit 600 --seconds 1050
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v0968-2026-raw-${{ matrix.source }}-${{ github.run_id }}
          path: v0968_sixlane/
          retention-days: 30
          if-no-files-found: warn
