name: JARVIS v097 Bronze v2.1 Direct READY Release Only
# Explicitly NEVER starts Silver conversion or Gold, no raw mutations.
# Resume from existing frozen Bronze/QA/V2 checkpoints: 2026-11-17.
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/v097_bronze_direct_release_v21.py
      - .github/workflows/v097_bronze_v21_direct_release.yml
  schedule:
    - cron: '10,25,40,55 * * * *'
permissions:
  contents: read
concurrency:
  group: v097-bronze-v21-direct-release
  cancel-in-progress: false
jobs:
  strict-source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: Positive and negative verification tests for no false READY
        run: |
          set -euo pipefail
          python -m py_compile scripts/v097_bronze_direct_release_v21.py
          PYTHONPATH=. python scripts/v097_bronze_direct_release_v21.py selftest
          PYTHONPATH=. python scripts/v097_ap_silver_input_gate_all.py selftest
  seven-source-direct-release:
    needs: strict-source-tests
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        source: [TWSE, TPEx, MOPS, TDCC, TAIFEX, NDC, FinMind]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: Verify frozen old and new SHA/QA proof, publish immutable Bronze READY and HOLD per source
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: PYTHONPATH=. python scripts/v097_bronze_direct_release_v21.py '${{ matrix.source }}'
  publish-formal-v21:
    needs: [strict-source-tests, seven-source-direct-release]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Fail closed on incomplete source verification
        env:
          TEST: ${{ needs.strict-source-tests.result }}
          GATE: ${{ needs.seven-source-direct-release.result }}
        run: |
          set -euo pipefail
          echo "TEST=$TEST GATE=$GATE"
          test "$TEST" = success
          test "$GATE" = success
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: Verify exact unique 74750 and publish Silver-input eligibility only
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/v097_bronze_direct_release_v21.py final
          echo "NO_SILVER_CONVERSION_NO_GOLD_NO_RAW_MUTATION"
