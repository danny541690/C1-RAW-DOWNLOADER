name: JARVIS v0.95 TAIFEX 2026 monthly market-date completion
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v095-taifex-2026-monthly-calendar.yml'
permissions:
  contents: read
jobs:
  real-2026-futures-dates:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate 2026 official monthly session parser
        run: python -m py_compile scripts/v095_taifex_2026_monthly_dates.py
      - name: Fetch actual 2026 TAIFEX market dates and verify source period
        run: |
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2
          python -u -m scripts.v095_taifex_2026_monthly_dates
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v095-taifex-2026-calendar-${{ github.run_id }}
          path: |
            v095_taifex_2026_dates/taifex_2026_confirmed.csv
            v095_taifex_2026_dates/taifex_2026_receipt.json
          retention-days: 90
          if-no-files-found: warn
