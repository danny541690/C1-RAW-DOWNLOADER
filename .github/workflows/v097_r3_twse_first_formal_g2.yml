name: JARVIS R3 first real TWSE source vintage G2 margin pilot
on:
  push:
    branches: [r3-bronze-silver-ready-staging-20261118]
    paths: ['.github/workflows/v097_r3_twse_first_formal_g2.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jarvis-r3-twse-first-source-vintage-g2
  cancel-in-progress: false
jobs:
  real-official-twse-native-approval:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: TWSE official 2001 margin API to frozen ZIP native verified source-vintage G2
        run: |
          set -euo pipefail
          python -m py_compile scripts/v097_r3_twse_first_formal_g2_source_vintage.py
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_v097_r3_g2_source_vintage.py' -v
          PYTHONPATH=. python scripts/v097_r3_twse_first_formal_g2_source_vintage.py
      - if: always()
        run: echo 'Historical 2001 observation is NOT 2001 contemporaneous publication/PIT. Version scoped to verified 2026 snapshot, Bronze read-only and no Silver/Gold.' >> "$GITHUB_STEP_SUMMARY"
