name: JARVIS v0.97 TDCC official G2 portal-v2 exact-date acceptance
# 2026-11-20 v0.98 preflight freeze: automated triggers disabled, preserve manual only.
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: jarvis-v097-tdcc-first-party-v2
  cancel-in-progress: false
jobs:
  tdcc_official_match:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      G2_FULL_FILE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install strict first-party verification requirements
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: Compile and check native TDCC format, date and G2 contract
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/v097_two_source_exact_date_backcheck.py
          PYTHONPATH=. python scripts/v097_two_source_exact_date_backcheck.py selftest | tee tdcc_selftest.log
          PYTHONPATH=. python scripts/v097_two_source_native_date_diff.py selftest | tee -a tdcc_selftest.log
      - name: Validate Bronze SHA and all 16 tiers against first-party TDCC portal
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python scripts/v097_two_source_exact_date_backcheck.py source TDCC 2>&1 | tee tdcc_g2_portal_v2.log
      - name: Post true Gate and Drive evidence links (not job success as a G2 claim)
        if: always()
        shell: bash
        run: |
          echo '## TDCC G2 Portal-v2 verification' >> "$GITHUB_STEP_SUMMARY"
          echo "Run: ${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo 'Official G2 PASS requires full-file first-party identical rows and a read-back R1_G2_DATASET_CERT_V2. Inspect MATCHED_ORIGINAL_SOURCE below.' >> "$GITHUB_STEP_SUMMARY"
          grep 'MATCHED_ORIGINAL_SOURCE=' tdcc_g2_portal_v2.log >> "$GITHUB_STEP_SUMMARY" || true
          echo 'Bronze read-only; Silver and Gold disabled.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tdcc-v097-g2-portal-v2-${{ github.run_id }}
          path: |
            tdcc_selftest.log
            tdcc_g2_portal_v2.log
          if-no-files-found: warn
          retention-days: 30
