name: JARVIS v0.97 seven-source small format verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v097_seven_source_format_smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jarvis-v097-seven-format-smoke-readonly
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4 openpyxl
      - name: Seven-source historical template regression
        run: |
          set -euo pipefail
          python -m py_compile scripts/v097_seven_source_format_smoke.py
          PYTHONPATH=. python scripts/v097_seven_historical_format_registry.py selftest
          PYTHONPATH=. python scripts/v097_v3_contract_registry.py selftest
          PYTHONPATH=. python scripts/v097_g2g3_native_headers.py selftest
          PYTHONPATH=. python scripts/v097_g2g3_tdcc_native_html.py selftest
          PYTHONPATH=. python scripts/v097_g2g3_full_native_validation.py selftest
          PYTHONPATH=. python scripts/v097_seven_source_format_smoke.py selftest
  samples:
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        source: [TWSE, TPEx, MOPS, TDCC, TAIFEX, NDC, FinMind]
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      SEVEN_SMOKE_N: '6'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Drive and parser dependencies
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4 openpyxl
      - name: Audit 6 original files per source against versioned format candidates
        run: PYTHONPATH=. python scripts/v097_seven_source_format_smoke.py sample "${{ matrix.source }}"
      - name: Mark smoke-only safety boundary
        if: always()
        run: echo 'FORMAT_CANDIDATE evidence only; no formal G2/G3 PASS, Bronze writes, or Silver/Gold.' >> "$GITHUB_STEP_SUMMARY"
