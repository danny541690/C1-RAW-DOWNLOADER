name: JARVIS v0.97 - Bronze diagnosis and repair triage - six lanes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v097-bronze-diagnosis-six-lanes.yml'
      - 'scripts/v097_bronze_diagnosis.py'
      - 'scripts/v097_bronze_remediation.py'
      - 'scripts/v097_continue_workflow.py'
  workflow_dispatch:
  workflow_run:
    workflows:
      - JARVIS v0.97 - Bronze bounded content QA - six lanes
    types: [completed]
permissions:
  contents: read
  actions: write
concurrency:
  group: v097-bronze-diagnosis
  cancel-in-progress: false
jobs:
  diagnose-six-lanes:
    if: github.repository == 'danny541690/C1-RAW-DOWNLOADER'
    name: Bronze diagnosis lane ${{ matrix.lane }} of 6
    runs-on: ubuntu-latest
    timeout-minutes: 310
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        lane: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Drive and repair dependencies
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests
      - name: Verify diagnosis Python syntax
        run: python -m py_compile scripts/v097_bronze_content_qa.py scripts/v097_bronze_diagnosis.py
      - name: Diagnose prior completed QA receipts, retry read failures, preserve evidence
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DIAG_MODE: lane
          DIAG_LANE: ${{ matrix.lane }}
          DIAG_MAX_RECEIPTS_PER_LANE: '48'
        run: PYTHONPATH=. python scripts/v097_bronze_diagnosis.py
  recover-six-lanes:
    if: github.repository == 'danny541690/C1-RAW-DOWNLOADER'
    needs: diagnose-six-lanes
    runs-on: ubuntu-latest
    timeout-minutes: 310
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        lane: [0, 1, 2, 3, 4, 5]
    name: Bronze B repair lane ${{ matrix.lane }} of 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Drive and strict HTTP client
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests
      - name: Check B repair program syntax
        run: python -m py_compile scripts/v097_bronze_content_qa.py scripts/v097_bronze_diagnosis.py scripts/v097_bronze_remediation.py
      - name: Incremental repair v0.93 then 6 official sources then FinMind (verified mappings only)
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          REPAIR_LANE: ${{ matrix.lane }}
          REPAIR_MAX_FILES_PER_LANE: '12'
        run: PYTHONPATH=. python scripts/v097_bronze_remediation.py
  aggregate-private-drive:
    if: github.repository == 'danny541690/C1-RAW-DOWNLOADER'
    needs: [diagnose-six-lanes, recover-six-lanes]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Drive client
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib
      - name: Consolidate issue diagnosis, per-source queue and checkpoint
        id: diag_merge
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DIAG_MODE: aggregate
        run: PYTHONPATH=. python scripts/v097_bronze_diagnosis.py
      - name: Continue B immediately when QA receipt backlog remains
        if: ${{ steps.diag_merge.outputs.pending_receipts != '0' && steps.diag_merge.outputs.pending_receipts != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CONTINUE_GROUP: B
        run: python scripts/v097_continue_workflow.py
      - name: Aggregate verified repair evidence and remaining mapping gaps
        id: repair_merge
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          REPAIR_MODE: aggregate
        run: PYTHONPATH=. python scripts/v097_bronze_remediation.py

      - name: Continue B for repair backlog if diagnosis queue was already drained
        if: ${{ steps.diag_merge.outputs.pending_receipts == '0' && steps.repair_merge.outputs.pending_repair != '0' && steps.repair_merge.outputs.pending_repair != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CONTINUE_GROUP: B
        run: python scripts/v097_continue_workflow.py
