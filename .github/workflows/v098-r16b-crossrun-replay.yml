name: JARVIS v0.98 R16B Cross-Run Private Manifest Replay Gate
# Separate GitHub Run from R16. Strict read-only: no Drive uploads, no migrations.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jarvis-v098-r16b-replay-single
  cancel-in-progress: false
jobs:
  private-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        source: [TWSE, TPEx, MOPS, NDC, TDCC, TAIFEX]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'google-api-python-client>=2.140,<3' 'google-auth>=2.30,<3' 'google-auth-oauthlib>=1.2,<2'
      - name: Read back 27 private manifests per source from R16 in independent GitHub Run
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python scripts/v098_r16b_crossrun_manifest_replay.py --source "${{ matrix.source }}" --out r16b_receipts/${{ matrix.source }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r16b-public-receipt-${{ matrix.source }}
          path: r16b_receipts/
          if-no-files-found: warn
  reconcile:
    needs: private-replay
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: r16b-public-receipt-*
          path: r16b_receipts
          merge-multiple: true
      - name: Six-account cross-run reconciliation without additional Drive writes
        run: |
          python - <<'PY'
          import json,pathlib,sys
          records=[json.loads(f.read_text()) for f in pathlib.Path('r16b_receipts').glob('*.json')]
          expected={'TWSE':12346,'TPEx':14383,'MOPS':2594,'NDC':320,'TDCC':45439,'TAIFEX':3199}
          if len(records)!=6 or {x['source'] for x in records}!=set(expected):sys.exit('Missing source account')
          for r in records:
              if r['status']!='PASS_CROSS_RUN_PRIVATE_MANIFEST_REPLAY' or r['verified_manifests']!=27 or r['files']!=expected[r['source']] or r['new_files_created']!=0:
                  sys.exit('Mismatch in cross-run private source manifest')
          result={'status':'PASS_CROSS_RUN_PRIVATE_MANIFEST_REPLAY','years':27,'sources':6,'manifests':162,'files':sum(x['files'] for x in records),
                  'new_uploads':0,'duplicate_raw_file_ids':0,
                  'real_2026_11_20_source_snapshot':'R16 prior-run',
                  'production_atomic_CAS_certified':False,'dataset_expected_coverage_certified':False,'bulk_migration_allowed':False,
                  'per_source':[{'source':x['source'],'files':x['files'],'manifests':x['verified_manifests']} for x in records]}
          pathlib.Path('r16b_final').mkdir(exist_ok=True)
          pathlib.Path('r16b_final/summary.json').write_text(json.dumps(result,indent=2))
          print(json.dumps({k:v for k,v in result.items() if k!='per_source'}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r16b-replay-central-report
          path: r16b_final/
          if-no-files-found: warn
