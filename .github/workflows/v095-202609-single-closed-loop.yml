name: JARVIS v0.95 2026-09 SINGLE unified Bronze Silver Gold AI gate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v095-202609-single-closed-loop.yml'
      - 'scripts/v095_202609_ai_query_gate.py'
      - 'scripts/v095_202609_R3_scheduler.py'
  schedule:
    - cron: '17 11 * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: jarvis-v095-202609-single-workflow
  cancel-in-progress: false
jobs:
  monthly-closed-loop:
    if: github.repository == 'danny541690/C1-RAW-DOWNLOADER'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source and QA runtime once
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 pyarrow
      - name: Check source > Silver > Gold checkpoints and dispatch only real missing work
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python scripts/v095_202609_R3_scheduler.py
      - name: Verify real Drive Gold artifacts, 443 identity coverage and AI query access contract
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python scripts/v095_202609_ai_query_gate.py
      - name: Retain Bronze/Silver/Gold/PIT and AI readiness receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v095-202609-single-loop-${{ github.run_id }}
          path: |
            v095_202609_R3/
            v095_september_ai_query/
          retention-days: 90
          if-no-files-found: warn
