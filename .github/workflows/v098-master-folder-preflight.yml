name: JARVIS v0.98 Six-Lane Master Year-Folder Preflight
on:
  push:
    branches: [jarvis-v098-bronze-copy-only-20261120]
    paths:
      - .github/workflows/v098-master-folder-preflight.yml
permissions:
  contents: read
jobs:
  create-year-source-folders-once:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile scripts/v098_copy_master.py
      - run: python -m pip install --disable-pip-version-check 'google-api-python-client>=2.140,<3' 'google-auth>=2.30,<3'
      - name: Create safe empty 2000-2026 year/source folder hierarchy, reject duplicates
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python scripts/v098_copy_master.py --mode prepare-only
