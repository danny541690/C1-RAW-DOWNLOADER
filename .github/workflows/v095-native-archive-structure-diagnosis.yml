name: JARVIS v0.95 bounded legacy source ZIP structure diagnosis
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v095-native-archive-structure-diagnosis.yml'
      - 'scripts/v095_native_legacy_zip_structure_probe.py'
      - 'scripts/v095_2026_four_source_archive_intake.py'
      - 'tests/test_v095_legacy_native_manifest_versions.py'
permissions:
  contents: read
jobs:
  source-zip-structure:
    if: github.repository == 'danny541690/C1-RAW-DOWNLOADER'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        source: [MOPS,TDCC,TAIFEX,NDC]
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      V095_BRONZE_SOURCE: ${{ matrix.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify strict ZIP adapter and source-specific manifest safeguards
        run: |
          python -m pip install --disable-pip-version-check pyarrow google-api-python-client google-auth google-auth-httplib2
          python -m unittest discover -s tests -p 'test_v095_legacy_native_manifest_versions.py' -v
      - name: Read only five failing legacy archive headers, retain safe SHA evidence
        run: python -u -m scripts.v095_native_legacy_zip_structure_probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v095-zip-source-structure-${{ matrix.source }}-${{ github.run_id }}
          path: v095_native_archive_probe/
          retention-days: 90
          if-no-files-found: warn
