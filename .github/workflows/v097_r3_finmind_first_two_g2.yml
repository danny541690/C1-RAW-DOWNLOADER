name: JARVIS R3 FINMIND FIRST TWO ACTUAL G2 APPROVED NATIVE SOURCE VINTAGE
on:
  push:
    branches: [r3-bronze-silver-ready-staging-20261118]
    paths: ['.github/workflows/v097_r3_finmind_first_two_g2.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jarvis-r3-finmind-first-two-formal-native-source-vintage
  cancel-in-progress: false
jobs:
  verify-approve-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: Independently recheck both native official-provider API responses and commit immutable G2 proof
        run: |
          set -euo pipefail
          python -m py_compile scripts/v097_r3_finmind_first_two_formal_g2.py
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_v097_r3_g2_source_vintage.py' -v
          PYTHONPATH=. python scripts/v097_r3_finmind_first_two_formal_g2.py
      - if: always()
        run: echo 'Source-vintage 2026 snapshot only; 2000/2022 contemporaneous PIT NOT certified. No Bronze, Silver, Gold or primary G5 Master changes.' >> "$GITHUB_STEP_SUMMARY"
