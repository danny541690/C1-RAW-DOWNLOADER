name: JARVIS v0.98 R19 Cohort Scope and Native Format Combined Gate
# Original 0.93 and Bronze 0.98 immutable. R16 manifests reused. Aggregate-only public outputs.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jarvis-v098-r19-single-controller
  cancel-in-progress: false
jobs:
  corrected-cohort:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify v097 7-source and v098 6-official population arithmetic
        run: python scripts/v098_r19_cohort_and_native_format.py baseline --out r19_cohort/corrected_cohort.json
      - uses: actions/upload-artifact@v4
        with:
          name: r19-official-cohort
          path: r19_cohort/
          if-no-files-found: error
  six-source-samples:
    needs: corrected-cohort
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        source: [TWSE, TPEx, MOPS, NDC, TDCC, TAIFEX]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Google Drive API library
        run: python -m pip install --disable-pip-version-check 'google-api-python-client>=2.140,<3' 'google-auth>=2.30,<3' 'google-auth-oauthlib>=1.2,<2'
      - name: Inspect one real file per official source, ZIP members and parser shape only
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python scripts/v098_r19_cohort_and_native_format.py sample --source "${{ matrix.source }}" --out r19_samples/${{ matrix.source }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r19-source-${{ matrix.source }}
          path: r19_samples/
          if-no-files-found: warn
  reconcile:
    needs: [corrected-cohort, six-source-samples]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: r19-official-cohort
          path: r19_cohort/
      - uses: actions/download-artifact@v4
        with:
          pattern: r19-source-*
          path: r19_samples/
          merge-multiple: true
      - name: Reconcile cohort arithmetic and format samples, keep semantic validation HOLD
        run: |
          python - <<'PY'
          import json,pathlib,sys
          a=json.loads(pathlib.Path('r19_cohort/corrected_cohort.json').read_text())
          sources=[json.loads(f.read_text()) for f in pathlib.Path('r19_samples').glob('*.json')]
          src={'TWSE','TPEx','MOPS','NDC','TDCC','TAIFEX'}
          if a.get('status')!='PASS_SCOPE_CORRECTED' or a['official_delta']!=7231:sys.exit('Cohort error')
          if len(sources)!=6 or {x.get('source') for x in sources}!=src:sys.exit('Incomplete six-source format audit')
          if any(x['status']=='SCAN_ERROR' for x in sources):sys.exit('Real source format read error')
          report={'status':'PASS_SCOPE_AND_FORMAT_PILOT_WITH_HOLDS',
            'official_v097':a['official_old'],'official_v098':a['official_new'],
            'corrected_official_delta':a['official_delta'],'finmind_separate':a['finmind_old_separate'],
            'six_source_sampled':sum(x.get('sampled',0) for x in sources),
            'crc_pass_sources':sum(x.get('archive_crc')=='PASS' for x in sources),
            'semantic_dataset_headers_approved':False,
            'memberwise_legacy_74750_join_complete':False,
            'remote_atomic_master_approved':False,
            'real_Bronze_canary_approved':False,'bulk_migration_allowed':False,
            'source_shapes':sources}
          pathlib.Path('r19_final').mkdir(exist_ok=True)
          pathlib.Path('r19_final/summary.json').write_text(json.dumps(report,indent=2))
          print(json.dumps({k:v for k,v in report.items() if k!='source_shapes'}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r19-corrected-cohort-and-format-report
          path: r19_final/
          if-no-files-found: warn
