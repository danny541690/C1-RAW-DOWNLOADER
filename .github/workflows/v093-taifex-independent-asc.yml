name: JARVIS independent TAIFEX download 6-1 ASC
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v093-taifex-independent-asc.yml'
      - 'scripts/v093_taifex_independent.py'
      - 'scripts/taifex_verified_catalog.json'
      - 'tests/test_taifex_recovery_v4.py'
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jarvis-independent-taifex-stage06-asc
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  download:
    name: Independent TAIFEX oldest to midpoint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-qa.lock
      - run: pip install -r requirements-qa.lock
      - name: Validate TAIFEX native format repairs, preservation and retry safety
        run: python -m unittest discover -s tests -q
      - name: Download TAIFEX only; resume verified immutable receipts
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python -m scripts.v093_taifex_independent --minutes 45 --direction ASC
