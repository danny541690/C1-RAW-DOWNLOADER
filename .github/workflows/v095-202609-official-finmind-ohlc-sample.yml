name: JARVIS 2026-09 official Bronze vs FinMind Free OHLC 2-stock diagnostic
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v095-202609-official-finmind-ohlc-sample.yml'
      - 'tests/v095_202609_finmind_official_ohlc_sample.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jarvis-v095-202609-official-finmind-sample
  cancel-in-progress: false
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        code: ["2330", "6488"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2
      - name: Crosscheck unadjusted 20-day OHLC and record all source differences
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python tests/v095_202609_finmind_official_ohlc_sample.py --code ${{ matrix.code }}
      - name: Retain source differences as evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v095-202609-finmind-official-ohlc-${{ matrix.code }}-${{ github.run_id }}
          path: v095_202609_ohlc_crosscheck/
          retention-days: 60
          if-no-files-found: warn
