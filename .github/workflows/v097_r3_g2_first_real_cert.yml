name: JARVIS R3 G2 first REAL NDC TAIFEX official cert discovery
on:
  push:
    branches: [r3-bronze-silver-ready-staging-20261118]
    paths: ['.github/workflows/v097_r3_g2_first_real_cert.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jarvis-r3-first-real-g2-discovery
  cancel-in-progress: false
jobs:
  official-native-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - run: PYTHONPATH=. python scripts/v097_r3_g2_first_real_cert_discovery.py
      - if: always()
        run: echo 'Official spec, original archive, and independent review mandatory; no PASS without full evidence.' >> "$GITHUB_STEP_SUMMARY"
