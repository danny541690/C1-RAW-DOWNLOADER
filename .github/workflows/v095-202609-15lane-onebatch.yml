name: JARVIS v0.95 2026-09 FIFTEEN-LANE Bronze Silver Gold QA batch
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v095-202609-15lane-onebatch.yml'
concurrency:
  group: jarvis-v095-sept-15lane-onebatch
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  bronze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        lane: [B1-v093-manifest, B2-tpex-official-gaps, B3-finmind-free-calendar, B4-contract-audit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lane runtime
        run: python -m pip install --disable-pip-version-check pyarrow openpyxl google-api-python-client google-auth google-auth-httplib2 requests
      - name: Execute bounded native Bronze Silver Gold or QA lane
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fifteen_lane_receipts
          echo "lane=${{ matrix.lane }}" > "fifteen_lane_receipts/${{ matrix.lane }}.txt"
          case "${{ matrix.lane }}" in
            B1-v093-manifest)
              python scripts/v095_202609_3tier_inventory.py
              ;;
            B2-tpex-official-gaps)
              python tests/v095_202609_tpex_gap_recheck.py --category prices && python tests/v095_202609_tpex_gap_recheck.py --category institutional
              ;;
            B3-finmind-free-calendar)
              python tests/v095_202609_finmind_free_calendar_check.py
              ;;
            B4-contract-audit)
              python tests/v095_202609_bronze_governance_admission.py
              ;;
            *) echo "UNKNOWN_LANE"; exit 2;;
          esac
          echo "execution_completed=true" >> "fifteen_lane_receipts/${{ matrix.lane }}.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fifteen-${{ matrix.lane }}-${{ github.run_id }}
          path: |
            fifteen_lane_receipts/
            v095_202609_3tier_inventory/
            v095_202609_tpex_gap_recheck/
            v095_202609_bronze_admission/
            v095_202609_silver_202609/
            v095_silver_202609/
            v095_202609_multi_silver/
            v095_silver_mops_202609/
            v095_202609_taifex_ndc_silver/
            v095_silver_tdcc_202609/
            v095_202609_gold_descriptive/
            gold_subscope_evidence/
            v095_gold_valuation_foreign/
            tdcc_gold_qa/
            v095_202609_silver_release/
            v095_202609_typed_silver/
            v095_september_ai_query/
          retention-days: 60
          if-no-files-found: warn
  silver:
    needs: [bronze]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        lane: [S1-ohlcv, S2-chip-credit, S3-mops, S4-taifex-ndc, S5-tdcc]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lane runtime
        run: python -m pip install --disable-pip-version-check pyarrow openpyxl google-api-python-client google-auth google-auth-httplib2 requests
      - name: Execute bounded native Bronze Silver Gold or QA lane
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fifteen_lane_receipts
          echo "lane=${{ matrix.lane }}" > "fifteen_lane_receipts/${{ matrix.lane }}.txt"
          case "${{ matrix.lane }}" in
            S1-ohlcv)
              python scripts/v095_202609_silver_ohlcv_candidate.py
              ;;
            S2-chip-credit)
              for lane in twse-chip twse-financing tpex-chip tpex-financing; do python scripts/v095_202609_multi_silver_families.py --lane "$lane" || exit 1; done
              ;;
            S3-mops)
              python scripts/v095_202609_mops_silver_revenue_candidate.py
              ;;
            S4-taifex-ndc)
              for lane in taifex-options taifex-futures taifex-history ndc-workbook; do python scripts/v095_202609_taifex_ndc_four_lane.py --lane "$lane" || exit 1; done
              ;;
            S5-tdcc)
              state=$(gh api repos/danny541690/C1-RAW-DOWNLOADER/actions/runs/42142744262 --jq '.status' 2>/dev/null || echo unknown)
              if [ "$state" = "in_progress" ] || [ "$state" = "queued" ]; then
                echo "TDCC_SILVER_SKIPPED_ACTIVE_RUN=42142744262"
              else
                python scripts/v095_202609_tdcc_silver_candidate.py
              fi
              ;;
            *) echo "UNKNOWN_LANE"; exit 2;;
          esac
          echo "execution_completed=true" >> "fifteen_lane_receipts/${{ matrix.lane }}.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fifteen-${{ matrix.lane }}-${{ github.run_id }}
          path: |
            fifteen_lane_receipts/
            v095_202609_3tier_inventory/
            v095_202609_tpex_gap_recheck/
            v095_202609_bronze_admission/
            v095_202609_silver_202609/
            v095_silver_202609/
            v095_202609_multi_silver/
            v095_silver_mops_202609/
            v095_202609_taifex_ndc_silver/
            v095_silver_tdcc_202609/
            v095_202609_gold_descriptive/
            gold_subscope_evidence/
            v095_gold_valuation_foreign/
            tdcc_gold_qa/
            v095_202609_silver_release/
            v095_202609_typed_silver/
            v095_september_ai_query/
          retention-days: 60
          if-no-files-found: warn
  gold:
    needs: [silver]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        lane: [G1-technical-revenue, G2-chip-flow, G3-valuation, G4-tdcc-weekly]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lane runtime
        run: python -m pip install --disable-pip-version-check pyarrow openpyxl google-api-python-client google-auth google-auth-httplib2 requests
      - name: Execute bounded native Bronze Silver Gold or QA lane
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fifteen_lane_receipts
          echo "lane=${{ matrix.lane }}" > "fifteen_lane_receipts/${{ matrix.lane }}.txt"
          case "${{ matrix.lane }}" in
            G1-technical-revenue)
              for lane in tse revenue; do python scripts/v095_202609_gold_descriptive_2lane.py --lane "$lane" || exit 1; done
              ;;
            G2-chip-flow)
              for lane in otc-price otc-margin tse-flow; do python scripts/v095_202609_gold_subscope_3lane.py --lane "$lane" || exit 1; done
              ;;
            G3-valuation)
              python scripts/v095_202609_gold_valuation_foreign_3lane.py --lane tse-valuation
              ;;
            G4-tdcc-weekly)
              python scripts/v095_202609_tdcc_gold_weekly_delta.py
              ;;
            *) echo "UNKNOWN_LANE"; exit 2;;
          esac
          echo "execution_completed=true" >> "fifteen_lane_receipts/${{ matrix.lane }}.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fifteen-${{ matrix.lane }}-${{ github.run_id }}
          path: |
            fifteen_lane_receipts/
            v095_202609_3tier_inventory/
            v095_202609_tpex_gap_recheck/
            v095_202609_bronze_admission/
            v095_202609_silver_202609/
            v095_silver_202609/
            v095_202609_multi_silver/
            v095_silver_mops_202609/
            v095_202609_taifex_ndc_silver/
            v095_silver_tdcc_202609/
            v095_202609_gold_descriptive/
            gold_subscope_evidence/
            v095_gold_valuation_foreign/
            tdcc_gold_qa/
            v095_202609_silver_release/
            v095_202609_typed_silver/
            v095_september_ai_query/
          retention-days: 60
          if-no-files-found: warn
  qa:
    needs: [gold]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        lane: [Q1-silver-typed, Q2-gold-pit-ai]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lane runtime
        run: python -m pip install --disable-pip-version-check pyarrow openpyxl google-api-python-client google-auth google-auth-httplib2 requests
      - name: Execute bounded native Bronze Silver Gold or QA lane
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fifteen_lane_receipts
          echo "lane=${{ matrix.lane }}" > "fifteen_lane_receipts/${{ matrix.lane }}.txt"
          case "${{ matrix.lane }}" in
            Q1-silver-typed)
              python scripts/v095_202609_silver_scoped_descriptive_release.py && python scripts/v095_202609_typed_silver_gate.py --lane twse-flow && python scripts/v095_202609_typed_silver_gate.py --lane twse-credit
              ;;
            Q2-gold-pit-ai)
              python scripts/v095_202609_ai_query_gate.py && python scripts/v095_202609_443_catalog.py
              ;;
            *) echo "UNKNOWN_LANE"; exit 2;;
          esac
          echo "execution_completed=true" >> "fifteen_lane_receipts/${{ matrix.lane }}.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fifteen-${{ matrix.lane }}-${{ github.run_id }}
          path: |
            fifteen_lane_receipts/
            v095_202609_3tier_inventory/
            v095_202609_tpex_gap_recheck/
            v095_202609_bronze_admission/
            v095_202609_silver_202609/
            v095_silver_202609/
            v095_202609_multi_silver/
            v095_silver_mops_202609/
            v095_202609_taifex_ndc_silver/
            v095_silver_tdcc_202609/
            v095_202609_gold_descriptive/
            gold_subscope_evidence/
            v095_gold_valuation_foreign/
            tdcc_gold_qa/
            v095_202609_silver_release/
            v095_202609_typed_silver/
            v095_september_ai_query/
          retention-days: 60
          if-no-files-found: warn
