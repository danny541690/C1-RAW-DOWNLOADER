name: JARVIS v0.95 publish schedule and error plan to Google Drive
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v095-publish-schedule-error-plan-drive.yml'
      - 'scripts/v095_publish_schedule_error_plan_to_drive.py'
      - 'governance/v095/JARVIS_V095_SCHEDULE_ERROR_PLAN_20261108.md'
permissions:
  contents: read
concurrency:
  group: jarvis-v095-drive-governance-snapshot
  cancel-in-progress: false
jobs:
  publish-schedule-and-remediation-governance:
    if: github.repository == 'danny541690/C1-RAW-DOWNLOADER'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check plan and schedule publisher syntax
        run: python -m py_compile scripts/v095_publish_schedule_error_plan_to_drive.py
      - name: Publish markdown and machine-readable status with immutable SHA readback
        run: |
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2
          python -u -m scripts.v095_publish_schedule_error_plan_to_drive
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v095-schedule-error-plan-drive-receipt-${{ github.run_id }}
          path: v095_schedule_governance/
          retention-days: 90
          if-no-files-found: warn
