name: JARVIS acceptance read-only RAW metadata inventory
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/jarvis-acceptance-remote-inventory.yml']
permissions:
  contents: read
concurrency:
  group: jarvis-acceptance-readonly-inventory
  cancel-in-progress: false
jobs:
  metadata-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-qa.lock
      - run: pip install -r requirements-qa.lock
      - name: Enumerate existing RAW metadata with pagination and local checkpoint
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python -m scripts.v093_acceptance_remote_inventory --out results/remote-inventory --max-requests 300 --max-seconds 480
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jarvis-remote-metadata-${{ github.sha }}
          path: results/remote-inventory/
