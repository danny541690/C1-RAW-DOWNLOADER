name: JARVIS v0.95 Consolidated 2026 YTD Three-Tier Trial
# Weekly read-only audit; explicit push/manual runs add only one bounded TWSE candidate canary.
on:
  workflow_dispatch:
  schedule:
    - cron: '23 18 * * 0'
  push:
    branches: [main]
    paths:
      - '.github/workflows/v095-r12-sep-nov-deep-manifest-retirement-preflight.yml'
      - 'scripts/v095_r12_deep_manifest_and_preflight.py'
      - 'tests/test_v095_r12_deep_manifest_preflight.py'
      - 'scripts/v095_r12_production_governance_gap_gate.py'
      - 'tests/test_v095_r12_governance_gap_gate.py'
      - 'scripts/v095_r12_drive_audit_archive.py'
      - 'tests/test_v095_r12_drive_audit_archive.py'
      - 'scripts/v095_r13_single_committer_contract.py'
      - 'tests/test_v095_r13_single_committer_contract.py'
      - 'scripts/v095_ultimate_r1_november_official.py'
      - 'scripts/v095_2026_annual_consolidated.py'
      - 'scripts/v095_2026_prior_raw_reuse_audit.py'
      - 'scripts/v095_2026_annual_drive_archive.py'
      - 'tests/test_v095_2026_annual_consolidated.py'
permissions:
  contents: read
concurrency:
  group: jarvis-v095-r12-bounded-deep-manifest
  cancel-in-progress: false
jobs:
  deep-manifest-and-blocker-retest:
    if: github.repository == 'danny541690/C1-RAW-DOWNLOADER' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Single merged R5 R7 R8 R11 R12 governance and fault-injection gate
        run: |
          python -m py_compile scripts/v095_r12_deep_manifest_and_preflight.py scripts/v095_r11_t1_three_month_manifest.py
          python -m unittest discover -s tests -p 'test_v095_r12_deep_manifest_preflight.py' -v
          python -m unittest discover -s tests -p 'test_v095_r12_governance_gap_gate.py' -v
          python -m unittest discover -s tests -p 'test_v095_r12_drive_audit_archive.py' -v
          python -m unittest discover -s tests -p 'test_v095_r11_t1_three_month_manifest.py' -v
          python -m unittest discover -s tests -p 'test_v095_r11_plan_contract_gate.py' -v
          python -m unittest discover -s tests -p 'test_v095_r8_official_semantic_gate.py' -v
          python scripts/v095_r8_official_semantic_gate.py
          python scripts/v095_r7_problem_only_dispatch.py --mode plan
          python scripts/v095_r5_full_history_discovery_queue.py
          python -m unittest discover -s tests -p 'test_v095_r13_single_committer_contract.py' -v
          python scripts/v095_r13_single_committer_contract.py
          python scripts/v095_r11_plan_contract_gate.py
          python scripts/v095_r12_production_governance_gap_gate.py
      - name: Install official Drive metadata client
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2
      - name: Bounded path discovery with no source download or Drive writes
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python scripts/v095_r12_deep_manifest_and_preflight.py
      - name: Verify source download and release gates remain closed
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          flags=json.load(open('governance/v095/PHASE1_FLAGS.json'))
          assert flags['BULK_COPY_APPROVED'] is False
          assert flags['RELEASE_APPROVED'] is False
          p=pathlib.Path('r12_deep_manifest/report.json')
          if not p.exists():raise SystemExit('MISSING_REPORT')
          r=json.loads(p.read_text())
          assert not r['preflight']['ready_to_download']
          assert r['source_data_downloads']==0 and r['drive_writes']==0
          assert r['source_expected_dataset_counts'] is None
          assert r['t2_write_gate']=='BLOCKED_NOT_PROVEN'
          import csv
          with pathlib.Path('r12_deep_manifest/candidate_manifest.csv').open(encoding='utf-8',newline='') as h:
            candidates=list(csv.DictReader(h))
          with pathlib.Path('r12_deep_manifest/repair_issue_queue.csv').open(encoding='utf-8',newline='') as h:
            issues=list(csv.DictReader(h))
          assert len(issues)==12
          assert len(candidates)==r['objects_examined']
          assert not any(x['eligible_download_task']=='True' for x in candidates)
          assert not any(x['native_sha256'] for x in candidates)
          assert pathlib.Path('r12_deep_manifest/public_report.json').exists()
          assert pathlib.Path('r12_deep_manifest/candidate_manifest_redacted.csv').exists()
          delta=json.load(open('r7_problem_only/report.json'))
          assert delta['download_count']==0 and delta['existing_files_rechecked']==0
          assert delta['skipped_prior_candidate_count']==12
          print('R12_MERGED_R7_DELTA_REUSED',delta['skipped_prior_candidate_count'])
          print('R12_CANDIDATE_MANIFEST',len(candidates),'ISSUES',len(issues))
          print('R12_NO_UNVERIFIED_PRODUCTION_WRITES',r['scan_status'])
          PY
      - name: One real official 2026-11-04 TWSE Bronze Silver Gold bounded canary
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          V095_SOURCE_FILTER: TWSE
          V095_CANARY_DATES: 2026-11-04
          V095_CANARY_REQUIRE_COMPLETE: '1'
        run: |
          python -m pip install --disable-pip-version-check pyarrow
          python -m py_compile scripts/v095_ultimate_r1_november_official.py
          python -m scripts.v095_ultimate_r1_november_official
      - name: Record one-unit candidate result without claiming PIT or production gate
        if: github.event_name != 'schedule' && always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('ultimate_r1/november_latest_bsg.json')
          if not p.exists(): raise SystemExit('REAL_CANARY_NO_RECEIPT')
          r=json.loads(p.read_text())
          assert len(r['completed'])==1 and not r['rejected'],r['rejected']
          assert r['pit_verified'] is False
          print('REAL_CANARY_ONE_UNIT',list(r['completed']),r['completed']['TWSE_2026-11-04']['actions'])
          PY
      - name: Archive safe periodic R12 audit to Google Drive Operations (never market-data writes)
        if: success()
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          python -m py_compile scripts/v095_r12_drive_audit_archive.py
          python scripts/v095_r12_drive_audit_archive.py
      - name: Keep immutable audit evidence and any truncated scan failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v095-r12-three-month-deep-manifest-${{ github.run_id }}
          path: |
            r11_pilot_contract/
            r13_single_pass/result.json
            ultimate_r1/november_latest_bsg.json
            r7_problem_only/report.json
            r8_official_semantics/result.json
            r12_governance_gaps/result.json
            r12_governance_gaps/drive_audit_receipt_public.json
            r12_deep_manifest/public_report.json
            r12_deep_manifest/candidate_manifest_redacted.csv
            r12_deep_manifest/repair_issue_queue.csv
          retention-days: 3
          if-no-files-found: warn

  annual-2026-three-tier-once:
    if: github.repository == 'danny541690/C1-RAW-DOWNLOADER' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: One pass compile tests and original v0.95 source governance
        run: |
          python -m py_compile scripts/v095_2026_annual_consolidated.py scripts/v095_2026_annual_drive_archive.py scripts/v095_ultimate_r1_november_official.py
          python -m unittest discover -s tests -p 'test_v095_2026_annual_consolidated.py' -v
          python -m unittest discover -s tests -p 'test_v095_r13_single_committer_contract.py' -v
          python scripts/v095_r12_production_governance_gap_gate.py
          python scripts/v095_r13_single_committer_contract.py
      - name: Install existing Parquet and Drive data readback tools
        run: python -m pip install --disable-pip-version-check pyarrow google-api-python-client google-auth google-auth-httplib2
      - name: Re-run TWO real verified TWSE candidate days with 3-tier immutable SHA and lineage
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          V095_SOURCE_FILTER: TWSE
          V095_CANARY_DATES: 2026-11-04,2026-11-06
          V095_CANARY_REQUIRE_COMPLETE: '1'
        run: python -m scripts.v095_ultimate_r1_november_official
      - name: Audit existing 2026 earlier RAW archives by month and bounded native ZIP SHA/CRC (reuse before redownload)
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          python -m py_compile scripts/v095_2026_prior_raw_reuse_audit.py
          python -m scripts.v095_2026_prior_raw_reuse_audit
      - name: Single real 2026 Jan-to-Nov-seven all-source three-tier path/contract scan
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python -m scripts.v095_2026_annual_consolidated
      - name: Assert no false year-complete or PIT and count actual 2026 stage status
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('annual_2026/report.json')
          if not p.exists():raise SystemExit('ANNUAL_REPORT_MISSING')
          r=json.loads(p.read_text())
          assert r['source_month_cells']==66 and r['calendar_months']==11
          assert r['eligible_dataset_denominator'] is None
          assert not r['all_year_tier_release'] and not r['production_cas_proven']
          assert r['governance']['production_ready_contracts']==0
          assert r['source_data_downloaded']==0
          assert r['current_canary']['status']=='PASS_SCOPED_REUSED_NO_PIT'
          assert len(r['current_canary']['days'])==2
          print('V095_2026_YTD_ACTUAL_FILE_CANDIDATES',r['object_candidates'])
          print('V095_2026_YTD_STAGE_CANDIDATES',r['stage_candidate_files_by_month'])
          print('V095_2026_NO_FALSE_COMPLETION',r['release_decision'])
          PY
      - name: Write unified 2026 Jan-Nov governance and lineage evidence to Google Drive Operations
        if: success()
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python -m scripts.v095_2026_annual_drive_archive
      - name: Preserve public-safe 2026 annual evidence and failed-state report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v095-2026-ytd-three-tier-evidence-${{ github.run_id }}
          path: |
            annual_2026_prior/reuse_report.json
            annual_2026/report.json
            annual_2026/source_month_status.csv
            annual_2026/sanitized_file_index.json
            annual_2026/drive_receipt.json
            r12_governance_gaps/result.json
            r13_single_pass/result.json
          retention-days: 7
          if-no-files-found: warn
