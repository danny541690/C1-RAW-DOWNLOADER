name: JARVIS v097 G2 G3 Formal Master Integration Safety
on:
  push:
    paths:
      - .github/workflows/v097_g2g3_formal_integration_safety.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Unified Master and all seven source contract guards
        run: |
          set -euo pipefail
          python -m py_compile scripts/v097_v3_unified_master.py scripts/v097_g2g3_formal_contracts_v2.py scripts/v097_g2g3_formal_contract_publisher.py scripts/v097_g2g3_typed_contract_audit.py scripts/v097_g2g3_tdcc_native_html.py
          PYTHONPATH=. python scripts/v097_v3_unified_master.py selftest
          PYTHONPATH=. python scripts/v097_g2g3_formal_contracts_v2.py selftest
          PYTHONPATH=. python scripts/v097_g2g3_formal_contract_publisher.py selftest
          PYTHONPATH=. python scripts/v097_v3_contract_registry.py selftest
          echo 'FORMAL_G2G3_UNIFIED_NO_BRONZE_SILVER_GOLD_WRITE'
