name: JARVIS resume all seven from saved checkpoints
on:
  push:
    paths:
      - '.github/workflows/v093-live-resume-watchdog.yml'
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
concurrency:
  group: jarvis-v093-resume-watchdog
  cancel-in-progress: false
jobs:
  resume-idle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resume all seven without cancelling active workers or changing cursors
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          repo=os.environ['GITHUB_REPOSITORY']
          base='https://api.github.com/repos/'+repo
          def api(path,method='GET',body=None):
              request=urllib.request.Request(base+path,method=method,
                  data=json.dumps(body).encode() if body is not None else None,
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=30) as response:
                  raw=response.read();return json.loads(raw) if raw else {}
          paths=['v093-v2-01-raw.yml','v093-v2-02-qa.yml','v093-v2-03-price.yml',
                 'v093-v2-04-financial.yml','v093-v2-05-chip.yml',
                 'v093-v2-06-reconcile-repair.yml','v093-v2-07-raw-ascending.yml']
          active={}
          # If inventory cannot be read, fail closed rather than creating duplicates.
          for page in range(1,4):
              runs=api('/actions/runs?per_page=100&page='+str(page))['workflow_runs']
              for run in runs:
                  if run['status']!='completed':
                      active.setdefault(run['path'],[]).append({'id':run['id'],'status':run['status']})
              if len(runs)<100:break
          for name in paths:
              path='.github/workflows/'+name
              if active.get(path):
                  print(json.dumps({'workflow':name,'decision':'KEEP_EXISTING','runs':active[path]}),flush=True)
                  continue
              payload={'ref':'main'}
              if name!='v093-v2-06-reconcile-repair.yml':
                  payload['inputs']={'minutes':'60'}
              # Stage seven also checks its durable stop-on-meeting state before any
              # source request. Recovery never clears that state or any worker cursor.
              try:
                  api('/actions/workflows/'+name+'/dispatches','POST',payload)
                  print(json.dumps({'workflow':name,'decision':'RESUME_SAVED_CHECKPOINT_DISPATCHED'}),flush=True)
              except urllib.error.HTTPError as exc:
                  print(json.dumps({'workflow':name,'decision':'RETRY_NEXT_CHECK',
                                    'http_status':exc.code,
                                    'reset':exc.headers.get('X-RateLimit-Reset') if exc.headers else None}),flush=True)
          PY
