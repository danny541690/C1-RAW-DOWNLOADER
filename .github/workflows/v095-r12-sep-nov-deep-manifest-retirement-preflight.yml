name: JARVIS v0.95 R13 Single-Pass Repair and Three-Month Preflight
# Weekly lightweight source metadata/issue audit; no Bronze downloads or Drive writes.
on:
  workflow_dispatch:
  schedule:
    - cron: '23 18 * * 0'
  push:
    branches: [main]
    paths:
      - '.github/workflows/v095-r12-sep-nov-deep-manifest-retirement-preflight.yml'
      - 'scripts/v095_r12_deep_manifest_and_preflight.py'
      - 'tests/test_v095_r12_deep_manifest_preflight.py'
      - 'scripts/v095_r12_production_governance_gap_gate.py'
      - 'tests/test_v095_r12_governance_gap_gate.py'
      - 'scripts/v095_r12_drive_audit_archive.py'
      - 'tests/test_v095_r12_drive_audit_archive.py'
      - 'scripts/v095_r13_single_committer_contract.py'
      - 'tests/test_v095_r13_single_committer_contract.py'
permissions:
  contents: read
concurrency:
  group: jarvis-v095-r12-bounded-deep-manifest
  cancel-in-progress: false
jobs:
  deep-manifest-and-blocker-retest:
    if: github.repository == 'danny541690/C1-RAW-DOWNLOADER'
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Single merged R5 R7 R8 R11 R12 governance and fault-injection gate
        run: |
          python -m py_compile scripts/v095_r12_deep_manifest_and_preflight.py scripts/v095_r11_t1_three_month_manifest.py
          python -m unittest discover -s tests -p 'test_v095_r12_deep_manifest_preflight.py' -v
          python -m unittest discover -s tests -p 'test_v095_r12_governance_gap_gate.py' -v
          python -m unittest discover -s tests -p 'test_v095_r12_drive_audit_archive.py' -v
          python -m unittest discover -s tests -p 'test_v095_r11_t1_three_month_manifest.py' -v
          python -m unittest discover -s tests -p 'test_v095_r11_plan_contract_gate.py' -v
          python -m unittest discover -s tests -p 'test_v095_r8_official_semantic_gate.py' -v
          python scripts/v095_r8_official_semantic_gate.py
          python scripts/v095_r7_problem_only_dispatch.py --mode plan
          python scripts/v095_r5_full_history_discovery_queue.py
          python -m unittest discover -s tests -p 'test_v095_r13_single_committer_contract.py' -v
          python scripts/v095_r13_single_committer_contract.py
          python scripts/v095_r11_plan_contract_gate.py
          python scripts/v095_r12_production_governance_gap_gate.py
      - name: Install official Drive metadata client
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2
      - name: Bounded path discovery with no source download or Drive writes
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python scripts/v095_r12_deep_manifest_and_preflight.py
      - name: Verify source download and release gates remain closed
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          flags=json.load(open('governance/v095/PHASE1_FLAGS.json'))
          assert flags['BULK_COPY_APPROVED'] is False
          assert flags['RELEASE_APPROVED'] is False
          p=pathlib.Path('r12_deep_manifest/report.json')
          if not p.exists():raise SystemExit('MISSING_REPORT')
          r=json.loads(p.read_text())
          assert not r['preflight']['ready_to_download']
          assert r['source_data_downloads']==0 and r['drive_writes']==0
          assert r['source_expected_dataset_counts'] is None
          assert r['t2_write_gate']=='BLOCKED_NOT_PROVEN'
          import csv
          with pathlib.Path('r12_deep_manifest/candidate_manifest.csv').open(encoding='utf-8',newline='') as h:
            candidates=list(csv.DictReader(h))
          with pathlib.Path('r12_deep_manifest/repair_issue_queue.csv').open(encoding='utf-8',newline='') as h:
            issues=list(csv.DictReader(h))
          assert len(issues)==12
          assert len(candidates)==r['objects_examined']
          assert not any(x['eligible_download_task']=='True' for x in candidates)
          assert not any(x['native_sha256'] for x in candidates)
          assert pathlib.Path('r12_deep_manifest/public_report.json').exists()
          assert pathlib.Path('r12_deep_manifest/candidate_manifest_redacted.csv').exists()
          delta=json.load(open('r7_problem_only/report.json'))
          assert delta['download_count']==0 and delta['existing_files_rechecked']==0
          assert delta['skipped_prior_candidate_count']==12
          print('R12_MERGED_R7_DELTA_REUSED',delta['skipped_prior_candidate_count'])
          print('R12_CANDIDATE_MANIFEST',len(candidates),'ISSUES',len(issues))
          print('R12_NO_UNVERIFIED_PRODUCTION_WRITES',r['scan_status'])
          PY
      - name: Archive safe periodic R12 audit to Google Drive Operations (never market-data writes)
        if: success()
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          python -m py_compile scripts/v095_r12_drive_audit_archive.py
          python scripts/v095_r12_drive_audit_archive.py
      - name: Keep immutable audit evidence and any truncated scan failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v095-r12-three-month-deep-manifest-${{ github.run_id }}
          path: |
            r11_pilot_contract/
            r13_single_pass/result.json
            r7_problem_only/report.json
            r8_official_semantics/result.json
            r12_governance_gaps/result.json
            r12_governance_gaps/drive_audit_receipt_public.json
            r12_deep_manifest/public_report.json
            r12_deep_manifest/candidate_manifest_redacted.csv
            r12_deep_manifest/repair_issue_queue.csv
          retention-days: 3
          if-no-files-found: warn
