name: JARVIS v0.98 R8 Seven-Ledger Preflight (Synthetic, Manual)
# PRE-MIGRATION SAFETY: synthetic only. No Drive credentials, no real records.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v098-r8-preflight-single
  cancel-in-progress: false
jobs:
  contract-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify central dispatch and ledger contract safety
        run: python scripts/v098_r8_seven_ledger_contract.py selftest --report tests_out/selftest.json
      - uses: actions/upload-artifact@v4
        with:
          name: r8-selftest-evidence
          path: tests_out/
          if-no-files-found: error
  central-dispatch:
    needs: contract-selftest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Issue six centrally signed-by-identity synthetic assignments
        run: python scripts/v098_r8_seven_ledger_contract.py plan --run-id "${{ github.run_id }}" --dispatch dispatch
      - uses: actions/upload-artifact@v4
        with:
          name: r8-central-dispatch
          path: dispatch/
          if-no-files-found: error
  source-worker:
    needs: central-dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        source: [TWSE, TPEx, MOPS, NDC, TDCC, TAIFEX]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: r8-central-dispatch
          path: dispatch
      - name: Execute only assigned source task and write a receipt
        run: python scripts/v098_r8_seven_ledger_contract.py worker --source "${{ matrix.source }}" --dispatch dispatch --receipts receipts
      - uses: actions/upload-artifact@v4
        with:
          name: r8-source-${{ matrix.source }}
          path: receipts/
          if-no-files-found: error
  central-reconciler:
    needs: [central-dispatch, source-worker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: r8-central-dispatch
          path: dispatch
      - uses: actions/download-artifact@v4
        with:
          pattern: r8-source-*
          path: receipts
          merge-multiple: true
      - name: Single writer commit and replay
        run: |
          python scripts/v098_r8_seven_ledger_contract.py reconcile --dispatch dispatch --receipts receipts --db r8_preflight_evidence/master.sqlite --report r8_preflight_evidence/summary.json
          python scripts/v098_r8_seven_ledger_contract.py reconcile --dispatch dispatch --receipts receipts --db r8_preflight_evidence/master.sqlite --report r8_preflight_evidence/replay.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r8-seven-ledger-preflight-report
          path: r8_preflight_evidence/
          if-no-files-found: warn
