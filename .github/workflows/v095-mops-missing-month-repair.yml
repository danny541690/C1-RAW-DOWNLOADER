name: JARVIS v0.95 MOPS only failed history months repair
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v095-mops-missing-month-repair.yml'
permissions:
  contents: read
concurrency:
  group: jarvis-v095-mops-only-missing-month-repair
  cancel-in-progress: false
jobs:
  mops-missing-months:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {start: 2000, end: 2004}
          - {start: 2005, end: 2009}
          - {start: 2010, end: 2014}
          - {start: 2015, end: 2019}
          - {start: 2020, end: 2023}
          - {start: 2024, end: 2026}
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile exact official source-only correction
        run: python -m py_compile scripts/v095_mops_historical_missing_month_repair.py
      - name: Read prior immutable SHA-verified reports and request failed source-months only
        run: |
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2
          python -u -m scripts.v095_mops_historical_missing_month_repair --start ${{ matrix.start }} --end ${{ matrix.end }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mops-only-missing-${{ matrix.start }}-${{ matrix.end }}-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          path: v095_mops_date_repair/*repair_receipt.json
