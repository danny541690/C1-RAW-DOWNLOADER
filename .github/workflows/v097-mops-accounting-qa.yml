name: JARVIS v0.97 - MOPS accounting numeric QA
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v097_mops_accounting_identity_qa.py'
      - '.github/workflows/v097-mops-accounting-qa.yml'
  workflow_dispatch:
  schedule:
    - cron: '18,48 * * * *'
permissions:
  contents: read
concurrency:
  group: v097-mops-accounting-qa-single
  cancel-in-progress: false
jobs:
  selftest:
    if: github.repository == 'danny541690/C1-RAW-DOWNLOADER'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - run: |
          python -m py_compile scripts/v097_mops_accounting_identity_qa.py
          PYTHONPATH=. python scripts/v097_mops_accounting_identity_qa.py
  six-qa-lanes:
    needs: selftest
    runs-on: ubuntu-latest
    timeout-minutes: 105
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        lane: [0,1,2,3,4,5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: Check immutable raw-derived MOPS cashflow arithmetic and SHA
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          CASHFLOW_ID_MODE: lane
          MOPS_ID_LANE: ${{ matrix.lane }}
        run: |
          for i in $(seq 1 12); do
            line=$(PYTHONPATH=. python scripts/v097_mops_accounting_identity_qa.py)
            echo "$line"
            if echo "$line" | grep -q '"remaining": 0'; then break; fi
          done
  summary:
    needs: six-qa-lanes
    if: always() && needs.six-qa-lanes.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: Publish financial calculation QA pass/fail separately from PIT and Bronze
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          CASHFLOW_ID_MODE: summary
        run: PYTHONPATH=. python scripts/v097_mops_accounting_identity_qa.py
