name: JARVIS v097 TWSE TPEx Continuous Archive Evidence Audit
on:
  workflow_dispatch:
    inputs:
      depth:
        description: "Checkpointed dispatch chain depth"
        required: false
        default: "0"
        type: string
  push:
    paths:
      - scripts/v097_twse_tpex_archive_audit.py
      - .github/workflows/v097_twse_tpex_continuous_audit.yml
  schedule:
    - cron: '3,18,33,48 * * * *'
permissions:
  contents: read
  actions: write
concurrency:
  group: v097-twse-tpex-archive-verify
  cancel-in-progress: false
jobs:
  twse:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      remaining: ${{ steps.audit.outputs.remaining }}
      progress: ${{ steps.audit.outputs.progress }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests
      - name: Test archive parser evidence gates
        run: PYTHONPATH=. python scripts/v097_twse_tpex_archive_audit.py selftest
      - id: audit
        name: Resume TWSE ZIP member evidence from durable Drive checkpoint
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          AUDIT_BATCH: '350'
        run: PYTHONPATH=. python scripts/v097_twse_tpex_archive_audit.py TWSE
  tpex:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      remaining: ${{ steps.audit.outputs.remaining }}
      progress: ${{ steps.audit.outputs.progress }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests
      - name: Test archive parser evidence gates
        run: PYTHONPATH=. python scripts/v097_twse_tpex_archive_audit.py selftest
      - id: audit
        name: Resume TPEx ZIP member evidence from durable Drive checkpoint
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          AUDIT_BATCH: '350'
        run: PYTHONPATH=. python scripts/v097_twse_tpex_archive_audit.py TPEx
  continue:
    needs: [twse, tpex]
    if: always() && needs.twse.result == 'success' && needs.tpex.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch next checkpoint batch immediately while work advances
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEPTH: ${{ inputs.depth || '0' }}
          TWSE_REMAINING: ${{ needs.twse.outputs.remaining }}
          TPEX_REMAINING: ${{ needs.tpex.outputs.remaining }}
          TWSE_PROGRESS: ${{ needs.twse.outputs.progress }}
          TPEX_PROGRESS: ${{ needs.tpex.outputs.progress }}
        run: |
          if ! [[ "$DEPTH" =~ ^[0-9]+$ ]]; then exit 1; fi
          if [ "$DEPTH" -ge 60 ]; then echo "MAX_CHAIN_DEPTH_BACKUP_CRON"; exit 0; fi
          if { [ "$TWSE_REMAINING" -gt 0 ] || [ "$TPEX_REMAINING" -gt 0 ]; } && { [ "$TWSE_PROGRESS" = true ] || [ "$TPEX_PROGRESS" = true ]; }; then
            next=$((DEPTH + 1))
            gh workflow run v097_twse_tpex_continuous_audit.yml --ref main -f depth="$next"
            echo "NEXT_ARCHIVE_AUDIT_RUN_ACCEPTED depth=$next"
          else
            echo "NO_PENDING_ARCHIVE_EVIDENCE_OR_NO_PROGRESS; no pointless redispatch"
          fi
