name: JARVIS v0.95 September 443 indicator lineage catalog
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/v095-202609-443-catalog.yml','scripts/v095_202609_443_catalog.py']
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2
      - name: Extract real 443 indicators from old audit, preserve unknown values and PIT
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python scripts/v095_202609_443_catalog.py
