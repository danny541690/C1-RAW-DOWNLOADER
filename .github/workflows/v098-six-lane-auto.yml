name: JARVIS v0.98 Six-Lane Copy Only Autonomous
# Scope ONLY source v0.93/01_RAW => v0.98/20_BRONZE original byte copy.
on:
  push:
    branches: [main, jarvis-v098-bronze-copy-only-20261120]
    paths:
      - scripts/v098_bronze_copy_only.py
      - scripts/v098_copy_master.py
      - .github/workflows/v098-six-lane-auto.yml
  workflow_dispatch:
    inputs:
      activate:
        description: 'Enter COPY_093_TO_098 to start or resume'
        required: false
        type: string
  schedule:
    - cron: '0 */4 * * *'
permissions:
  contents: read
  actions: write
concurrency:
  group: jarvis-v098-six-lane-autonomous-copy
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      active: ${{ steps.gate.outputs.active }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile only the copy-only system
        run: python -m py_compile scripts/v098_bronze_copy_only.py scripts/v098_copy_master.py
      - name: Synthetic 25MB original SHA and 8-worker replay
        run: python scripts/v098_bronze_copy_only.py --mode self-test
      - name: Install Google client
        run: python -m pip install --disable-pip-version-check 'google-api-python-client>=2.140,<3' 'google-auth>=2.30,<3'
      - name: Activate once or read existing status
        id: gate
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          ACK: ${{ inputs.activate }}
        shell: bash
        run: |
          MODE=status
          if [ "$EVENT" = "push" ] && [ "$BRANCH" = "main" ]; then MODE=activate; fi
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$ACK" = "COPY_093_TO_098" ]; then MODE=activate; fi
          fi
          STATE=$(python scripts/v098_copy_master.py --mode "$MODE" | tail -n 1)
          if [ "$STATE" != "ACTIVE" ] && [ "$STATE" != "INACTIVE" ]; then exit 1; fi
          echo "active=$STATE" >> "$GITHUB_OUTPUT"
  copy-six:
    needs: prepare
    if: needs.prepare.outputs.active == 'ACTIVE'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        source: [TWSE, TPEx, MOPS, NDC, TDCC, TAIFEX]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'google-api-python-client>=2.140,<3' 'google-auth>=2.30,<3'
      - name: Copy original bytes, record source/dest SHA and source ledger
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          SOURCE: ${{ matrix.source }}
        run: |
          python scripts/v098_bronze_copy_only.py --mode migrate --source "$SOURCE" --workers 2 --deadline-seconds 18000 --report-file "source_reports/$SOURCE.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v098-copy-source-summary-${{ matrix.source }}
          path: source_reports/
          if-no-files-found: warn
          retention-days: 7
  finalize:
    needs: [prepare,copy-six]
    if: always() && needs.prepare.outputs.active == 'ACTIVE'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'google-api-python-client>=2.140,<3' 'google-auth>=2.30,<3'
      - uses: actions/download-artifact@v4
        with:
          pattern: v098-copy-source-summary-*
          path: source_reports
          merge-multiple: true
        continue-on-error: true
      - name: Central master check of all six independent sources
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python scripts/v098_copy_master.py --mode finalize --reports-dir source_reports
      - name: Trigger next GitHub Actions batch if and only if Master remains ACTIVE
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          STATE=$(python scripts/v098_copy_master.py --mode status | tail -n 1)
          if [ "$STATE" = "ACTIVE" ]; then
            gh workflow run v098-six-lane-auto.yml --ref main
          fi
