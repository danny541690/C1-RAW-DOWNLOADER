name: JARVIS v0.98 R12 Unified Pre-Migration Gate
# 12 bounded source-month metadata scans + synthetic seven-ledger and transfer-integrity tests.
# No real market-byte reads, no Drive writes, NO Bronze migration. Manual-only after one live trigger.
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/v098_r12_preflight_integration.py'
permissions:
  contents: read
concurrency:
  group: v098-r12-pre-migration-one-controller
  cancel-in-progress: false
jobs:
  integration-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Drive API dependency used by pagination regression
        run: python -m pip install --disable-pip-version-check 'google-api-python-client>=2.140,<3'
      - name: Six-account dispatch, central commit and replay regression
        run: python scripts/v098_r8_seven_ledger_contract.py selftest --report r12_gates/r8.json
      - name: Lease expiration, fencing and single-writer tests
        run: python scripts/v098_r9_ledger_fault_injection.py --out r12_gates/r9.json
      - name: Dataset privacy and missing-coverage semantics
        run: python scripts/v098_r11_six_source_metadata_pilot.py --selftest --out r12_gates/r11.json
      - name: End-to-end pagination, duplicate identity, SHA/CRC and PIT coverage tests
        run: python scripts/v098_r12_preflight_integration.py test --out r12_gates/r12.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r12-combined-gate-evidence
          path: r12_gates/
          if-no-files-found: warn
  ledger-checkpoint-writer:
    needs: integration-gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/v098_r12_preflight_integration.py checkpoint-init --db r12_state/state.sqlite --out r12_state/initial.json
      - uses: actions/upload-artifact@v4
        with:
          name: r12-synthetic-ledger-snapshot
          path: r12_state/
          if-no-files-found: error
  ledger-checkpoint-restart:
    needs: ledger-checkpoint-writer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: r12-synthetic-ledger-snapshot
          path: r12_state
      - run: python scripts/v098_r12_preflight_integration.py checkpoint-resume --db r12_state/state.sqlite --out r12_recovery/resume.json
      - uses: actions/upload-artifact@v4
        with:
          name: r12-cross-runner-recovery
          path: r12_recovery/
  source-scan:
    needs: integration-gates
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        source: [TWSE, TPEx, MOPS, NDC, TDCC, TAIFEX]
        month: ['2026-09', '2026-10']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Google Drive client
        run: python -m pip install --disable-pip-version-check 'google-api-python-client>=2.140,<3' 'google-auth>=2.30,<3' 'google-auth-oauthlib>=1.2,<2'
      - name: Read-only source metadata with complete Drive pagination
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python scripts/v098_r11_six_source_metadata_pilot.py --source "${{ matrix.source }}" --year 2026 --month "${{ matrix.month }}" --out r12_scan/${{ matrix.source }}_${{ matrix.month }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r12-scan-${{ matrix.source }}-${{ matrix.month }}
          path: r12_scan/
          if-no-files-found: warn
  single-reconciler:
    needs: [integration-gates, ledger-checkpoint-restart, source-scan]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: r12-scan-*
          path: r12_sources/
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: r12-cross-runner-recovery
          path: r12_recovery/
      - name: Verify 12 receipts, no credential leaks, explicit coverage uncertainty
        run: |
          python - <<'PY'
          import json,pathlib,sys
          files=sorted(pathlib.Path('r12_sources').glob('*.json'))
          records=[json.loads(f.read_text()) for f in files]
          expected={(s,m) for s in ('TWSE','TPEx','MOPS','NDC','TDCC','TAIFEX') for m in ('2026-09','2026-10')}
          identities=[(r.get('source'),r.get('month')) for r in records]
          forbidden=('file_id','parent_folder_id','GOOGLE_REFRESH_TOKEN','refresh_token','md5Checksum')
          if any(term in json.dumps(records) for term in forbidden):sys.exit('Privacy leak')
          if set(identities)!=expected or len(identities)!=12:sys.exit('Incomplete source partitions')
          if any(r.get('status')=='SCAN_ERROR' for r in records):sys.exit('Some partitions failed')
          restore=json.loads(pathlib.Path('r12_recovery/resume.json').read_text())
          if restore.get('status')!='PASS' or restore.get('new_attempts')!=0:sys.exit('Checkpoint recovery failed')
          out={'status':'PASS_METADATA_ONLY','source_partitions':12,'distinct_sources':6,
               'total_file_entries':sum(r.get('file_count',0) for r in records),
               'api_pages':sum(r.get('api_pages',0) for r in records),
               'coverage_certified':False,'production_migration_allowed':False,
               'cross_runner_checkpoint':restore['status'],
               'records':[{k:r[k] for k in ('source','month','status','file_count','file_bytes','api_pages','empty_directories','zero_byte_files','duplicate_md5_candidates','month_folder') if k in r} for r in records]}
          pathlib.Path('r12_final').mkdir(exist_ok=True)
          pathlib.Path('r12_final/summary.json').write_text(json.dumps(out,indent=2))
          print(json.dumps({k:v for k,v in out.items() if k!='records'}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r12-unified-pre-migration-report
          path: r12_final/
          if-no-files-found: warn
