name: JARVIS v0.93 LIVE FINANCIAL
on:
  schedule:
    - cron: '40 * * * *'
  workflow_call:
    inputs:
      minutes:
        type: string
        default: '30'
        required: false
    secrets:
      GOOGLE_CLIENT_ID:
        required: true
      GOOGLE_CLIENT_SECRET:
        required: true
      GOOGLE_REFRESH_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      minutes:
        description: Bounded worker time in minutes
        default: '30'
        required: false
permissions:
  contents: write
concurrency:
  group: jarvis-v093-live-financial
  cancel-in-progress: false
jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-qa.lock
      - run: pip install -r requirements-qa.lock
      - name: Run real FINANCIAL worker with durable per-unit state
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          WORKER_MINUTES: ${{ inputs.minutes || '30' }}
        run: python3 -m scripts.v093_replanned_five_stage --stage FINANCIAL --minutes "$WORKER_MINUTES"
