name: JARVIS 2024 TPEx Historical Date Canary
on:
  push:
    paths:
      - .github/workflows/v093-2024-tpex-date-canary.yml
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-api-python-client google-auth google-auth-httplib2
      - name: Compare historical endpoint requested date against actual returned date
        run: python -u -m scripts.v093_2024_tpex_date_canary
