name: JARVIS v0.97 - TPEx Big5 historical prices repair
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v097_tpex_rsta3104_recovery.py'
      - '.github/workflows/v097-tpex-rsta3104-recovery.yml'
  workflow_dispatch:
  schedule:
    - cron: '27 * * * *'
permissions:
  contents: read
concurrency:
  group: v097-tpex-legacy-single
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'danny541690/C1-RAW-DOWNLOADER'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - run: |
          python -m py_compile scripts/v097_tpex_rsta3104_recovery.py
          PYTHONPATH=. python scripts/v097_tpex_rsta3104_recovery.py
  bootstrap:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: Initialize independent 0.97 TPEx historical repaired-data lane directories
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          TPEX_RSTA_MODE: bootstrap
        run: PYTHONPATH=. python scripts/v097_tpex_rsta3104_recovery.py
  six-parse-lanes:
    needs: bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        lane: [0,1,2,3,4,5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: Parse Big5 historic TPEx reports, check ROC date, amount, original SHA and destination readback
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          TPEX_RSTA_MODE: lane
          TPEX_ADAPTER_LANE: ${{ matrix.lane }}
          TPEX_ADAPTER_BATCH: '18'
        run: |
          for i in $(seq 1 25); do
            result=$(PYTHONPATH=. python scripts/v097_tpex_rsta3104_recovery.py)
            echo "$result"
            if echo "$result" | grep -q '"remaining": 0'; then break; fi
          done
  summary:
    needs: six-parse-lanes
    if: always() && needs.six-parse-lanes.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: Record exact repaired TPEx row counts and unresolved format exceptions
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          TPEX_RSTA_MODE: summary
        run: PYTHONPATH=. python scripts/v097_tpex_rsta3104_recovery.py
