name: JARVIS consolidated final prelaunch checks and explicit release gates
on:
  push:
    branches: [codex/seven-source-closed-loop-design-20261029]
    paths: [.github/workflows/jarvis-seven-final-bundle.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: jarvis-final-prelaunch-bundle
  cancel-in-progress: false
jobs:
  final-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-qa.lock
      - name: Consolidated regression, twelve production gates and rejection evidence storage
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python -m scripts.v093_final_prelaunch_bundle --probe-drive
      - name: Automatically publish all final check results
        if: always()
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python -m scripts.v093_acceptance_publish --source TWSE --job final-prelaunch --status '${{ job.status }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-prelaunch-checks
          path: |
            results
            publication
          retention-days: 90
