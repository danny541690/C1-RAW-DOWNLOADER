name: 集保所排程四之一（4-1）｜最新往舊｜候選執行入口（正式未啟用）
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Entry validation uses fixtures; production remains blocked
        type: choice
        options: [entry-validation, production]
        default: entry-validation
permissions:
  contents: write
concurrency:
  group: jarvis-seven-entry-tdcc-desc
  cancel-in-progress: false
jobs:
  worker:
    uses: ./.github/workflows/jarvis-seven-worker.yml
    with:
      source: TDCC
      direction: DESC
      mode: ${{ inputs.mode }}
    secrets: inherit
