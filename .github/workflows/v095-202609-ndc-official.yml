name: JARVIS v0.95 NDC September 2026 official Bronze candidate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v095-202609-ndc-official.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jarvis-v095-202609-ndc-official
  cancel-in-progress: false
jobs:
  ndc-september:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check beautifulsoup4 requests
      - name: Verify official publication and capture 11509 source workbook
        run: python tests/v095_ndc_202609_official_candidate.py
      - name: Preserve official Bronze candidate and failure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v095-ndc-sept-official-${{ github.run_id }}
          retention-days: 60
          path: v095_ndc_202609_official_candidate/
          if-no-files-found: warn
