name: JARVIS v097 Seven Independent Publisher Evidence Bridge
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/v097_seven_independent_publisher_bridge.py
      - .github/workflows/v097_seven_independent_publisher_bridge.yml
  schedule:
    - cron: '6 */6 * * *'
permissions:
  contents: read
concurrency:
  group: v097-seven-independent-publisher-bridge
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        source: [TWSE, TPEx, MOPS, TDCC, TAIFEX, NDC, FinMind]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual source-fetch and HTML parser dependencies
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: Reject forged publishers and incorrect proof claims
        run: |
          PYTHONPATH=. python scripts/v097_seven_independent_publisher_bridge.py selftest
          PYTHONPATH=. python scripts/v097_live_threeway_close_witness.py selftest
          PYTHONPATH=. python scripts/v097_d_seven_source_gate.py selftest
      - name: Retrieve official publisher, original SHA and source-specific numerical samples
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          WITNESS_SAMPLES: '2'
        run: PYTHONPATH=. python scripts/v097_seven_independent_publisher_bridge.py '${{ matrix.source }}'
