name: JARVIS v0.95 2026 NDC independent Bronze and downstream gate
# 2026 source-scoped writer; v0.93 archive-byte admission first; typed Silver/Gold adapter not yet certified.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v095-2026-source-ndc.yml'
  schedule:
    - cron: '14,44 * * * *'
permissions:
  contents: read
concurrency:
  group: jarvis-v095-2026-source-ndc-single-writer
  cancel-in-progress: false
jobs:
  source-ndc:
    if: github.repository == 'danny541690/C1-RAW-DOWNLOADER'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      V095_BRONZE_SOURCE: 'NDC'
      V095_ARCHIVE_BATCH: '3'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact common Drive, Arrow and source adapter dependencies once
        run: python -m pip install --disable-pip-version-check pyarrow google-api-python-client google-auth google-auth-httplib2
      - name: Check non-release gates and compile source-specific adapters
        run: |
          python - <<'PY'
          import json
          x=json.load(open('governance/v095/PHASE1_FLAGS.json'))
          assert x['BULK_COPY_APPROVED'] is False and x['RELEASE_APPROVED'] is False
          print('V095_SOURCE_ISOLATED_CANDIDATE_ONLY')
          PY
          python -m py_compile scripts/v095_2026_four_source_archive_intake.py
      - name: Admit SHA CRC manifest-proven v0.93 Bronze archive candidates only
        run: python -m scripts.v095_2026_four_source_archive_intake
      - name: Preserve full per-partition actual results, exceptions and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v095-2026-ndc-source-${{ github.run_id }}
          path: |
            v095_2026_source_archives/result.json
          if-no-files-found: warn
          retention-days: 90
