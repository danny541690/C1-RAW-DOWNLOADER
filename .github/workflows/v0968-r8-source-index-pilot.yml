name: JARVIS v0.968 R8 | legacy RAW source index & FinMind Backer registry
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v0968-r8-source-index-pilot.yml'
      - 'scripts/v0968_r8_raw_intake.py'
permissions:
  contents: read
concurrency:
  group: jarvis-v0968-r8-source-catalog-single-writer
  cancel-in-progress: false
jobs:
  v0968-legacy-index:
    if: github.repository == 'danny541690/C1-RAW-DOWNLOADER'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing Drive client
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2
      - name: Compile check
        run: python -m py_compile scripts/v0968_r8_raw_intake.py
      - name: Inventory only v0.93 2025-01 and 2026-10; SHA bounded originals, record errors, do not mutate
        run: python -u -m scripts.v0968_r8_raw_intake
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v0968-r8-raw-intake-${{ github.run_id }}
          path: v0968_r8/
          if-no-files-found: warn
          retention-days: 30
