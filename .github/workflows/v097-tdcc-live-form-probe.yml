name: JARVIS v0.97 - TDCC official historical form inspect
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v097_tdcc_live_form_probe.py'
      - '.github/workflows/v097-tdcc-live-form-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: Retrieve actual official form fields, action and date options for safe historical comparison
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: PYTHONPATH=. python scripts/v097_tdcc_live_form_probe.py
