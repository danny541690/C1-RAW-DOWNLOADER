name: JARVIS Operational Control and Bounded Recovery
# Preserve completed evidence and share one time budget across short repair units.
on:
  push:
    paths:
      - '.github/workflows/v093-operational-control.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'bootstrap includes one-month shadow; auto includes bounded repair'
        type: choice
        options: [bootstrap, auto, monitor, daily, repair]
        default: bootstrap
  schedule:
    - cron: '17 * * * *'
  workflow_run:
    workflows: ['JARVIS Layer02 R3 2025-2026 Parser Repair and Structural QA']
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: jarvis-operational-control-single-writer
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-qa.lock
      - run: pip install -r requirements-qa.lock
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
  control:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-qa.lock
      - run: pip install -r requirements-qa.lock
      - name: Preserve active workers, reconcile paths and update durable control
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          MODE: ${{ github.event.inputs.mode || (github.event_name == 'push' && 'monitor' || 'auto') }}
        run: python -u -m scripts.v093_operations --mode "$MODE"
