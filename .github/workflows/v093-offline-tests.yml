name: JARVIS v0.93 Offline Engine Tests
on:
  push:
    paths:
      - 'scripts/**'
      - 'requirements-qa.lock'
      - 'tests/**'
      - '.github/workflows/v093-offline-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-qa.lock
      - run: pip install -r requirements-qa.lock
      - name: Run safe offline unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

