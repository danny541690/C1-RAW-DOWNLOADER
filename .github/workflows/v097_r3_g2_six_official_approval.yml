name: JARVIS R3 G2 six source official historical dataset approval pilot
on:
  push:
    branches: [r3-bronze-silver-ready-staging-20261118]
    paths: ['.github/workflows/v097_r3_g2_six_official_approval.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jarvis-r3-six-official-real-g2-approval-pilot
  cancel-in-progress: false
jobs:
  six-source-official-document-native-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install authenticated Drive plus source inspector
        run: python -m pip install google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: Official document HTTPS host SHA and original 60 frozen native identities
        run: |
          set -euo pipefail
          python -m py_compile scripts/v097_r3_g2_six_official_approval_gate.py
          PYTHONPATH=. python scripts/v097_r3_g2_six_official_approval_gate.py
      - name: Fail-closed official approval policy
        if: always()
        run: |
          echo 'Official page SHA is not a per-dataset historical original specification.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Approve only source-era native evidence and independently verified original byte SHA; all incomplete pilot proof stays HOLD.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No Bronze rewrite, no Silver/Gold and no production R1/V3/G5 master updates.' >> "$GITHUB_STEP_SUMMARY"
