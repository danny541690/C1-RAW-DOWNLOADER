name: JARVIS One-time Prior RAW Stop
on:
  push:
    paths:
      - '.github/workflows/v093-stop-prior-raw-once.yml'
permissions:
  contents: read
  actions: write
jobs:
  stop-prior-run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel superseded 2026 RAW run and disable its dispatch workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os,urllib.request,urllib.error
          base='https://api.github.com/repos/'+os.environ['GH_REPO']+'/actions'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          for path,method in [('/runs/39454119369/cancel','POST'),('/workflows/v093-raw-resume.yml/disable','PUT')]:
              req=urllib.request.Request(base+path,data=b'',headers=headers,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=25) as response:
                      print('PRIOR_RAW_STOP',path,response.status)
              except urllib.error.HTTPError as e:
                  if e.code in (404,409,422):
                      print('PRIOR_RAW_ALREADY_STOPPED_OR_UNAVAILABLE',path,e.code)
                  else:
                      raise
          PY
