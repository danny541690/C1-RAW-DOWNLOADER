name: JARVIS Three-Year Verified Financial Gap Supplement
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['JARVIS 2024-2026 Official Audit and Gap Repair']
    types: [completed]
concurrency:
  group: v093-three-year-finmind-gap-supplement
  cancel-in-progress: false
jobs:
  supplement:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-api-python-client google-auth google-auth-httplib2
      - name: Supplement explicit official financial gaps only and publish final report
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN || secrets.FINMIND_API_TOKEN }}
        run: python -u -m scripts.v093_three_year_finmind_gaps
