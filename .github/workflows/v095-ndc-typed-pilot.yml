name: JARVIS v0.95 NDC genuine typed Silver repartition pilot (isolated)
on:
  push:
    branches: [test/jarvis-v095-one-shot-fast-20261105]
    paths:
      - .github/workflows/v095-ndc-typed-pilot.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jarvis-v095-ndc-typed-pilot
  cancel-in-progress: false
jobs:
  typed-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/jarvis-v095-one-shot-fast-20261105
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only needed packages once
        run: python -m pip install --disable-pip-version-check pyarrow google-api-python-client google-auth-httplib2 google-auth-oauthlib
      - name: Read real v093 NDC original and write typed partitioned Silver candidate locally
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: PYTHONPATH=. python tests/v095_ndc_real_typed_silver_pilot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v095-ndc-genuine-silver-candidate-${{ github.run_id }}
          path: v095_ndc_typed_candidate/
          retention-days: 30
          if-no-files-found: warn
