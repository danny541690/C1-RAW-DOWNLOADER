name: JARVIS v0.97 - Live 7489 exception accounting
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v097_dynamic_7489_exception_reconcile.py'
      - '.github/workflows/v097-dynamic-7489-exception-accounting.yml'
  workflow_run:
    workflows:
      - "JARVIS v0.97 - 1082 special raw strict internal QA"
      - "JARVIS v0.97 - Remaining 31 original dataset cross-format QA"
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '38 * * * *'
permissions:
  contents: read
concurrency:
  group: v097-dynamic-7489-exception-accounting
  cancel-in-progress: false
jobs:
  verify-and-report:
    if: github.repository == 'danny541690/C1-RAW-DOWNLOADER'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: Account for every original 7489 ID from verified v0.97 evidence, exclude controls and tick, no PIT release assertion
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          python -m py_compile scripts/v097_dynamic_7489_exception_reconcile.py
          PYTHONPATH=. python scripts/v097_dynamic_7489_exception_reconcile.py
