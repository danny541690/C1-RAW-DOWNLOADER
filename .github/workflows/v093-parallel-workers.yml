name: JARVIS Parallel Repair and Feature Preparation
on:
  push:
    paths:
      - '.github/workflows/v093-parallel-workers.yml'
      - 'scripts/v093_parallel_worker.py'
      - 'scripts/v093_feature_warmup.py'
  workflow_dispatch:
  schedule:
    - cron: '5,25,45 * * * *'
  workflow_run:
    workflows: ['JARVIS Layer02 R3 2025-2026 Parser Repair and Structural QA']
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: jarvis-parallel-workers-v2
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-qa.lock
      - run: pip install -r requirements-qa.lock
      - name: Consolidated offline acceptance
        run: python -m unittest discover -s tests -p 'test_*.py'
  repair:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        lane: [july, financial]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-qa.lock
      - run: pip install -r requirements-qa.lock
      - name: Resume isolated repair lane
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          LANE: ${{ matrix.lane }}
        run: python -u -m scripts.v093_parallel_worker --lane "$LANE" --minutes 35
  features:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-qa.lock
      - run: pip install -r requirements-qa.lock
      - name: Prepare cached price history and feature shadow
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -u -m scripts.v093_parallel_worker --lane features --minutes 25
