name: JARVIS v0.93 LIVE RAW
on:
  push:
    paths:
      - '.github/workflows/v093-v2-01-raw.yml'
      - 'scripts/v093_live_five_stage.py'
  schedule:
    - cron: '1 * * * *'
  workflow_call:
    inputs:
      minutes:
        type: string
        default: '60'
        required: false
    secrets:
      GOOGLE_CLIENT_ID:
        required: true
      GOOGLE_CLIENT_SECRET:
        required: true
      GOOGLE_REFRESH_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      minutes:
        description: Bounded worker time in minutes
        default: '60'
        required: false
permissions:
  contents: write
concurrency:
  group: jarvis-v093-live-raw
  cancel-in-progress: false
jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-qa.lock
      - run: pip install -r requirements-qa.lock
      - name: Check shared API budget before taking the stage lease
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.v093_github_budget --minimum 200 --max-wait 600
      - name: Run real RAW worker with durable per-unit state
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          WORKER_MINUTES: ${{ inputs.minutes || '60' }}
        run: python3 -m scripts.v093_replanned_five_stage --stage RAW --minutes "$WORKER_MINUTES"
