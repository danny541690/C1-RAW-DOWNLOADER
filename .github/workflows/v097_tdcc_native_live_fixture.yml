name: JARVIS v097 TDCC Native Live Historical Fixture QA
# Repeat with real raw HTML table diagnostics before acceptance
on:
  push:
    paths:
      - .github/workflows/v097_tdcc_native_live_fixture.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-genuine-tdcc-html:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and run native synthetic negative and registry tests
        run: |
          set -euo pipefail
          python -m py_compile scripts/v097_g2g3_tdcc_live_fixture.py scripts/v097_g2g3_tdcc_native_html.py
          PYTHONPATH=. python scripts/v097_g2g3_tdcc_native_html.py selftest
          PYTHONPATH=. python scripts/v097_v3_contract_registry.py selftest
          PYTHONPATH=. python scripts/v097_g2g3_native_headers.py selftest
      - name: Install Drive API for real read-only original
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib
      - name: Validate actual 2025-11-28 TDCC source page and write QA receipt only
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: PYTHONPATH=. python scripts/v097_g2g3_tdcc_live_fixture.py
