name: JARVIS v0.95 publish 2025-2026 autonomous SOP to Drive
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v095-publish-2025-2026-autonomous-sop.yml'
      - 'governance/v095/JARVIS_V095_2025_2026_AUTONOMOUS_EXECUTION_SOP_20261108.md'
      - 'scripts/v095_publish_2025_2026_contract_drive.py'
permissions:
  contents: read
concurrency:
  group: jarvis-v095-publish-two-year-sop-single
  cancel-in-progress: false
jobs:
  publish-sop:
    if: github.repository == 'danny541690/C1-RAW-DOWNLOADER'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Drive publisher dependencies
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2
      - name: Publish 2025-2026 SOP to immutable SHA-named file and readback
        run: python -u -m scripts.v095_publish_2025_2026_contract_drive
      - name: Retain Drive upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v095-2025-2026-contract-${{ github.run_id }}
          path: v095_2025_2026_autonomous_contract/receipt.json
          if-no-files-found: warn
          retention-days: 90
