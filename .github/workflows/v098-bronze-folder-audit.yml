name: JARVIS v0.98 Bronze Parallel-Folder Audit
on:
  push:
    branches: [jarvis-v098-bronze-copy-only-20261120]
    paths:
      - scripts/v098_bronze_folder_audit.py
      - .github/workflows/v098-bronze-folder-audit.yml
permissions:
  contents: read
jobs:
  read-only-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile scripts/v098_bronze_folder_audit.py
      - run: python -m pip install --disable-pip-version-check 'google-api-python-client>=2.140,<3' 'google-auth>=2.30,<3'
      - name: List Bronze year and source folders, fail on duplicates
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python scripts/v098_bronze_folder_audit.py
