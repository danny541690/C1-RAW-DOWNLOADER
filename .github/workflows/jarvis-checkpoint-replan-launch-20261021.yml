name: JARVIS Launch Replan RAW 201404 Audit 202610
on:
  push:
    paths:
      - '.github/workflows/jarvis-checkpoint-replan-launch-20261021.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
env:
  REPLAN_WORKFLOW_FILE: jarvis-checkpoint-replan-launch-20261021.yml
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-qa.lock
      - run: pip install -r requirements-qa.lock
      - name: Test split scopes, preserved retries and archive reuse
        run: |
          python3 -m unittest discover -s tests -q
          python3 -m scripts.v093_five_stage_combined_contract
      - name: Verify stopped workers and fence retired generation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m scripts.v093_replan_control prepare
  verify_raw:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: jarvis-v093-live-raw
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-qa.lock
      - run: pip install -r requirements-qa.lock
      - name: Bounded cutover verification of RAW; scheduled budget is configured separately
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -m scripts.v093_replanned_five_stage --stage RAW --minutes 4
  verify_qa:
    needs: verify_raw
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: jarvis-v093-live-consumer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-qa.lock
      - run: pip install -r requirements-qa.lock
      - name: Bounded cutover verification of QA1; scheduled budget is configured separately
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -m scripts.v093_replanned_five_stage --stage QA1 --minutes 5
  verify_price:
    needs: verify_qa
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: jarvis-v093-live-consumer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-qa.lock
      - run: pip install -r requirements-qa.lock
      - name: Bounded cutover verification of PRICE; scheduled budget is configured separately
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -m scripts.v093_replanned_five_stage --stage PRICE --minutes 1
  verify_financial:
    needs: verify_price
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: jarvis-v093-live-consumer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-qa.lock
      - run: pip install -r requirements-qa.lock
      - name: Bounded cutover verification of FINANCIAL; scheduled budget is configured separately
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -m scripts.v093_replanned_five_stage --stage FINANCIAL --minutes 1
  verify_chip:
    needs: verify_financial
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: jarvis-v093-live-consumer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-qa.lock
      - run: pip install -r requirements-qa.lock
      - name: Bounded cutover verification of CHIP; scheduled budget is configured separately
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -m scripts.v093_replanned_five_stage --stage CHIP --minutes 1
  activate:
    needs: verify_chip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable only the five replanned schedules
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m scripts.v093_replan_control activate
