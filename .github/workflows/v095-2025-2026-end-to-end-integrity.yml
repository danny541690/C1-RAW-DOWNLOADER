name: JARVIS v0.95 2025-2026 full orchestration logical link gate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v095-2025-2026-end-to-end-integrity.yml'
  schedule:
    - cron: '59 */3 * * *'
permissions:
  contents: read
concurrency:
  group: jarvis-v095-2025-2026-logical-link-check
  cancel-in-progress: false
jobs:
  validate-two-year-pipeline:
    if: github.repository == 'danny541690/C1-RAW-DOWNLOADER'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Compile historical and current source, QA, Silver, Gold, lineage
        run: |
          python -m py_compile scripts/v095_2026_price_incremental.py scripts/v095_2026_equity_downstream.py scripts/v095_2026_legacy_first.py scripts/v095_2026_four_source_archive_intake.py scripts/v095_2026_immediate_silver_gold.py scripts/v095_2026_source_qa.py scripts/v095_2026_gold_lineage_controller.py scripts/v095_2025_autonomous_controller.py
      - name: Enforce 44 logical worker hooks plus release and double-write protection
        run: python -u -m scripts.v095_2025_2026_pipeline_integrity
      - name: Archive full link audit and blocking reasons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v095-two-year-link-audit-${{ github.run_id }}
          path: v095_2025_2026_pipeline_integrity/result.json
          if-no-files-found: warn
          retention-days: 90
