# Resume saved checkpoints with bounded API retry and contention recovery.
# Independent stage-six workers: separate Actions pools, leases, and Drive ledgers.
# Live cleanup: reverse months, durable five-attempt limit; no isolated trial jobs.
name: JARVIS v0.93 LIVE RECONCILE REPAIR
on:
  schedule:
    - cron: '15 * * * *'
  push:
    paths:
      - '.github/workflows/v093-v2-06-reconcile-repair.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: jarvis-v093-stage06-cutover
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-qa.lock
      - name: Verify isolation and retire only older stage-six runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m unittest tests.test_stage06_independence tests.test_stage06_git_resilience -q
          python - <<'PYCODE'
          import json, os, time, urllib.request
          base='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          def api(path,method='GET',body=None):
              request=urllib.request.Request(base+path,method=method,data=json.dumps(body).encode() if body is not None else None,
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=30) as response:
                  raw=response.read();return json.loads(raw) if raw else {}
          current=int(os.environ['GITHUB_RUN_ID'])
          previous=[]
          for run in api('/actions/runs?per_page=100')['workflow_runs']:
              if run['path']=='.github/workflows/v093-v2-06-reconcile-repair.yml' and run['id']<current and run['status']!='completed':
                  previous.append(run['id']);api('/actions/runs/'+str(run['id'])+'/cancel','POST')
          deadline=time.monotonic()+240
          while previous:
              previous=[run for run in previous if api('/actions/runs/'+str(run))['status']!='completed']
              if previous and time.monotonic()>=deadline:raise RuntimeError('OLD_STAGE06_NOT_TERMINAL_CHECKPOINTS_PRESERVED')
              if previous:time.sleep(5)
          print('STAGE06_INDEPENDENT_CUTOVER_READY_CHECKPOINTS_PRESERVED')
          PYCODE
  repair:
    needs: prepare
    concurrency:
      group: jarvis-v093-live-reconcile-repair
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-qa.lock
      - run: python -m pip install -r requirements-qa.lock
      - name: Check shared API budget before taking the reconciliation lease
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.v093_github_budget --minimum 250 --max-wait 300
      - name: Reconcile latest to oldest with persistent cursor
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.v093_stage06_live --minutes 60 --continuous --recheck-seconds 300
  financial-repairs:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 75
    concurrency:
      group: jarvis-v093-stage06-financial
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-qa.lock
      - run: python -m pip install -r requirements-qa.lock
      - name: Check API budget before acquiring the independent stage-six FINANCIAL owner
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.v093_github_budget --minimum 400 --max-wait 300
      - name: Consume approved repairs in the independent stage-six FINANCIAL owner pool
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.v093_stage06_live --owner-stage FINANCIAL --minutes 60

  price-repairs:
