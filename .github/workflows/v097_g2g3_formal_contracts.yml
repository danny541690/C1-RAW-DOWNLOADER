name: JARVIS v097 V3 Formal G2 G3 Contracts Seven Sources
# Seven-source source-isolated contract publication and 74750 unique-record accounting.
# 2026-11-18 three-day historical format root-cause reconciled from new census.
# QA evidence only. No original writes and no Silver/Gold materialization.
on:
  push:
    paths:
      - .github/workflows/v097_g2g3_formal_contracts.yml
  schedule:
    - cron: '26 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v097-g2g3-formal-contracts-single
  cancel-in-progress: false
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile all 7 source contracts; strict positive and negative promotion tests
        run: |
          set -euo pipefail
          python -m py_compile scripts/v097_g2g3_formal_contracts_v2.py scripts/v097_g2g3_formal_contract_publisher.py
          PYTHONPATH=. python scripts/v097_g2g3_formal_contracts_v2.py selftest
          PYTHONPATH=. python scripts/v097_g2g3_formal_contract_publisher.py selftest
          PYTHONPATH=. python scripts/v097_g2g3_tdcc_native_html.py selftest
          PYTHONPATH=. python scripts/v097_g2g3_full_native_validation.py selftest
  source_contracts:
    needs: safety
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        source: [TWSE, TPEx, MOPS, TDCC, TAIFEX, NDC, FinMind]
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib
      - name: Map latest source native groups onto versioned formal contract specifications
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: PYTHONPATH=. python scripts/v097_g2g3_formal_contract_publisher.py source '${{ matrix.source }}'
  reconcile:
    needs: [safety,source_contracts]
    if: always() && needs.safety.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib
      - name: Publish seven-source complete formal contract Master only with 74750 source coverage
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: PYTHONPATH=. python scripts/v097_g2g3_formal_contract_publisher.py final
