name: JARVIS v0.93 Offline Engine Tests
on:
  push:
    paths:
      - 'scripts/annual_plan.py'
      - 'scripts/batch_engine.py'
      - 'tests/**'
      - '.github/workflows/v093-offline-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run safe offline unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
