name: JARVIS v0.95 MOPS historical bulk official route repair
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v095-mops-official-route-repair.yml'
permissions:
  contents: read
jobs:
  historical-route:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Find byte-retrievable old and new MOPS official monthly HTML routes
        run: |
          python - <<'PY'
          import urllib.request,urllib.error,hashlib,json,re
          for year,month in [(2000,1),(2009,1),(2010,1),(2021,1),(2026,10)]:
            roc=year-1911
            for host in ("mopsov.twse.com.tw","doc.twse.com.tw"):
              for suffix in (f"t21sc03_{roc}_{month}_0.html",f"t21sc03_{roc}_{month}.html"):
                url=f"https://{host}/nas/t21/sii/{suffix}"
                try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=12) as r:
                    raw=r.read(2000000);s=raw.decode('cp950','replace')
                    print(json.dumps({'year':year,'host':host,'suffix':suffix,'status':r.status,'length':len(raw),
                      'ticker_rows':len(re.findall(r'<tr',s,re.I)), 'sha_prefix':hashlib.sha256(raw).hexdigest()[:16],
                      'has_requested_month':bool(re.search(rf'{roc}\s*年\s*{month}\s*月',s))},ensure_ascii=False),flush=True)
                except Exception as e:print(json.dumps({'year':year,'host':host,'suffix':suffix,'error':type(e).__name__+':'+str(e)[:60]},ensure_ascii=False))
          PY
