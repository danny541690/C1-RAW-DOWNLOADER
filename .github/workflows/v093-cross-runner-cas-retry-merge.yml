name: JARVIS v0.93 Cross Runner CAS Conflict Retry and Merge Gate
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/v093-cross-runner-cas-retry-merge.yml'
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      path: ${{ steps.seed.outputs.path }}
      sha: ${{ steps.seed.outputs.sha }}
    steps:
      - name: Seed isolated JSON manifest
        id: seed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os,json,base64,urllib.request
          path=f".github/test-state/cas-merge-{os.environ['RUN_ID']}.json"
          data=json.dumps({'jobs':{},'test_run':os.environ['RUN_ID']},sort_keys=True).encode()
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}",data=json.dumps({'message':'test: seed isolated merge manifest','content':base64.b64encode(data).decode()}).encode(),method='PUT',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=30) as resp:result=json.load(resp)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write(f"path={path}\nsha={result['content']['sha']}\n")
          print('CAS_MERGE_SEED_PASS '+path)
          PY
  writer-a:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: CAS retry preserving both writers
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PATH_KEY: ${{ needs.prepare.outputs.path }}
          SEED_SHA: ${{ needs.prepare.outputs.sha }}
          WRITER: A
        run: |
          python3 - <<'PY'
          import os,json,base64,urllib.request,urllib.error,time
          base=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{os.environ['PATH_KEY']}"
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'}
          writer=os.environ['WRITER'];sha=os.environ['SEED_SHA']
          for attempt in range(1,7):
              if attempt==1:
                  data={'jobs':{},'test_run':os.environ['PATH_KEY'].split('-')[-1].split('.')[0]}
              else:
                  with urllib.request.urlopen(urllib.request.Request(base,headers=headers),timeout=30) as response:current=json.load(response)
                  sha=current['sha'];data=json.loads(base64.b64decode(current['content']))
              data['jobs'][writer]={'done':True,'sha256':'a'*64}
              payload={'message':f'test: CAS merge writer {writer} attempt {attempt}','sha':sha,'content':base64.b64encode(json.dumps(data,sort_keys=True).encode()).decode()}
              req=urllib.request.Request(base,data=json.dumps(payload).encode(),method='PUT',headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=30) as response:status=response.status
              except urllib.error.HTTPError as exc:
                  status=exc.code
                  if status not in (409,422):raise
              print('CAS_MERGE_ATTEMPT '+json.dumps({'writer':writer,'attempt':attempt,'status':status}),flush=True)
              if status==200:break
              time.sleep(0.4*attempt)
          else:raise AssertionError('CAS_RETRY_EXHAUSTED')
          PY
  writer-b:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: CAS retry preserving both writers
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PATH_KEY: ${{ needs.prepare.outputs.path }}
          SEED_SHA: ${{ needs.prepare.outputs.sha }}
          WRITER: B
        run: |
          python3 - <<'PY'
          import os,json,base64,urllib.request,urllib.error,time
          base=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{os.environ['PATH_KEY']}"
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'}
          writer=os.environ['WRITER'];sha=os.environ['SEED_SHA']
          for attempt in range(1,7):
              if attempt==1:
                  data={'jobs':{},'test_run':os.environ['PATH_KEY'].split('-')[-1].split('.')[0]}
              else:
                  with urllib.request.urlopen(urllib.request.Request(base,headers=headers),timeout=30) as response:current=json.load(response)
                  sha=current['sha'];data=json.loads(base64.b64decode(current['content']))
              data['jobs'][writer]={'done':True,'sha256':'b'*64}
              payload={'message':f'test: CAS merge writer {writer} attempt {attempt}','sha':sha,'content':base64.b64encode(json.dumps(data,sort_keys=True).encode()).decode()}
              req=urllib.request.Request(base,data=json.dumps(payload).encode(),method='PUT',headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=30) as response:status=response.status
              except urllib.error.HTTPError as exc:
                  status=exc.code
                  if status not in (409,422):raise
              print('CAS_MERGE_ATTEMPT '+json.dumps({'writer':writer,'attempt':attempt,'status':status}),flush=True)
              if status==200:break
              time.sleep(0.4*attempt)
          else:raise AssertionError('CAS_RETRY_EXHAUSTED')
          PY
  verify:
    needs: [prepare,writer-a,writer-b]
    runs-on: ubuntu-latest
    steps:
      - name: Verify no lost updates across runners
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PATH_KEY: ${{ needs.prepare.outputs.path }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,base64
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO']}/contents/{os.environ['PATH_KEY']}",headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=30) as response:obj=json.load(response)
          data=json.loads(base64.b64decode(obj['content']))
          assert set(data['jobs'])=={'A','B'},data
          assert data['jobs']['A']['sha256']=='a'*64
          assert data['jobs']['B']['sha256']=='b'*64
          print('CROSS_RUNNER_CAS_RETRY_MERGE_PASS '+json.dumps({'writers':2,'preserved':2,'lost_updates':0,'shared_store':'GitHub Contents API','production_drive_writes':0}),flush=True)
          print('RELEASE_GATE=BLOCKED_NOT_YET_INTEGRATED_WITH_REAL_DRIVE_COMMIT')
          PY
