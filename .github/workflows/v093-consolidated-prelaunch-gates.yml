name: JARVIS v0.93 Consolidated Prelaunch Gates SAFE
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/v093-consolidated-prelaunch-gates.yml'
permissions:
  contents: read
concurrency:
  group: jarvis-v093-consolidated-prelaunch-safe
  cancel-in-progress: false
jobs:
  stage-1-existing-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-qa.lock
      - run: pip install -r requirements-qa.lock
      - name: Real repo regression tests for parallel lanes, QA, storage and PIT gates
        run: |
          python3 -m unittest discover -s tests -p 'test_v093_parallel_workers.py' -v
          python3 -m unittest discover -s tests -p 'test_v093_operational_fixes.py' -v
          python3 -m unittest discover -s tests -p 'test_v093_audit_backlog.py' -v
          python3 -m unittest discover -s tests -p 'test_multi_source_canary.py' -v
          echo 'STAGE_1_EXISTING_REGRESSION_PASS'
  stage-2-live-otc-readonly:
    needs: stage-1-existing-regressions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: TPEx real daily quotes plus FinMind OTC canary
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,json,datetime
          def fetch(url):
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 JARVIS-Readonly-Prelaunch','Accept':'application/json'})
            with urllib.request.urlopen(req,timeout=20) as r:return r.status,json.loads(r.read(2000000))
          outcomes=[]
          for day in ('2024/01/02','2026/08/03'):
            result={'source':'TPEx','date':day,'status':'INCONCLUSIVE'}
            try:
              http,data=fetch('https://www.tpex.org.tw/www/zh-tw/afterTrading/dailyQuotes?'+urllib.parse.urlencode({'response':'json','date':day}))
              tables=data.get('tables') or []
              rows=sum(len(t.get('data',[])) for t in tables if isinstance(t,dict)) if isinstance(tables,list) else 0
              if not rows and isinstance(data.get('data'),list):rows=len(data['data'])
              result.update(http=http,rows=rows,top_keys=list(data.keys())[:12],status='PASS' if http==200 and rows>0 else 'REVIEW_REQUIRED')
            except Exception as e:result['error']=type(e).__name__+':'+str(e)[:130]
            outcomes.append(result)
            print('PRELAUNCH_OTC_SOURCE '+json.dumps(result,ensure_ascii=False),flush=True)
          for start,end in [('2024-01-02','2024-01-03'),('2026-08-03','2026-08-04')]:
            result={'source':'FinMind','stock':'3105','start':start,'status':'INCONCLUSIVE'}
            try:
              http,data=fetch('https://api.finmindtrade.com/api/v4/data?'+urllib.parse.urlencode({'dataset':'TaiwanStockPrice','data_id':'3105','start_date':start,'end_date':end}))
              rows=data.get('data',[])
              result.update(http=http,provider_status=data.get('status'),rows=len(rows),status='PASS' if http==200 and data.get('status')==200 and len(rows)>0 else 'REVIEW_REQUIRED')
            except Exception as e:result['error']=type(e).__name__+':'+str(e)[:130]
            outcomes.append(result)
            print('PRELAUNCH_OTC_SOURCE '+json.dumps(result,ensure_ascii=False),flush=True)
          summary={'total':len(outcomes),'pass':sum(x['status']=='PASS' for x in outcomes),'review':sum(x['status']=='REVIEW_REQUIRED' for x in outcomes),'inconclusive':sum(x['status']=='INCONCLUSIVE' for x in outcomes)}
          print('STAGE_2_LIVE_OTC_SUMMARY '+json.dumps(summary),flush=True)
          assert summary['total']==4
          assert summary['pass']==4,'One or more real OTC source checks not verified'
          PY
  stage-3-checkpoint-and-gate-invariants:
    needs: stage-2-live-otc-readonly
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify historical partition, legacy incomplete, and no premature QA release
        run: |
          python3 - <<'PY'
          from datetime import date
          months=[]
          y,m=2026,10
          while (y,m)>=(2000,1):
            months.append(f'{y:04d}-{m:02d}')
            m-=1
            if not m:y,m=y-1,12
          assert len(months)==322 and len(set(months))==322
          newer=[x for x in months if x>='2015-04']
          older=[x for x in months if x<='2015-03']
          assert len(newer)==139 and len(older)==183 and not(set(newer)&set(older))
          old={'done':True,'status':'PARTIAL_WITH_EXPLICIT_GAPS','numeric_verified':False,'historical_pit_verified':False}
          assert old['done'] and not(old['numeric_verified'] and old['historical_pit_verified'])
          def next_stage(x):
            if x.get('raw_state')!='RAW_COMMITTED' or not x.get('raw_sha256'):return 'BLOCKED_QA'
            if x.get('qa_state') not in ('QA1_PASS','QA1_COMPLETE_WITH_GAPS') or not x.get('qa_sha256'):return 'BLOCKED_DEEP'
            return 'DEEP_ELIGIBLE'
          assert next_stage({})=='BLOCKED_QA'
          assert next_stage({'raw_state':'RAW_COMMITTED','raw_sha256':'a'*64})=='BLOCKED_DEEP'
          assert next_stage({'raw_state':'RAW_COMMITTED','raw_sha256':'a'*64,'qa_state':'QA1_COMPLETE_WITH_GAPS','qa_sha256':'b'*64})=='DEEP_ELIGIBLE'
          print('STAGE_3_CHECKPOINT_GATE_PASS months=322 newer=139 older=183 old_partial_not_certified=1')
          PY
  summary:
    needs: stage-3-checkpoint-and-gate-invariants
    runs-on: ubuntu-latest
    steps:
      - run: echo 'CONSOLIDATED_SAFE_GATES_PASS - not a production readiness approval; no Drive writes or scheduled rollout'
