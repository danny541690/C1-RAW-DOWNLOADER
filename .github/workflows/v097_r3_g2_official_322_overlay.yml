name: JARVIS R3 G2 seven-source QA official 322 immutable cert overlay
# TWSE exact immutable certificate artifact basename resolved; full QA replay.
on:
  push:
    branches: [r3-bronze-silver-ready-staging-20261118]
    paths: ['.github/workflows/v097_r3_g2_official_322_overlay.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jarvis-r3-g2-official-322-source-vintage-overlay
  cancel-in-progress: false
jobs:
  seven-source-frozen-qa-proof-reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: Validate official NDC TWSE TPEx file certs against 74750 frozen SHA and no earlier-year PIT
        run: |
          set -euo pipefail
          python -m py_compile scripts/v097_r3_g2_seven_official_qa_overlay.py
          PYTHONPATH=. python scripts/v097_r3_g2_seven_official_qa_overlay.py
      - if: always()
        run: echo 'QA overlay only; previous immutable NDC shard, R1/V3 writers, production G5 and Silver/Gold stay untouched.' >> "$GITHUB_STEP_SUMMARY"
