name: JARVIS v0.93 Retry Exhaustion Safety Gate
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/v093-retry-exhaustion-safety-gate.yml'
permissions:
  contents: read
jobs:
  retry-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify retry exhaustion never marks work complete
        run: |
          python3 - <<'PY'
          import json,random
          jobs={f'2026-{m:02d}:{stage}':{'status':'PENDING','attempts':0,'committed':False} for m in range(1,11) for stage in ('RAW','QA1','PRICE','FINANCIAL','CHIP')}
          assert len(jobs)==50
          for key in jobs:
              for _ in range(3):
                  jobs[key]['attempts']+=1
                  jobs[key]['status']='PENDING'
                  assert not jobs[key]['committed']
          assert all(j['status']=='PENDING' and j['attempts']==3 and not j['committed'] for j in jobs.values())
          print('RETRY_EXHAUSTION_SAFETY_PASS '+json.dumps({'jobs':50,'failed_attempts':150,'false_completed':0,'pending_for_manual_or_later_recovery':50,'test_scope':'isolated policy simulation'}))
          PY
      - name: Confirm regression suite
        run: python3 -m unittest discover -s tests -p 'test_*.py' -q
