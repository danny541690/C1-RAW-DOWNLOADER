name: JARVIS v097 Bronze Full Evidence Automatic Recovery
# Never runs Silver/Gold, never modifies frozen Bronze bytes.
on:
  push:
    paths:
      - scripts/v097_evidence_contract.py
      - scripts/v097_fullfile_evidence_builder.py
      - scripts/v097_bronze_full_evidence_run_request.txt
      - .github/workflows/v097_bronze_full_evidence_auto.yml
  workflow_dispatch:
  schedule:
    - cron: '12,42 * * * *'
permissions:
  contents: read
  actions: write
concurrency:
  group: v097-bronze-full-evidence-auto
  cancel-in-progress: false
jobs:
  strict-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies for source API and immutable receipt helpers
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: Positive and negative tests including duplicate keys, missing columns, bad SHA and PIT lookahead
        run: |
          set -euo pipefail
          python -m py_compile scripts/v097_evidence_contract.py scripts/v097_fullfile_evidence_builder.py
          PYTHONPATH=. python scripts/v097_evidence_contract.py selftest
          PYTHONPATH=. python scripts/v097_fullfile_evidence_builder.py selftest
          PYTHONPATH=. python scripts/v097_d_seven_source_gate.py selftest
          PYTHONPATH=. python scripts/v097_fullfile_pit_release_preflight.py selftest
  evidence-build:
    needs: strict-contract-tests
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[BRONZE-FULL]')
    runs-on: ubuntu-latest
    timeout-minutes: 80
    concurrency:
      group: v097-evidence-builder-${{ matrix.source }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        source: [TWSE, TPEx, MOPS, TDCC, TAIFEX, NDC, FinMind]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: Verify frozen Bronze SHA and classify actual missing independent full-file evidence
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          EVIDENCE_BUILD_BATCH: '32'
        run: PYTHONPATH=. python scripts/v097_fullfile_evidence_builder.py '${{ matrix.source }}'
  independent-release-preflight:
    needs: evidence-build
    if: (github.event_name != 'push' || contains(github.event.head_commit.message, '[BRONZE-FULL]')) && needs.evidence-build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        source: [TWSE, TPEx, MOPS, TDCC, TAIFEX, NDC, FinMind]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: Re-evaluate the existing independent D gate without granting READY
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          D_BATCH: '120'
        run: PYTHONPATH=. python scripts/v097_d_seven_source_gate.py '${{ matrix.source }}'
      - name: Strict all-file and publication PIT preflight from true evidence, HOLD otherwise
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          PIT_GATE_BATCH: '500'
        run: PYTHONPATH=. python scripts/v097_fullfile_pit_release_preflight.py '${{ matrix.source }}'
  final-reconcile-and-dispatch:
    needs: [strict-contract-tests,evidence-build,independent-release-preflight]
    if: (github.event_name != 'push' || contains(github.event.head_commit.message, '[BRONZE-FULL]')) && always()
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Refuse false success if previous work failed
        env:
          CONTRACT: ${{ needs.strict-contract-tests.result }}
          BUILDER: ${{ needs.evidence-build.result }}
          PREFLIGHT: ${{ needs.independent-release-preflight.result }}
        run: |
          echo "EVIDENCE_CONTRACT=$CONTRACT BUILDER=$BUILDER PREFLIGHT=$PREFLIGHT"
          test "$CONTRACT" = success
          test "$BUILDER" = success
          test "$PREFLIGHT" = success
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: Reconcile actual 74750 release and new HOLD reasons; write report to Drive
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: PYTHONPATH=. python scripts/v097_bronze_evidence_gap_census.py
      - name: Dispatch existing independent Bronze input release when idle only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          active=$(gh api "repos/$GH_REPO/actions/workflows/v097_bronze_autopilot.yml/runs?per_page=20" --jq '[.workflow_runs[] | select(.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="pending")] | length')
          if [ "$active" -eq 0 ]; then
            gh workflow run v097_bronze_autopilot.yml --ref main -f chain_depth=0
            echo "BRONZE_FORMAL_RELEASE_DISPATCH_ACCEPTED"
          else
            echo "BRONZE_FORMAL_RELEASE_ALREADY_ACTIVE count=$active"
          fi
          echo "EXTERNAL_PROOF_ABSENT_MEANS_HOLD; NO_SILVER_OR_GOLD"
