name: JARVIS RAW Hourly 60m 20261022
on:
  push:
    paths:
      - '.github/workflows/jarvis-raw-hourly-60m-20261022.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-qa.lock
      - run: pip install -r requirements-qa.lock
      - name: Verify RAW hour budget and preserved history checkpoint
        run: |
          python3 -m unittest discover -s tests -q
          python3 -m scripts.v093_five_stage_combined_contract
      - name: Enable hourly RAW and dispatch 60-minute continuation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,yaml
          from scripts.v093_replan_control import api,all_pages
          from scripts.v093_replanned_five_stage import lease_ttl_for
          plan=json.load(open('config/v093_execution_plan_20261021.json'))
          wf=yaml.safe_load(open('.github/workflows/v093-v2-01-raw.yml'))
          triggers=wf.get('on',wf.get(True))
          assert plan['worker_budgets_minutes']['RAW']==60
          assert triggers['schedule']==[{'cron':'1 * * * *'}]
          assert wf['jobs']['worker']['timeout-minutes']==75
          assert lease_ttl_for(60)>75*60
          api('/actions/workflows/v093-v2-01-raw.yml/enable','PUT')
          api('/actions/workflows/v093-v2-01-raw.yml/dispatches','POST',{'ref':'main','inputs':{'minutes':'60'}})
          print('RAW_HOURLY_60M_ENABLED '+json.dumps({'worker_budget_minutes':60,'cron_utc':'1 * * * *','workflow_timeout_minutes':75,'lease_ttl_seconds':5400,'checkpoint_reset':False,'inflight_policy':'FINISH_THEN_RESUME','all_five_hourly_budgets':plan['worker_budgets_minutes']}),flush=True)
          api('/actions/workflows/jarvis-raw-hourly-60m-20261022.yml/disable','PUT')
          PY
