name: 櫃買中心排程二之二（2-2）｜最舊往新｜候選執行入口（正式未啟用）
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Entry validation uses fixtures; production remains blocked
        type: choice
        options: [entry-validation, production]
        default: entry-validation
permissions:
  contents: write
concurrency:
  group: jarvis-seven-entry-tpex-asc
  cancel-in-progress: false
jobs:
  worker:
    uses: ./.github/workflows/jarvis-seven-worker.yml
    with:
      source: TPEx
      direction: ASC
      mode: ${{ inputs.mode }}
    secrets: inherit
