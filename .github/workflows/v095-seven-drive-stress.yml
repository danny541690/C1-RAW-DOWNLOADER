name: JARVIS v0.95 Seven-source historical Drive combined stress (isolated)
on:
  push:
    branches: [test/jarvis-v095-one-shot-fast-20261105]
    paths:
      - .github/workflows/v095-seven-drive-stress.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jarvis-v095-seven-drive-provenance-stress
  cancel-in-progress: false
jobs:
  source-provenance:
    name: Source historical Drive check / ${{ matrix.source }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        source: [TWSE, TPEx, MOPS, NDC, TAIFEX, TDCC, FinMind]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/jarvis-v095-one-shot-fast-20261105
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install common dependencies only once per worker
        run: python -m pip install --disable-pip-version-check pyarrow google-api-python-client google-auth-httplib2 google-auth-oauthlib
      - name: Real Drive source SHA and bounded structural validation to immutable Parquet candidate
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: PYTHONPATH=. python tests/v095_seven_drive_provenance_stress.py --source "${{ matrix.source }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-stress-${{ matrix.source }}-${{ github.run_id }}
          path: v095_seven_drive_stress/${{ matrix.source }}/
          if-no-files-found: warn
          retention-days: 14
  aggregate:
    name: Seven source bottleneck and completeness audit
    needs: source-provenance
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/jarvis-v095-one-shot-fast-20261105
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: source-stress-*-${{ github.run_id }}
          path: v095_seven_drive_stress/_downloads
      - name: Consolidate source outcomes without hiding missing reports
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('v095_seven_drive_stress')
          for src in ('TWSE','TPEx','MOPS','NDC','TAIFEX','TDCC','FinMind'):
              found=list((root/'_downloads').glob(f'source-stress-{src}-*/report.json'))
              if len(found)==1:
                  t=root/src; t.mkdir(exist_ok=True)
                  (t/'report.json').write_bytes(found[0].read_bytes())
          PY
          python tests/v095_seven_drive_stress_aggregate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v095-seven-source-stress-summary-${{ github.run_id }}
          path: v095_seven_drive_stress/SEVEN_SOURCE_COMBINED_REPORT.json
          retention-days: 30
          if-no-files-found: warn
