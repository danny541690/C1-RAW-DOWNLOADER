name: JARVIS v0.95 7-source Matrix 3-2-1 pipeline smoke (isolated)
on:
  push:
    branches: [test/jarvis-v095-one-shot-fast-20261105]
    paths:
      - .github/workflows/v095-matrix-321-smoke.yml
      - tests/v095_matrix_stage_worker.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jarvis-v095-matrix-321
  cancel-in-progress: false
jobs:
  bronze:
    name: Bronze / ${{ matrix.source }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        source: [TWSE, TPEx, MOPS, NDC, TAIFEX, TDCC, FinMind]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/jarvis-v095-one-shot-fast-20261105
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded validation libraries
        run: python -m pip install --disable-pip-version-check pyarrow openpyxl
      - name: Fetch complete bounded sample with source-specific checks and SHA
        run: python tests/v095_matrix_stage_worker.py --source "${{ matrix.source }}" --stage bronze
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v095-bronze-${{ matrix.source }}-${{ github.run_id }}
          path: matrix_stage/${{ matrix.source }}/
          if-no-files-found: warn
          retention-days: 7
  silver:
    name: Silver / ${{ matrix.source }}
    needs: bronze
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        source: [TWSE, TPEx, MOPS, NDC, TAIFEX, TDCC, FinMind]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/jarvis-v095-one-shot-fast-20261105
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Parquet library
        run: python -m pip install --disable-pip-version-check pyarrow openpyxl
      - uses: actions/download-artifact@v4
        with:
          name: v095-bronze-${{ matrix.source }}-${{ github.run_id }}
          path: matrix_stage/${{ matrix.source }}/
      - name: Verify original SHA and convert lossless Parquet candidate
        run: python tests/v095_matrix_stage_worker.py --source "${{ matrix.source }}" --stage silver
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v095-silver-${{ matrix.source }}-${{ github.run_id }}
          path: matrix_stage/${{ matrix.source }}/
          retention-days: 7
          if-no-files-found: warn
  gold-qa:
    name: Gold QA / ${{ matrix.source }}
    needs: silver
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        source: [TWSE, TPEx, MOPS, NDC, TAIFEX, TDCC, FinMind]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/jarvis-v095-one-shot-fast-20261105
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Parquet and workbook validation libraries
        run: python -m pip install --disable-pip-version-check pyarrow openpyxl
      - uses: actions/download-artifact@v4
        with:
          name: v095-silver-${{ matrix.source }}-${{ github.run_id }}
          path: matrix_stage/${{ matrix.source }}/
      - name: Verify Silver artifact and produce QA-only Gold metadata
        run: python tests/v095_matrix_stage_worker.py --source "${{ matrix.source }}" --stage gold
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v095-gold-qa-${{ matrix.source }}-${{ github.run_id }}
          path: matrix_stage/${{ matrix.source }}/
          retention-days: 7
          if-no-files-found: warn
