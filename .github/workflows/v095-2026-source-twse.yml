name: JARVIS v0.95 2026 TWSE independent Bronze and downstream gate
# 2026 source-scoped writer; real official fallback and immediate BSG candidate plus lineage.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v095-2026-source-twse.yml'
  schedule:
    - cron: '4,19,34,49 * * * *'
permissions:
  contents: read
concurrency:
  group: jarvis-v095-2026-source-twse-single-writer
  cancel-in-progress: false
jobs:
  source-twse:
    if: github.repository == 'danny541690/C1-RAW-DOWNLOADER'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      V095_PRICE_SOURCE: 'TWSE'
      V095_2026_BATCH_DAYS: '10'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact common Drive, Arrow and source adapter dependencies once
        run: python -m pip install --disable-pip-version-check pyarrow google-api-python-client google-auth google-auth-httplib2
      - name: Check non-release gates and compile source-specific adapters
        run: |
          python - <<'PY'
          import json
          x=json.load(open('governance/v095/PHASE1_FLAGS.json'))
          assert x['BULK_COPY_APPROVED'] is False and x['RELEASE_APPROVED'] is False
          print('V095_SOURCE_ISOLATED_CANDIDATE_ONLY')
          PY
          python -m py_compile scripts/v095_2026_price_incremental.py scripts/v095_2026_legacy_first.py scripts/v095_2026_bsg_lineage_gate.py
      - name: Bronze v0.93 verified first then live official; immediately Silver and descriptive Gold
        run: python -m scripts.v095_2026_price_incremental
      - name: Independently read back all three tiers and validate bidirectional SHA and row lineage
        run: python -m scripts.v095_2026_bsg_lineage_gate
      - name: Preserve full per-partition actual results, exceptions and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v095-2026-twse-source-${{ github.run_id }}
          path: |
            v095_2026_price_incremental/result.json
            v095_2026_price_incremental/lineage_receipt.json
          if-no-files-found: warn
          retention-days: 90
