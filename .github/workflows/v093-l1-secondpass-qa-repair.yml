name: JARVIS v0.93 L1 RAW Second-pass QA and Gap Repair
on:
  push:
    paths:
      - '.github/workflows/v093-l1-secondpass-qa-repair.yml'
  workflow_dispatch:
  schedule:
    - cron: '29 * * * *'
permissions:
  contents: read
  actions: write
concurrency:
  group: jarvis-v093-l1-qa-201504-plus-single-writer
  cancel-in-progress: false
jobs:
  second-pass-qa-and-targeted-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-qa.lock
      - name: Install locked dependencies
        run: pip install -r requirements-qa.lock
      - name: Offline scope and code sanity
        run: |
          python3 -m py_compile scripts/v093_l1_secondpass_qa_repair.py
          python3 -m unittest discover -s tests -p 'test_*.py' -q
      - name: Immediately audit and repair latest-to-2015-04 RAW months
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -u -m scripts.v093_l1_secondpass_qa_repair --minutes 40
