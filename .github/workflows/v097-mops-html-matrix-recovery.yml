name: JARVIS v0.97 - MOPS 388 HTML financial matrix recovery
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v097_mops_html_matrix_recovery.py'
      - '.github/workflows/v097-mops-html-matrix-recovery.yml'
  workflow_dispatch:
  schedule:
    - cron: '12,42 * * * *'
permissions:
  contents: read
concurrency:
  group: v097-mops-matrix-single-writer
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'danny541690/C1-RAW-DOWNLOADER'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - run: |
          python -m py_compile scripts/v097_mops_html_matrix_recovery.py
          PYTHONPATH=. python scripts/v097_mops_html_matrix_recovery.py
  bootstrap:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: Single writer initialize 0.97 MOPS matrix quarantine
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          MOPS_MATRIX_MODE: bootstrap
        run: PYTHONPATH=. python scripts/v097_mops_html_matrix_recovery.py
  parse-verify-six:
    needs: bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        lane: [0,1,2,3,4,5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: Extract actual MOPS financial matrices with unit/numeric and cross-source SHA QA
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          MOPS_MATRIX_MODE: lane
          MOPS_REPAIR_LANE: ${{ matrix.lane }}
          MOPS_REPAIR_BATCH: '20'
        run: |
          for round in $(seq 1 30); do
            log=$(PYTHONPATH=. python scripts/v097_mops_html_matrix_recovery.py)
            echo "$log"
            if echo "$log" | grep -q '"remaining": 0'; then break; fi
          done
  report:
    needs: parse-verify-six
    if: always() && needs.parse-verify-six.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: Publish exact parser pass/hold numbers to Drive management
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          MOPS_MATRIX_MODE: summary
        run: PYTHONPATH=. python scripts/v097_mops_html_matrix_recovery.py
