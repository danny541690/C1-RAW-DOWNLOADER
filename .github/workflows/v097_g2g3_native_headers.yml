name: JARVIS V097 G2 G3 Native Header Recovery (No Conversion)
# Independent 7-source incremental lanes; original Bronze always read-only.
on:
  push:
    paths:
      - .github/workflows/v097_g2g3_native_headers.yml
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v097-g2g3-native-headers-single-round
  cancel-in-progress: false
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Strict header-only safety tests
        run: |
          set -euo pipefail
          python -m py_compile scripts/v097_g2g3_native_headers.py
          PYTHONPATH=. python scripts/v097_g2g3_native_headers.py selftest
  source_headers:
    needs: safety
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        source: [TWSE, TPEx, MOPS, TDCC, TAIFEX, NDC, FinMind]
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native XLSX and Google Drive libraries
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib openpyxl
      - name: Verify original SHA and extract only missing native headers
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          G2G3_HEADER_BATCH: '60'
        run: PYTHONPATH=. python scripts/v097_g2g3_native_headers.py source '${{ matrix.source }}'
