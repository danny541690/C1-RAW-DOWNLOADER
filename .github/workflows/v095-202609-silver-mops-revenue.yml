name: JARVIS v0.95 Sep 2026 Bronze to Silver MOPS revenue candidate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v095-202609-silver-mops-revenue.yml'
      - 'scripts/v095_202609_mops_silver_revenue_candidate.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jarvis-v095-202609-mops-silver-candidate
  cancel-in-progress: false
jobs:
  mops-silver-revenue:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Parquet and Google Drive runtime
        run: python -m pip install --disable-pip-version-check pyarrow google-api-python-client google-auth google-auth-httplib2
      - name: Convert original 4 September MOPS CP950 revenue source pages, preserve original native units
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python scripts/v095_202609_mops_silver_revenue_candidate.py
      - name: Preserve QA result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v095-202609-silver-mops-revenue-${{ github.run_id }}
          path: v095_silver_mops_202609/
          retention-days: 90
          if-no-files-found: warn

# Revalidate observed 2026-09 candidates after 2026-11-06 source-gap audit; existing QA gates remain enforced.
