name: JARVIS v0.95 2026 AUTO incremental inventory and 3-tier evidence
# Safe interim yearly controller. NO bulk-release, no claim of full-year coverage.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v095-2026-auto-recovery.yml'
      - 'scripts/v095_2026_price_incremental.py'
  # Schedule is owned by the 15-minute recovery watchdog; this workflow is dispatched hourly when idle.
permissions:
  contents: read
concurrency:
  group: jarvis-v095-2026-auto-recovery
  cancel-in-progress: false
jobs:
  year-2026-reconcile:
    if: github.repository == 'danny541690/C1-RAW-DOWNLOADER'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate production remains fail-closed pending dataset-specific evidence
        run: |
          python - <<'PY'
          import json
          f=json.load(open('governance/v095/PHASE1_FLAGS.json'))
          assert f['BULK_COPY_APPROVED'] is False and f['RELEASE_APPROVED'] is False
          print('GATE_LOCKED: inventory and verified candidate replay ONLY')
          PY
      - name: Install official Drive readers and Parquet candidate verifier
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 pyarrow
      - name: Verify checkpoint and PIT/CAS model before any candidate replay
        run: |
          python -m unittest discover -s tests -p 'test_v095_2026_annual_consolidated.py' -v
          python -m unittest discover -s tests -p 'test_v095_r13_single_committer_contract.py' -v
          python scripts/v095_r13_single_committer_contract.py
      - name: Incremental 2026 actual TWSE TPEx price Bronze Silver Gold candidate producer
        env:
          V095_2026_BATCH_DAYS: '10'
        run: |
          python -m py_compile scripts/v095_2026_price_incremental.py
          python -m scripts.v095_2026_price_incremental
      - name: Inventory and byte-sample existing 2026 RAW; no valid archive redownload
        run: python -m scripts.v095_2026_prior_raw_reuse_audit
      - name: Combined verified native Bronze Silver descriptive Gold run (Nov 2 3 6)
        env:
          V095_SOURCE_FILTER: 'TWSE,TPEx'
          V095_CANARY_DATES: '2026-11-02,2026-11-03,2026-11-06'
          V095_CANARY_REQUIRE_COMPLETE: '0'
        run: |
          python -m scripts.v095_ultimate_r1_november_official
          cp ultimate_r1/november_latest_bsg.json ultimate_r1/november_reuse_batch_a.json
      - name: Combined second verified native BSG run (Nov 4 5)
        env:
          V095_SOURCE_FILTER: 'TWSE,TPEx'
          V095_CANARY_DATES: '2026-11-04,2026-11-05'
          V095_CANARY_REQUIRE_COMPLETE: '0'
        run: |
          python -m scripts.v095_ultimate_r1_november_official
          cp ultimate_r1/november_latest_bsg.json ultimate_r1/november_reuse_batch_b.json
      - name: Consolidate native candidate receipts and forward/reverse hash lineage status
        run: |
          python - <<'PY'
          import json,pathlib,os
          a=json.loads(pathlib.Path('ultimate_r1/november_reuse_batch_a.json').read_text())
          b=json.loads(pathlib.Path('ultimate_r1/november_reuse_batch_b.json').read_text())
          combined={**a['completed'],**b['completed']}
          rejected={**a['rejected'],**b['rejected']}
          out={'run_id':os.getenv('GITHUB_RUN_ID'),
               'date_scope':'2026-11-02..2026-11-06',
               'completed':combined,'rejected':rejected,
               'units_verified':len(combined),
               'new_bronze_files':sum('CREATED'==v['actions'][0] for v in combined.values()),
               'new_silver_files':sum('CREATED'==v['actions'][1] for v in combined.values()),
               'new_gold_files':sum('CREATED'==v['actions'][2] for v in combined.values()),
               'scoped_lineage_present':sum(all(v.get(k) for k in ('bronze_id','silver_id','gold_id','sha256')) for v in combined.values()),
               'historical_pit_verified':False,'full_year_complete':False}
          pathlib.Path('ultimate_r1/november_combined_receipt.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({k:out[k] for k in ('units_verified','new_bronze_files','new_silver_files','new_gold_files','scoped_lineage_present','rejected','historical_pit_verified')},ensure_ascii=False))
          PY
      - name: Reconcile Jan-Nov 2026 source-month and B/S/G evidence, PIT and lineage status
        run: python -m scripts.v095_2026_annual_consolidated
      - name: Explicitly reject false full-year completion
        run: |
          python - <<'PY'
          import json,pathlib
          r=json.loads(pathlib.Path('annual_2026/report.json').read_text())
          assert not r['verified_2026_full_year_complete']
          assert not r['all_year_tier_release']
          assert not r['production_cas_proven']
          assert r['source_month_cells']==66
          assert not r['gold_pit_new_computations']
          print('2026_YEAR_STATUS:',r['inspection_status'])
          print('2026_CANDIDATE_OBJECTS:',r['object_candidates'])
          print('BLOCKERS:',*r['blocking_causes'],sep='\n- ')
          PY
      - name: Archive immutable annual state in Google Drive Operations with SHA readback
        run: python -m scripts.v095_2026_annual_drive_archive
      - name: Retain full monthly audit, candidate checkpoint evidence and failed-run diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v095-2026-auto-recovery-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            annual_2026/
            v095_2026_price_incremental/
            annual_2026_prior/
            ultimate_r1/november_latest_bsg.json
            ultimate_r1/november_reuse_batch_a.json
            ultimate_r1/november_reuse_batch_b.json
            ultimate_r1/november_combined_receipt.json
            r13_single_pass/result.json
