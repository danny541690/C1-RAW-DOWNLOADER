name: JARVIS v0.95 TAIFEX 2015-2017 bounded annual calendar repair
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v095-taifex-2015-2017-calendar-repair.yml'
permissions:
  contents: read
jobs:
  native-annual-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retry only three missing TAIFEX annual native ZIPs, logging exact cause
        run: python -u -m scripts.v095_taifex_annual_market_dates --start 2015 --end 2017
      - name: Archive only derived positive evidence and exact failure receipt
        run: |
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2
          python - <<'PY'
          from scripts.v095_market_release_calendar_drive_archive import drive,archive
          from pathlib import Path
          d=drive()
          for p in Path('v095_taifex_historical_sessions').glob('*'):
            if p.stat().st_size<90_000_000:archive(d,p)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: taifex-2015-2017-repair-${{ github.run_id }}
          path: |
            v095_taifex_historical_sessions/*result.json
            v095_taifex_historical_sessions/*confirmed.csv
          retention-days: 90
          if-no-files-found: warn
