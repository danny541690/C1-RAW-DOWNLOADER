name: JARVIS v0.98 FinMind FREE complete candidate history and schema audit
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/v098_finmind_free_history_audit.py
      - .github/workflows/v098-finmind-free-history-audit.yml
permissions:
  contents: read
jobs:
  free-history:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Query FinMind anonymous Free dataset candidates and dates
        run: python3 scripts/v098_finmind_free_history_audit.py
      - name: Preserve observed schemas and dates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-v098-finmind-free-history
          path: free_source_audit/
          retention-days: 60
          if-no-files-found: warn
