name: JARVIS official repair schedules 1 to 4
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v093-official-four-lane-repair.yml'
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-qa.lock
      - run: pip install -r requirements-qa.lock
      - run: python -m unittest discover -s tests -q
  repair:
    needs: checks
    name: Schedule ${{ matrix.number }} ${{ matrix.lane }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - number: 1
            lane: EARLY_ASC
          - number: 2
            lane: EARLY_DESC
          - number: 3
            lane: RECENT_ASC
          - number: 4
            lane: RECENT_DESC
    concurrency:
      group: jarvis-official-four-lane-${{ matrix.lane }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-qa.lock
      - run: pip install -r requirements-qa.lock
      - name: Reserve shared GitHub control budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.v093_github_budget --minimum 250 --max-wait 300
      - name: Audit saved RAW and repair missing or invalid official units
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          REPAIR_LANE: ${{ matrix.lane }}
        run: python -m scripts.v093_official_repair --lane "$REPAIR_LANE" --minutes 40
