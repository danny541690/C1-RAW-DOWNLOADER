name: JARVIS v0.95 2025 TDCC isolated Silver descriptive Gold candidate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v095-2025-downstream-tdcc.yml'
      - 'scripts/v095_legacy_tdcc_mirror_adapter.py'
      - 'tests/test_v095_2025_2026_source_native_adapters.py'
  schedule:
    - cron: '27 * * * *'
permissions:
  contents: read
concurrency:
  group: jarvis-v095-2025-downstream-tdcc-single-writer
  cancel-in-progress: false
jobs:
  downstream-tdcc-2025:
    if: github.repository == 'danny541690/C1-RAW-DOWNLOADER'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      V095_BRONZE_SOURCE: 'TDCC'
      V095_PRICE_SOURCE: 'TDCC'
      V095_DATA_YEAR: '2025'
      V095_DOWNSTREAM_BATCH: '6'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate original-source daily native adapter and reject incorrect SHA
        run: |
          python -m unittest discover -s tests -p 'test_v095_2025_2026_source_native_adapters.py' -v
          python -m py_compile scripts/v095_legacy_tdcc_mirror_adapter.py scripts/v095_legacy_taifex_csv_adapter.py
      - name: Install normalized source adapters
        run: python -m pip install --disable-pip-version-check pyarrow openpyxl google-api-python-client google-auth google-auth-httplib2
      - name: Validate 2025 candidate-only and frozen production release
        run: |
          python -m py_compile scripts/v095_2026_immediate_silver_gold.py
          python - <<'PY'
          import json,os
          assert os.environ['V095_DATA_YEAR']=='2025'
          flags=json.load(open('governance/v095/PHASE1_FLAGS.json'))
          assert not flags['RELEASE_APPROVED'] and not flags['BULK_COPY_APPROVED']
          PY
      - name: Convert validated 2025 Bronze incrementally and preserve PIT block
        run: python -u -m scripts.v095_2026_immediate_silver_gold
      - name: Archive immutable year-scoped conversion receipt to Drive
        if: always()
        env:
          V095_RECEIPT_LANE: 'SILVER_GOLD'
        run: python -u -m scripts.v095_2026_publish_run_receipt
      - name: Keep individual 2025 result and exception evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v095-2025-tdcc-downstream-${{ github.run_id }}
          path: |
            v095_2025_immediate_downstream/result.json
            v095_2025_immediate_downstream/lineage_receipt.json
            v095_2025_immediate_downstream/missing_indicators.json
            v095_2026_run_receipt/drive_receipt.json
          retention-days: 90
          if-no-files-found: warn
