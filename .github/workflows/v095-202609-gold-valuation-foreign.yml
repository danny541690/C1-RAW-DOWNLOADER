name: JARVIS v0.95 September Gold descriptive valuation and foreign ownership 3 lane
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v095-202609-gold-valuation-foreign.yml'
      - 'scripts/v095_202609_gold_valuation_foreign_3lane.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jarvis-v095-202609-gold-valuation
  cancel-in-progress: false
jobs:
  compute:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        lane: [tse-valuation]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pyarrow google-api-python-client google-auth google-auth-httplib2
      - name: Build verified fields Gold descriptive current-asof snapshot only
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python scripts/v095_202609_gold_valuation_foreign_3lane.py --lane ${{ matrix.lane }}
      - name: Preserve independent validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v095-gold-valuation-${{ matrix.lane }}-${{ github.run_id }}
          path: v095_gold_valuation_foreign/
          if-no-files-found: warn
          retention-days: 90
