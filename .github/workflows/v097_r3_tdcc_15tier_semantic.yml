name: JARVIS R3 TDCC 15 tiers plus total native ten file validation
on:
  push:
    branches: [r3-bronze-silver-ready-staging-20261118]
    paths: ['.github/workflows/v097_r3_tdcc_15tier_semantic.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jarvis-r3-tdcc-ten-native-15-tier-total-proof
  cancel-in-progress: false
jobs:
  all-tdcc-native-rows-semantic:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: Inspect all original TDCC 15 bands plus total, exact numerical sums, current official OpenAPI structure
        run: |
          set -euo pipefail
          python -m py_compile scripts/v097_r3_tdcc_semantic_15band_contract.py
          PYTHONPATH=. python scripts/v097_r3_tdcc_semantic_15band_contract.py
      - if: always()
        run: echo 'No false G2 PASS on native tier totals alone. Preserve security effective date and official original response requirement. Bronze read-only.' >> "$GITHUB_STEP_SUMMARY"
