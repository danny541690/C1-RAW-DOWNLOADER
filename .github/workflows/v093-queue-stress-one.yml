name: JARVIS v0.93 Queue Stress ONE
permissions:
  contents: read
concurrency:
  group: jarvis-v093-test-only-queue-stress
  cancel-in-progress: false
jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Observe shared concurrency pending queue
      run: 'echo "QUEUE_STRESS_ONE_START $(date -u +%Y-%m-%dT%H:%M:%SZ)"

        sleep 35

        echo "QUEUE_STRESS_ONE_END $(date -u +%Y-%m-%dT%H:%M:%SZ)"

        '
'on':
  workflow_dispatch: null
