name: JARVIS one-off live read-only two-round rehearsal
on:
  push:
    branches: [codex/acceptance-scheduler-3-workers-20261028]
    paths: [.github/workflows/jarvis-acceptance-live-rehearsal.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jarvis-scheduled-acceptance
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-qa.lock
      - run: pip install -r requirements-qa.lock
      - run: python -m scripts.v093_acceptance_state restore --lane inventory --directory durable --lease inventory-lease.json
      - name: Finish bounded read-only inventory, continuing existing pages
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          for slice in 1 2 3 4 5; do
            python -m scripts.v093_acceptance_scheduler --inventory-only --state durable --lease inventory-lease.json --out results/inventory
            if python -c "from scripts.v093_acceptance_scheduler import load; from pathlib import Path; raise SystemExit(0 if load(Path('durable/inventory.json.gz'))['phase']=='DONE' else 1)"; then
              break
            fi
          done
          python -c "from scripts.v093_acceptance_scheduler import load; from pathlib import Path; assert load(Path('durable/inventory.json.gz'))['phase']=='DONE', 'Inventory budget exhausted; checkpoint retained'"
      - name: Preserve inventory state on failure
        if: always()
        run: |
          if [ -f inventory-lease.json ]; then
            python -m scripts.v093_acceptance_state save --lane inventory --directory durable --lease inventory-lease.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jarvis-live-inventory-${{ github.run_id }}
          path: |
            durable/*.json.gz
            results/inventory/summary.json
          overwrite: true
          retention-days: 30
  workers:
    needs: inventory
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-qa.lock
      - run: pip install -r requirements-qa.lock
      - uses: actions/download-artifact@v4
        with:
          name: jarvis-live-inventory-${{ github.run_id }}
          path: shared-inventory
      - name: Run two live bounded slices, restoring durable state for each
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          LIVE_SHARD: ${{ matrix.shard }}
        run: |
          for round in 1 2; do
            python -m scripts.v093_acceptance_state restore --lane "worker-$LIVE_SHARD" --directory "durable-round$round" --lease "lease-round$round.json"
            python -m scripts.v093_acceptance_scheduler --state "durable-round$round" --lease "lease-round$round.json" --inventory-state shared-inventory/durable --shard-index "$LIVE_SHARD" --out "results/round$round"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          first=json.loads(Path('results/round1/summary.json').read_text())['slice']
          second=json.loads(Path('results/round2/summary.json').read_text())['slice']
          assert first['inspected'] > 0, 'No newly read real content evidence in first round'
          assert second.get('reused',0) >= first['inspected'], 'First-round evidence was not fully reused'
          print(json.dumps({'live_two_round_resume_verified':True,'first_inspected':first['inspected'],'second_inspected':second['inspected'],'second_reused':second['reused'],'formal_release_approved':False}))
          PY
      - name: Preserve each round's checkpoint on failure
        if: always()
        env:
          LIVE_SHARD: ${{ matrix.shard }}
        run: |
          for round in 1 2; do
            if [ -f "lease-round$round.json" ]; then
              python -m scripts.v093_acceptance_state save --lane "worker-$LIVE_SHARD" --directory "durable-round$round" --lease "lease-round$round.json"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jarvis-live-worker-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            durable-round*/*.json.gz
            results/round*/summary.*
          overwrite: true
          retention-days: 30
  summary:
    needs: [inventory, workers]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: jarvis-live-*
          path: combined
      - name: Verify both rounds and three live worker identities
        env:
          INVENTORY_RESULT: ${{ needs.inventory.result }}
          WORKERS_RESULT: ${{ needs.workers.result }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from scripts.v093_acceptance_summary import combine
          reports=[json.loads(p.read_text()) for p in Path('combined').rglob('summary.json')]
          inventory=[s for s in reports if s.get('lane')=='inventory']
          results=[]
          for round in (1,2):
              workers=[json.loads(p.read_text()) for p in Path('combined').rglob('summary.json') if p.parent.name==f'round{round}']
              result=combine(inventory+workers,os.environ['INVENTORY_RESULT'],os.environ['WORKERS_RESULT'])
              results.append(dict(round=round,**result))
          Path('results').mkdir(exist_ok=True)
          Path('results/live-readiness.json').write_text(json.dumps(results,ensure_ascii=False,indent=2)+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('# 一次性線上唯讀合併驗證\n\n')
              for r in results:f.write(f"第{r['round']}輪：{r['pipeline_status']}，{r['reported_workers']}/3工作，本輪內容查驗{r['inspected_this_run']}筆。\n\n")
              f.write('這是排程連線、原件讀回與斷點續跑驗證，並非八大組資料完整驗收；正式發布核准仍0。\n')
          print(json.dumps(results,ensure_ascii=False))
          assert all(not r['errors'] and r['pipeline_status']=='PARTIAL_EVIDENCE_NOT_FULL_ACCEPTANCE' for r in results), 'Live rehearsal incomplete; inspect saved checkpoints'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jarvis-live-result-${{ github.run_id }}
          path: results/live-readiness.json
          overwrite: true
          retention-days: 30
