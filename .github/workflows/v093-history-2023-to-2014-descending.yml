name: JARVIS 2023-2014 Descending Monthly Raw Backfill
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/v093-history-2023-to-2014-descending.yml]
  schedule:
    - cron: '8,23,38,53 * * * *'
concurrency:
  group: v093-history-202312-to-201401
  cancel-in-progress: false
jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install google-api-python-client google-auth google-auth-httplib2
      - name: Descending months, verified Drive raw ZIPs, receipts and durable cursor
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN || secrets.FINMIND_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -u -m scripts.v093_history_reverse --minutes 45
