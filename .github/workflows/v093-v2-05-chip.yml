name: JARVIS v0.93 V2 05 CHIP (Prelaunch)
permissions:
  contents: read
concurrency:
  group: jarvis-v093-v2-cutover-global
  cancel-in-progress: false
jobs:
  prelaunch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install -r requirements-qa.lock
    - name: Validate CHIP scope without touching production
      run: |
        python3 - <<'PYCODE'
        import json
        from scripts.v093_five_stage_policy import prelaunch
        from scripts.v093_five_stage_scheduler_gate import Work,eligible
        stage='CHIP'
        report=prelaunch(stage)
        assert not eligible(Work('2026-10',stage,'ohlc')) if stage!='RAW' else True
        print('FIVE_STAGE_PRELAUNCH_CHECK_PASS '+json.dumps({'writes':0,**report}),flush=True)
        print('PRODUCTION_GATE=BLOCKED_REAL_WORKER_INTEGRATION_AND_OPERATIONAL_ACCEPTANCE_PENDING')
        PYCODE
'on':
  workflow_dispatch: null
