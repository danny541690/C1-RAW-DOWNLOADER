name: JARVIS missing contract diagnostic
on:
  push:
    branches: [codex/seven-source-closed-loop-design-20261029]
    paths: [.github/workflows/jarvis-seven-contract-audit.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: jarvis-missing-contract-audit
  cancel-in-progress: false
jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-qa.lock
      - name: Restore immutable original and reviewed ledgers
        run: |
          mkdir original frozen
          git fetch --depth=1 origin refs/heads/jarvis-handoff-import/20261029-40806985547:refs/remotes/origin/original
          git archive refs/remotes/origin/original | tar -x -C original
          git fetch --depth=1 origin refs/heads/jarvis-handoff-replay/20261029-40812627597:refs/remotes/origin/frozen
          git archive refs/remotes/origin/frozen | tar -x -C frozen
      - name: Diagnose recorded missing eligibility without source requests
        run: python -m scripts.v093_missing_contract_audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: missing-contract-audit
          path: results
          retention-days: 90
