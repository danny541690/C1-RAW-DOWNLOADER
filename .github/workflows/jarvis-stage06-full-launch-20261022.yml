name: JARVIS stage06 cleanup safe handoff
on:
  push:
    paths:
      - '.github/workflows/jarvis-stage06-full-launch-20261022.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-qa.lock
      - name: Transfer old owners only after terminal cancellation
        env:
          GH_TOKEN: ${{ github.token }}
          CLEANUP_DEPLOY_COMMIT: 218d6b8002ffd2162af4b870ea2bb63e2725996f
        run: python -m scripts.v093_stage06_cleanup_handoff
