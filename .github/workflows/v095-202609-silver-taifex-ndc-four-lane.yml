name: JARVIS v0.95 Sep TAIFEX and NDC Silver four-lane source conversion
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v095-202609-silver-taifex-ndc-four-lane.yml'
      - 'scripts/v095_202609_taifex_ndc_four_lane.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jarvis-v095-202609-taifex-ndc-silver
  cancel-in-progress: false
jobs:
  independent-source-family:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        lane: [taifex-options, taifex-futures, taifex-history, ndc-workbook]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime and source XLSX reader
        run: python -m pip install --disable-pip-version-check pyarrow openpyxl google-api-python-client google-auth google-auth-httplib2
      - name: Convert only immutable 2026 September source files and preserve source-native rows
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python scripts/v095_202609_taifex_ndc_four_lane.py --lane ${{ matrix.lane }}
      - name: Record real per-lane output evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v095-202609-silver-${{ matrix.lane }}-${{ github.run_id }}
          path: v095_202609_taifex_ndc_silver/
          if-no-files-found: warn
          retention-days: 60

# Revalidate observed 2026-09 candidates after 2026-11-06 source-gap audit; existing QA gates remain enforced.
