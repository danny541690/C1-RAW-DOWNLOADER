name: JARVIS exact 12 blocker read-only followup
on:
  push:
    branches: [codex/acceptance-scheduler-3-workers-20261028]
    paths: [.github/workflows/jarvis-acceptance-blocked-followup.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jarvis-exact-blocker-followup
  cancel-in-progress: false
jobs:
  exact-followup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-qa.lock
      - run: pip install -r requirements-qa.lock
      - name: Check dispatch boundaries before reading retained RAW
        run: python -m unittest discover -s tests -p 'test_supplement_content_dispatch.py' -v
      - name: Recheck only the original 12 blockers with original SHA
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python -m scripts.v093_acceptance_blocked_followup --cache results/retained-cache --out results/exact-followup --read-existing-drive
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jarvis-exact-blocker-followup-${{ github.run_id }}
          path: results/exact-followup/
          retention-days: 30
          overwrite: true
