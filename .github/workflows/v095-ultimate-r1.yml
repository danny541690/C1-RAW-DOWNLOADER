name: JARVIS v0.95 ULTIMATE R1 - single 15m controller pilot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v095-ultimate-r1.yml'
      - 'scripts/v095_ultimate_r1_controller.py'
      - 'config/v095_ultimate_r1.json'
      - 'scripts/v095_ultimate_r1_14lane_smoke.py'
      - 'scripts/v095_ultimate_r1_october_canary.py'
      - 'scripts/v095_ultimate_r1_october_bsg.py'
      - 'scripts/v095_ultimate_r1_query_october.py'
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: read
concurrency:
  group: JARVIS-v095-ULTIMATE-R1-CONTROLLER
  cancel-in-progress: false
jobs:
  parallel-smoke:
    if: github.repository == 'danny541690/C1-RAW-DOWNLOADER' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix:
        lane: [BRONZE_TWSE, BRONZE_TPEX, BRONZE_MOPS, BRONZE_TDCC, BRONZE_TAIFEX, BRONZE_NDC, SILVER_PRICE, SILVER_FUNDAMENTAL, SILVER_TDCC, SILVER_MACRO, GOLD_TECHNICAL, GOLD_CHIP, GOLD_FINANCIAL, GOLD_CROSS_ASSET]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install light metadata client
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2
      - name: Verify isolated source on real Drive without changing data
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          JARVIS_LANE: ${{ matrix.lane }}
        run: python scripts/v095_ultimate_r1_14lane_smoke.py
      - name: Preserve per-lane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v095-ultimate-${{ github.run_id }}-${{ matrix.lane }}
          path: ultimate_r1_lanes/
          if-no-files-found: warn
          retention-days: 30
  pilot-controller:
    if: github.repository == 'danny541690/C1-RAW-DOWNLOADER'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install single shared runtime
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2
      - name: Six-source pilot 2026 newest to September, archive full specs, checkpoint and gate
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python scripts/v095_ultimate_r1_controller.py
      - name: Bounded real October v093 to v095 staging ingestion with SHA readback
        if: github.event_name != 'schedule'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python scripts/v095_ultimate_r1_october_canary.py
      - name: Real October Bronze Silver Parquet Gold descriptive and SHA QA - 3 known partitions
        if: github.event_name != 'schedule'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          python -m pip install --disable-pip-version-check pyarrow
          python scripts/v095_ultimate_r1_october_bsg.py
      - name: Publish ChatGPT query index with real October Gold Parquet examples and reverse lineage
        if: github.event_name != 'schedule'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python scripts/v095_ultimate_r1_query_october.py
      - name: Check existing September Silver Gold immutable incremental checkpoints
        if: github.event_name != 'schedule'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python scripts/v095_202609_unified_resume.py
      - name: Pilot real September Gold to Silver to Bronze 2330 MA5 trace
        if: github.event_name != 'schedule'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          JARVIS_STOCK: '2330'
          JARVIS_INDICATOR: 'MA5'
          JARVIS_DATE: '2026-09-30'
          JARVIS_MARKET: 'TSE'
        run: |
          python -m pip install --disable-pip-version-check pyarrow
          python scripts/v095_202609_query_trace.py
      - name: Preserve runtime manifest, queue and Drive SHA readback even when blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v095-ultimate-r1-pilot-${{ github.run_id }}
          path: |
            ultimate_r1/
            v095_unified_202609/query_trace.json
            v095_unified_202609/resume_manifest.json
          if-no-files-found: warn
          retention-days: 90
