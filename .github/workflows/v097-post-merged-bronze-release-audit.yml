name: JARVIS v0.97 - Post merged Bronze original release audit
on:
  workflow_run:
    workflows:
      - "JARVIS v0.97 - Merged original Bronze QA and conditional admission"
    types:
      - completed
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v097-post-merged-bronze-release-audit
  cancel-in-progress: false
jobs:
  combined-final-check:
    if: github.repository == 'danny541690/C1-RAW-DOWNLOADER' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: Reconcile 1094 original source file promotion results without conflating release
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          COMBINED_QA_MODE: summary
        run: PYTHONPATH=. python scripts/v097_legacy_combined_bronze_raw_admit.py
      - name: Re-run full dataset Bronze Silver Gold PIT and source release gate on updated 097
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: PYTHONPATH=. python scripts/v097_integrity_release_gate.py
