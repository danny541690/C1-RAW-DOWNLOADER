name: JARVIS v0.93 Layer02 Governance Regression Tests
on:
  push:
    paths:
      - .github/workflows/v093-layer02-governance-tests.yml
      - scripts/v093_layer02_governance.py
      - tests/test_v093_layer02_governance.py
  workflow_dispatch:
jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline governance unit tests
        run: python -m unittest discover -s tests -p test_v093_layer02_governance.py -v
