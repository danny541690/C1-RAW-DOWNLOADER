name: JARVIS v0.95 2025 LINEAGE independent candidate evidence gate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v095-2025-lineage-audit.yml'
      - 'scripts/v095_2026_gold_lineage_controller.py'
  workflow_run:
    workflows:
      - 'JARVIS v0.95 2025 TWSE isolated Silver descriptive Gold candidate'
      - 'JARVIS v0.95 2025 TPEx isolated Silver descriptive Gold candidate'
    types: [completed]
  schedule:
    - cron: '49 * * * *'
permissions:
  contents: read
concurrency:
  group: jarvis-v095-2025-lineage-audit-single
  cancel-in-progress: false
jobs:
  lineage-audit:
    if: github.repository == 'danny541690/C1-RAW-DOWNLOADER'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      V095_DATA_YEAR: '2025'
      V095_AUDIT_MODE: 'LINEAGE'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit dependencies
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2
      - name: Verify historical gate script
        run: python -m py_compile scripts/v095_2026_gold_lineage_controller.py
      - name: Read 2025 source receipts and 443 catalog without invented factors
        run: python -u -m scripts.v095_2026_gold_lineage_controller
      - name: Preserve 2025 audit receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v095-2025-lineage-audit-${{ github.run_id }}
          path: v095_2025_gold_lineage_gate/result.json
          if-no-files-found: warn
          retention-days: 90
