name: JARVIS TAIFEX missing admission diagnostic
on:
  push:
    branches: [codex/seven-source-closed-loop-design-20261029]
    paths: [.github/workflows/jarvis-seven-admission-audit.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  missing:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-qa.lock
      - name: Restore frozen original and reviewed ledgers
        run: |
          mkdir original frozen
          git fetch --depth=1 origin refs/heads/jarvis-handoff-import/20261029-40806985547:refs/remotes/origin/original
          git archive refs/remotes/origin/original | tar -x -C original
          git fetch --depth=1 origin refs/heads/jarvis-handoff-replay/20261029-40812627597:refs/remotes/origin/frozen
          git archive refs/remotes/origin/frozen | tar -x -C frozen
      - name: Classify frozen TAIFEX candidates without source HTTP
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python -m scripts.v093_adapter_live_preflight --mode audit --source TAIFEX --namespace adapter-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve real adapter acceptance evidence
        if: always()
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python -m scripts.v093_acceptance_publish --source TAIFEX --job admission-audit --status '${{ job.status }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admission-audit
          path: results
          retention-days: 90
