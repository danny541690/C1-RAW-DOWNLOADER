name: JARVIS v0.97 - TDCC 5035 official grounded special scope disposition
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v097_tdcc_special_scope_reconcile.py'
      - '.github/workflows/v097-tdcc-special-scope-reconcile.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests
      - run: |
          python -m py_compile scripts/v097_tdcc_special_scope_reconcile.py
          PYTHONPATH=. python scripts/v097_tdcc_special_scope_reconcile.py
  reconcile:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests
      - name: 5035 per-file content QA source SHA destination SHA and stock universe sidecar with official historical 3 samples
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          TDCC_SCOPE_MODE: reconcile
        run: PYTHONPATH=. python scripts/v097_tdcc_special_scope_reconcile.py
