name: JARVIS v0.97 - Automatically admit 800 recovered externally matched TDCC special raws
on:
  workflow_run:
    workflows:
      - "JARVIS v0.97 - Recover 800 TDCC missing numeric receipts and 2026 external checks"
    types:
      - completed
  workflow_dispatch:
  schedule:
    - cron: '27,57 * * * *'
permissions:
  contents: read
concurrency:
  group: v097-tdcc-800-external-verified-raw-admit
  cancel-in-progress: false
jobs:
  selftest:
    if: github.repository == 'danny541690/C1-RAW-DOWNLOADER' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests
      - run: |
          python -m py_compile scripts/v097_tdcc_800_verified_special_admit.py
          PYTHONPATH=. python scripts/v097_tdcc_800_verified_special_admit.py
  bootstrap:
    needs: selftest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests
      - name: Bootstrap isolated 800 verified special original directory
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          TDCC_RECOVER_MODE: bootstrap
        run: PYTHONPATH=. python scripts/v097_tdcc_800_verified_special_admit.py
  admit-six:
    needs: bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        lane: [0,1,2,3,4,5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests
      - name: Copy original only after date/code/shareholder proof and double source/destination SHA
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          TDCC_RECOVER_MODE: lane
          TDCC_RECOVER_LANE: ${{ matrix.lane }}
          TDCC_RECOVER_BATCH: '25'
        run: |
          for n in $(seq 1 12); do
            result=$(PYTHONPATH=. python scripts/v097_tdcc_800_verified_special_admit.py)
            echo "$result"
            if echo "$result" | grep -q '"remaining": 0'; then break; fi
          done
  summary:
    needs: admit-six
    if: always() && needs.admit-six.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests
      - name: Audited source IDs admitted to special raw; ordinary stock Bronze unchanged
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          TDCC_RECOVER_MODE: summary
        run: PYTHONPATH=. python scripts/v097_tdcc_800_verified_special_admit.py
