name: JARVIS v0.95 Seven-source content numeric + NDC archive audit (isolated)
on:
  push:
    branches: [test/jarvis-v095-one-shot-fast-20261105]
    paths:
      - .github/workflows/v095-content-numeric-audit.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jarvis-v095-content-numeric-audit
  cancel-in-progress: false
jobs:
  numeric-qa:
    name: Numeric/PIT provenance / ${{ matrix.source }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        source: [TWSE, TPEx, MOPS, NDC, TAIFEX, TDCC, FinMind]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/jarvis-v095-one-shot-fast-20261105
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal Drive runtime once
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth-httplib2 google-auth-oauthlib
      - name: Inspect historical numeric cells and archive SHA, leave unverified PIT blocked
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: PYTHONPATH=. python tests/v095_seven_numeric_provenance_qa.py --source "${{ matrix.source }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v095-numeric-${{ matrix.source }}-${{ github.run_id }}
          path: v095_content_qa/${{ matrix.source }}/report.json
          retention-days: 14
          if-no-files-found: warn
