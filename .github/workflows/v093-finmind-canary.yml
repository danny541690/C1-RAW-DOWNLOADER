name: JARVIS v0.93 FinMind 2024 Canary
on:
  push:
    paths:
      - 'scripts/finmind_canary.py'
      - 'tests/test_finmind_canary.py'
      - '.github/workflows/v093-finmind-canary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: python3 scripts/finmind_canary.py
