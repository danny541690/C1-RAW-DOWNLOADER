name: JARVIS v0.97 - Remaining 39 original content validation
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v097_remaining_39_content_proof.py'
      - '.github/workflows/v097-remaining-39-content-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  content-and-scope-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: SHA, ZIP CRC, JSON schema, HTML table and 39 file scope classification
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          python -m py_compile scripts/v097_remaining_39_content_proof.py
          PYTHONPATH=. python scripts/v097_remaining_39_content_proof.py
