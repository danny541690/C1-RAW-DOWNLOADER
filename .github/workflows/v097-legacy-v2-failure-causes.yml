name: JARVIS v0.97 - Remaining V2 legacy errors diagnosis
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v097_legacy_v2_failure_causes.py'
      - '.github/workflows/v097-legacy-v2-failure-causes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests
      - name: Collect original receipts for remaining TPEx/MOPS legacy format holds
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          python -m py_compile scripts/v097_legacy_v2_failure_causes.py
          PYTHONPATH=. python scripts/v097_legacy_v2_failure_causes.py
