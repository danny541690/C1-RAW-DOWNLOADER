name: JARVIS v097 V3 Seven-Source Pilot, Bronze/Schema Only
on:
  push:
    paths:
      - .github/workflows/v097_v3_pilot.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v097-v3-pilot-single-round
  cancel-in-progress: false
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Safety gates
        run: |
          set -euo pipefail
          python -m py_compile scripts/v097_v3_source_worker.py scripts/v097_v3_preflight.py
          PYTHONPATH=. python scripts/v097_v3_source_worker.py selftest
          PYTHONPATH=. python scripts/v097_v3_preflight.py selftest
  source-pilot:
    needs: safety
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {source: TWSE, shard: 0}
          - {source: TWSE, shard: 1}
          - {source: TPEx, shard: 0}
          - {source: TPEx, shard: 1}
          - {source: MOPS, shard: 0}
          - {source: TDCC, shard: 0}
          - {source: TDCC, shard: 1}
          - {source: TDCC, shard: 2}
          - {source: TAIFEX, shard: 0}
          - {source: NDC, shard: 0}
          - {source: FinMind, shard: 0}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Drive client for isolated V3 checkpoint and immutable QA delta
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: Run small real source sample without Bronze mutation or Silver/Gold conversion
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          V3_BATCH: '2'
        run: PYTHONPATH=. python scripts/v097_v3_source_worker.py '${{ matrix.source }}' '${{ matrix.shard }}'
  reconcile:
    needs: [safety, source-pilot]
    if: always() && needs.safety.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: Produce new V3 pilot Master and Error Ledger even after partial source failures
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: PYTHONPATH=. python scripts/v097_v3_source_worker.py final
