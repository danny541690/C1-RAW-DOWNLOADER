name: JARVIS v0.98 R13 Final Combined Pre-Migration Small Tests
# All read-only. No Drive writes, no Bronze transfer and no Silver/Gold work.
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/v098_r13_final_preflight.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: jarvis-v098-r13-one-master
  cancel-in-progress: false
jobs:
  combined-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install client for complete Drive pagination regression
        run: python -m pip install --disable-pip-version-check 'google-api-python-client>=2.140,<3'
      - name: Central dispatch, six ledgers, exact event times and duplicate protection
        run: python scripts/v098_r8_seven_ledger_contract.py selftest --report r13_gate/r8.json
      - name: Lease takeover, stale fencing, sequential persistence and single writer
        run: python scripts/v098_r9_ledger_fault_injection.py --out r13_gate/r9.json
      - name: SHA256, ZIP CRC, dataset validity, paged directory regression
        run: python scripts/v098_r12_preflight_integration.py test --out r13_gate/r12.json
      - name: Restore synthetic checkpoint from R12 independent GitHub Run
        uses: actions/download-artifact@v4
        with:
          name: r12-synthetic-ledger-snapshot
          repository: danny541690/C1-RAW-DOWNLOADER
          run-id: 44674769210
          github-token: ${{ github.token }}
          path: r13_prior_snapshot/
      - name: Cross-independent GitHub Run checkpoint validation (not CAS)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/v098_r13_final_preflight.py --mode cross-run --snapshot r13_prior_snapshot/state.sqlite --out r13_gate/cross_run.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r13-combined-logic-and-cross-run
          path: r13_gate/
          if-no-files-found: warn
  source-byte-samples:
    needs: combined-regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        source: [TWSE, TPEx, MOPS, NDC, TDCC, TAIFEX]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only Drive client
        run: python -m pip install --disable-pip-version-check 'google-api-python-client>=2.140,<3' 'google-auth>=2.30,<3' 'google-auth-oauthlib>=1.2,<2'
      - name: Read a max-4-MB official source sample and compare Drive MD5
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python scripts/v098_r13_final_preflight.py --mode sample --source "${{ matrix.source }}" --out r13_samples/${{ matrix.source }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r13-sample-${{ matrix.source }}
          path: r13_samples/
          if-no-files-found: warn
  central-reconciliation:
    needs: [combined-regression, source-byte-samples]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: r13-sample-*
          path: r13_samples/
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: r13-combined-logic-and-cross-run
          path: r13_gate/
      - name: Verify six receipts and maintain fail-closed migration gate
        run: |
          python - <<'PY'
          import json,pathlib,sys
          files=list(pathlib.Path('r13_samples').glob('*.json'))
          rows=[json.loads(p.read_text()) for p in files]
          expected={'TWSE','TPEx','MOPS','NDC','TDCC','TAIFEX'}
          if len(rows)!=6 or {r.get('source') for r in rows}!=expected:sys.exit('Source receipt mismatch')
          if any(r.get('status') in ('SCAN_ERROR','SAMPLE_INTEGRITY_HOLD') for r in rows):sys.exit('Real sample integrity error')
          for name in ('r8','r9','r12','cross_run'):
            f=pathlib.Path('r13_gate')/(name+'.json')
            if json.loads(f.read_text())['status']!='PASS':sys.exit('Upstream gate failed: '+name)
          result={'status':'PASS_SMALL_TESTS','source_count':6,
                  'sampled_sources':sum(r.get('sample_count',0)>0 for r in rows),
                  'files_content_verified':sum(r.get('md5_match_count',0) for r in rows),
                  'remaining_hold_sources':[r['source'] for r in rows if r.get('sample_count',0)==0],
                  'cross_github_run_checkpoint':'PASS_ARTIFACT_RESTORE_ONLY',
                  'cross_run_transactional_CAS':False,
                  'complete_2000_to_2026_inventory':False,
                  'dataset_expected_coverage_certified':False,
                  'source_to_target_sha256_certified':False,
                  'production_bulk_migration_allowed':False,
                  'results':rows}
          pathlib.Path('r13_final').mkdir(exist_ok=True)
          pathlib.Path('r13_final/summary.json').write_text(json.dumps(result,indent=2))
          print(json.dumps({k:v for k,v in result.items() if k!='results'}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r13-final-pre-migration-small-test-report
          path: r13_final/
          if-no-files-found: warn
