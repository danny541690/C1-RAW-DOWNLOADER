name: Pause legacy official schedules 1 through 4
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pause-legacy-four-20261024.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  pause:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Disable only legacy schedules and stop their active runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json,time,urllib.request,urllib.error
          base='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          targets={'v093-official-only-two-ended.yml','v093-official-only-repair.yml'}
          def api(path,method='GET'):
              req=urllib.request.Request(base+path,method=method,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  b=r.read();return json.loads(b) if b else {}
          for name in sorted(targets):
              api('/actions/workflows/'+name+'/disable','PUT')
              print('DISABLED',name,flush=True)
          active=[]
          for name in sorted(targets):
              for page in range(1,6):
                  rows=api('/actions/workflows/'+name+'/runs?per_page=100&page='+str(page))['workflow_runs']
                  active += [r['id'] for r in rows if r['status']!='completed']
                  if len(rows)<100:break
          active=sorted(set(active))
          for rid in active:
              try:api('/actions/runs/'+str(rid)+'/cancel','POST')
              except urllib.error.HTTPError as e:
                  if e.code not in (409,422):raise
          deadline=time.monotonic()+240;force_at=time.monotonic()+45;forced=False
          while active:
              active=[rid for rid in active if api('/actions/runs/'+str(rid))['status']!='completed']
              if active and not forced and time.monotonic()>force_at:
                  for rid in active:
                      try:api('/actions/runs/'+str(rid)+'/force-cancel','POST')
                      except urllib.error.HTTPError as e:
                          if e.code not in (409,422):raise
                  forced=True
              if active and time.monotonic()>deadline:raise RuntimeError('ACTIVE_LEGACY_RUNS_REMAIN:'+str(active))
              if active:time.sleep(5)
          for name in sorted(targets):
              state=api('/actions/workflows/'+name)['state']
              assert state=='disabled_manually',(name,state)
              print('CONFIRMED_DISABLED_AND_NO_ACTIVE_RUNS',name,flush=True)
          print('RAW_AND_CHECKPOINTS_PRESERVED; SCHEDULES_5_6_7_UNCHANGED',flush=True)
          PY
