name: JARVIS v0.97 - V5 TDCC identity fast QA combined
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v097-v5-tdcc-fast-qa.yml'
      - 'scripts/v097_tdcc_v5_fast_diagnosis.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v097-v5-tdcc-fast-qa
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'danny541690/C1-RAW-DOWNLOADER'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests
      - run: |
          python -m py_compile scripts/v097_tdcc_v5_fast_diagnosis.py
          PYTHONPATH=. python scripts/v097_tdcc_v5_fast_diagnosis.py
  six-lane-source-diagnosis:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        lane: [0,1,2,3,4,5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests
      - name: Fast checkpoint triage plus bounded live TDCC HTML tests
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          V5_MODE: lane
          V5_LANE: ${{ matrix.lane }}
          V5_SAMPLE_PER_LANE: '6'
        run: PYTHONPATH=. python scripts/v097_tdcc_v5_fast_diagnosis.py
  aggregate:
    needs: six-lane-source-diagnosis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests
      - name: Consolidate fast identity QA evidence without claiming market eligibility
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          V5_MODE: aggregate
        run: PYTHONPATH=. python scripts/v097_tdcc_v5_fast_diagnosis.py
