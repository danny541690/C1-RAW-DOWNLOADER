name: JARVIS v0.97 - TDCC 5035 full code census official date comparison
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v097_tdcc_full_code_census.py'
      - '.github/workflows/v097-tdcc-5035-code-census.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - run: |
          python -m py_compile scripts/v097_tdcc_full_code_census.py
          PYTHONPATH=. python scripts/v097_tdcc_full_code_census.py
  compare:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: Match all 5035 original security code/date forms, query official historic date for spot checks
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          TDCC_5035_MODE: census
        run: PYTHONPATH=. python scripts/v097_tdcc_full_code_census.py
