name: JARVIS stop legacy schedules for official-only first pass
on:
  push:
    paths:
      - '.github/workflows/v093-live-resume-watchdog.yml'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
concurrency:
  group: jarvis-v093-resume-watchdog
  cancel-in-progress: false
jobs:
  stop-legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Disable old workflows and stop their active runs without deleting data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request,urllib.error
          base='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          current=int(os.environ['GITHUB_RUN_ID'])
          def api(path,method='GET',body=None):
              req=urllib.request.Request(base+path,method=method,data=json.dumps(body).encode() if body is not None else None,
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  raw=r.read();return json.loads(raw) if raw else {}
          for w in api('/actions/workflows?per_page=100')['workflows']:
              if w['path']=='.github/workflows/v093-live-resume-watchdog.yml':continue
              if w['state']=='active':
                  api('/actions/workflows/'+str(w['id'])+'/disable','PUT')
                  print('DISABLED',w['path'],flush=True)
          active=[]
          for page in range(1,5):
              runs=api('/actions/runs?per_page=100&page='+str(page))['workflow_runs']
              active += [r['id'] for r in runs if r['id']!=current and r['status']!='completed']
              if len(runs)<100:break
          for rid in active:
              try:api('/actions/runs/'+str(rid)+'/cancel','POST')
              except urllib.error.HTTPError as e:
                  if e.code!=409:raise
          deadline=time.monotonic()+300
          while active:
              active=[rid for rid in active if api('/actions/runs/'+str(rid))['status']!='completed']
              if active and time.monotonic()>deadline:raise RuntimeError('LEGACY_RUNS_NOT_TERMINAL')
              if active:time.sleep(5)
          print('ALL_LEGACY_SCHEDULES_STOPPED_CHECKPOINTS_PRESERVED',flush=True)
          PY
