name: JARVIS v0.95 R11 Twelve-Risk Architecture Improvement Gate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v095-r11-architecture-improvement-pilot-gate.yml'
      - 'config/v095_r11_improvement_and_pilot_plan.json'
      - 'scripts/v095_r11_plan_contract_gate.py'
      - 'tests/test_v095_r11_plan_contract_gate.py'
permissions:
  contents: read
concurrency:
  group: jarvis-v095-r11-architecture-pilot-gate
  cancel-in-progress: false
jobs:
  static-contract-and-fault-injection:
    if: github.repository == 'danny541690/C1-RAW-DOWNLOADER'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile code and run 8 policy fault-injection regressions
        run: |
          python -m py_compile scripts/v095_r11_plan_contract_gate.py tests/test_v095_r11_plan_contract_gate.py
          python -m unittest discover -s tests -p 'test_v095_r11_plan_contract_gate.py' -v
      - name: R11 12-risk and staged tiny-pilot specification acceptance
        run: python scripts/v095_r11_plan_contract_gate.py
      - name: Retain immutable small-pilot readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v095-r11-12-risk-small-pilot-contract-${{ github.run_id }}
          path: r11_pilot_contract/
          retention-days: 90
          if-no-files-found: warn
