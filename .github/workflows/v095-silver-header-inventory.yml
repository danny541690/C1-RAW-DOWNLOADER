name: JARVIS 2026-09 Silver official native header inventory
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v095-silver-header-inventory.yml'
      - 'scripts/v095_202609_silver_native_header_inventory.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        market: [TWSE, TPEx]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pyarrow google-api-python-client google-auth google-auth-httplib2
      - name: Read actual candidate source native schemas
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python scripts/v095_202609_silver_native_header_inventory.py --market ${{ matrix.market }}
