name: JARVIS v0.97 - Independent TDCC all 5035 cross-reference
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v097_tdcc_5035_all_mirror_crosscheck.py'
      - '.github/workflows/v097-tdcc-5035-all-mirror-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cross-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests
      - name: All 5035 TDCC A4 holders/shares/SHA receipts against same-date public archival CSV, preserve exact exceptions
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          python -m py_compile scripts/v097_tdcc_5035_all_mirror_crosscheck.py
          PYTHONPATH=. python scripts/v097_tdcc_5035_all_mirror_crosscheck.py
