name: JARVIS v0.95 2026 TWSE independent Bronze and downstream gate
# SOURCE ONLY: only Bronze and checkpoint. Independent Silver/Gold has its own writer.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v095-2026-source-twse.yml'
      - 'governance/v095/CASH_MARKET_CALENDAR_2026.csv'
      - 'scripts/v095_2026_cash_market_calendar.py'
  schedule:
    - cron: '4,19,34,49 * * * *'
permissions:
  contents: read
concurrency:
  group: jarvis-v095-2026-source-twse-single-writer
  cancel-in-progress: false
jobs:
  source-twse:
    if: github.repository == 'danny541690/C1-RAW-DOWNLOADER'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      V095_PRICE_SOURCE: 'TWSE'
      V095_2026_BATCH_DAYS: '10'
      V095_BRONZE_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: G0 preflight 2000-2026 source-specific dates and publication rules
        run: |
          python -m unittest discover -s tests -p 'test_v095_market_release_calendar_2000_2026.py' -v
          python - <<'PY'
          from scripts.v095_market_release_calendar_2000_2026 import contracts,market_day
          contracts()
          state,_=market_day('2026-01-02','TWSE')
          print('SOURCE_G0_MARKET_STATE:',state)
          PY
      - name: Install exact common Drive, Arrow and source adapter dependencies once
        run: python -m pip install --disable-pip-version-check pyarrow google-api-python-client google-auth google-auth-httplib2
      - name: Check non-release gates and compile source-specific adapters
        run: |
          python - <<'PY'
          import json
          x=json.load(open('governance/v095/PHASE1_FLAGS.json'))
          assert x['BULK_COPY_APPROVED'] is False and x['RELEASE_APPROVED'] is False
          print('V095_SOURCE_ISOLATED_CANDIDATE_ONLY')
          PY
          python -m py_compile scripts/v095_2026_price_incremental.py scripts/v095_2026_legacy_first.py scripts/v095_2026_equity_downstream.py
      - name: Preflight 2026 official cash-market calendar before any source requests
        run: |
          python -m unittest discover -s tests -p 'test_v095_2026_cash_market_calendar.py' -v
          python -m scripts.v095_2026_cash_market_calendar v095_market_calendar_2026/calendar_audit.json
      - name: Bronze-only verified reuse and official checkpoint
        run: python -m scripts.v095_2026_price_incremental
      - name: Archive actual run result to Drive SHA ledger
        if: always()
        env:
          V095_RECEIPT_LANE: 'BRONZE'
        run: python -u -m scripts.v095_2026_publish_run_receipt
      - name: Preserve full per-partition actual results, exceptions and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v095-2026-twse-source-${{ github.run_id }}
          path: |
            v095_2026_price_incremental/result.json
            v095_market_calendar_2026/calendar_audit.json
          if-no-files-found: warn
          retention-days: 90
