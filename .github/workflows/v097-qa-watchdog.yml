name: JARVIS v0.97 - A and B Schedule Recovery Watchdog
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v097-qa-watchdog.yml'
      - 'scripts/v097_qa_watchdog.py'
  workflow_dispatch:
  schedule:
    - cron: '19 * * * *'
permissions:
  actions: write
  contents: read
concurrency:
  group: v097-qa-watchdog
  cancel-in-progress: false
jobs:
  check-and-recover:
    if: github.repository == 'danny541690/C1-RAW-DOWNLOADER'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate watchdog syntax
        run: python -m py_compile scripts/v097_qa_watchdog.py
      - name: Hourly failure-only fallback; long-running A/B self-dispatch without waiting
        env:
          GH_TOKEN: ${{ github.token }}
          AB_STALE_MINUTES: '30'
          AB_STUCK_MINUTES: '120'
        run: python scripts/v097_qa_watchdog.py
