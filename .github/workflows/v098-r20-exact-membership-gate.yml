name: JARVIS v0.98 R20 Exact Frozen Membership and Pre-Bulk Gate
# Read-only cross-ledger join. No source or Bronze mutations, no Silver/Gold.
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/v098_r20_exact_population_join.py'
permissions:
  contents: read
concurrency:
  group: jarvis-v098-r20-single-control
  cancel-in-progress: false
jobs:
  exact-frozen-cohort-join:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Drive source-read dependencies
        run: python -m pip install --disable-pip-version-check 'google-api-python-client>=2.140,<3' 'google-auth>=2.30,<3' 'google-auth-oauthlib>=1.2,<2'
      - name: Read 12 v0.97 frozen lane manifests and 162 v0.98 private manifests; join by Drive File ID
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python scripts/v098_r20_exact_population_join.py --out r20_result/exact_join.json
      - name: Fail closed on incomplete or inconsistent membership
        run: |
          python - <<'PY'
          import json
          r=json.load(open('r20_result/exact_join.json'))
          assert r['status']=='PASS_EXACT_FILE_ID_JOIN_WITH_REMAINING_CONTRACT_HOLDS'
          assert r['v097_total']==74750 and r['v098_total']==78281
          assert r['matched']+r['legacy_official_not_in_new']==71050
          assert r['matched']+r['new_official_not_in_legacy']==78281
          assert r['official_count_delta']==7231
          assert r['bulk_migration_allowed'] is False
          print('EXACT_FILE_ID_JOIN_PASS; BULK_MIGRATION_REMAINS_BLOCKED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r20-exact-frozen-membership-join
          path: r20_result/
          if-no-files-found: warn
