name: JARVIS v097 G2G3 Three-Day Regression and G3 Evidence Diagnosis
on:
  push:
    paths:
      - .github/workflows/v097_g2g3_3day_regression.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and test source/era/contract, transient retry and native records
        run: |
          set -euo pipefail
          python -m py_compile scripts/v097_v3_source_worker.py scripts/v097_v3_unified_master.py scripts/v097_g2g3_contract_discovery.py scripts/v097_g2g3_candidate_reconcile_diag.py
          PYTHONPATH=. python scripts/v097_v3_source_worker.py selftest
          PYTHONPATH=. python scripts/v097_g2g3_contract_discovery.py selftest
          PYTHONPATH=. python scripts/v097_g2g3_full_native_validation.py selftest
          PYTHONPATH=. python scripts/v097_g2g3_tdcc_native_html.py selftest
          PYTHONPATH=. python scripts/v097_v3_unified_master.py selftest
          PYTHONPATH=. python scripts/v097_g2g3_formal_contracts_v2.py selftest
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: Cross-check true per-source G3 full native candidates vs sole Unified Master
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: PYTHONPATH=. python scripts/v097_g2g3_candidate_reconcile_diag.py
