name: JARVIS R3 NDC final native null G2 certification 320 of 320
on:
  push:
    branches: [r3-bronze-silver-ready-staging-20261118]
    paths: ['.github/workflows/v097_r3_ndc_last_missing_marker.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jarvis-r3-ndc-source-missing-marker-proof
  cancel-in-progress: false
jobs:
  prove-native-ellipsis-and-issue-g2:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: Native '…' source markers match original Excel and eight Gaps entries
        run: |
          python -m py_compile scripts/v097_r3_ndc_last_missing_marker_cert.py
          PYTHONPATH=. python scripts/v097_r3_ndc_last_missing_marker_cert.py
      - if: always()
        run: echo 'Literal source missing markers remain missing values; no zero imputation, no earlier-date PIT assertions and no Bronze/Silver/Gold mutations.' >> "$GITHUB_STEP_SUMMARY"
