name: JARVIS R3 G2 FOUR SOURCE REAL FIRST FORMAL NATIVE CERT TEST
# Rerun after ensuring immutable JSON Master list serialization is canonical.
on:
  push:
    branches: [r3-bronze-silver-ready-staging-20261118]
    paths: ['.github/workflows/v097_r3_g2_four_source_first_cert.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jarvis-r3-four-first-official-source-cert-attempt
  cancel-in-progress: false
jobs:
  four-real-frozen-native-official-g2:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: Verify 40 real frozen native files against official format documents and write source-by-source immutable QA
        run: |
          set -euo pipefail
          python -m py_compile scripts/v097_r3_g2_four_source_first_cert_gate.py
          PYTHONPATH=. python scripts/v097_r3_g2_four_source_first_cert_gate.py
      - if: always()
        run: |
          echo 'Official format & original file candidate review is not independent original API byte identity.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Missing original source, historical security ID or API as-of must HOLD, never false-PASS.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Bronze read-only; preserve 322 existing G2 proofs, no Silver or Gold.' >> "$GITHUB_STEP_SUMMARY"
