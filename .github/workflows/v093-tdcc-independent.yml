name: JARVIS independent TDCC download 5
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v093-tdcc-independent.yml'
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jarvis-independent-tdcc-stage05
  cancel-in-progress: false
jobs:
  download:
    name: Independent TDCC latest to oldest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-qa.lock
      - run: pip install -r requirements-qa.lock
      - run: python -m unittest tests.test_tdcc_history_repair -q
      - name: Download TDCC only; resume verified immutable receipts
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python -m scripts.v093_tdcc_independent --minutes 45
