name: JARVIS R3 G2-G3-G4 REAL EVIDENCE REPAIR 70-700-1000
on:
  push:
    branches:
      - r3-bronze-silver-ready-staging-20261118
    paths:
      - '.github/workflows/v097_r3_g234_real_repair.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jarvis-r3-g234-repair-isolated-single-writer
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and prove fail-closed contract logic
        run: |
          set -euo pipefail
          python -m py_compile scripts/v097_r3_g234_repair_worker.py scripts/v097_r3_formal_release_contracts.py
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_v097_r3_formal_release_contracts.py' -v
  real-repair:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing Drive connector
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: 70 actual frozen records, 10 for each source, and immutable Drive receipt readback
        run: PYTHONPATH=. python scripts/v097_r3_g234_repair_worker.py run 70
      - name: Expand to 700 actual frozen records with source-independent HOLD logs
        run: PYTHONPATH=. python scripts/v097_r3_g234_repair_worker.py run 700
      - name: Expand to 1000 actual frozen records with one real evidence audit record each
        run: PYTHONPATH=. python scripts/v097_r3_g234_repair_worker.py run 1000
      - name: Explain evidence fidelity
        if: always()
        run: |
          echo 'All records checked against existing REAL Drive registries; unapproved official templates remain HOLD.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Private 70/700/1000 receipt files in R3_G234_FORMAL_REPAIR_ISOLATED, each independently read back.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This stage does not infer or fabricate official attestation; does not update R1/V3 Master or certify Silver Ready.' >> "$GITHUB_STEP_SUMMARY"
