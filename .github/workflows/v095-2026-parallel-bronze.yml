name: JARVIS v0.95 2026 parallel Bronze source lanes
# v0.93 native validated first -> primary official source -> failed-unit record.
# FinMind is NOT silently substituted; unavailable data are isolated for later gap pass.
on:
  workflow_dispatch:
  # Retired from push; separate source workflows own automated scheduling.
  # Replaced by six independent source workflows. Manual replay only.
permissions:
  contents: read
concurrency:
  group: jarvis-v095-2026-parallel-bronze-writer
  cancel-in-progress: false
jobs:
  real-2026-official-bronze-lanes:
    if: github.repository == 'danny541690/C1-RAW-DOWNLOADER'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        source: [TWSE, TPEx]
    timeout-minutes: 35
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      V095_PRICE_SOURCE: ${{ matrix.source }}
      V095_2026_BATCH_DAYS: '10'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official source and Drive packages
        run: python -m pip install --disable-pip-version-check pyarrow google-api-python-client google-auth google-auth-httplib2
      - name: Compile and enforce candidate-only quality/release gates
        run: |
          python -m py_compile scripts/v095_2026_price_incremental.py scripts/v095_2026_legacy_first.py
          python - <<'PY'
          import json
          f=json.load(open('governance/v095/PHASE1_FLAGS.json'))
          assert f['BULK_COPY_APPROVED'] is False and f['RELEASE_APPROVED'] is False
          print('V095_SOURCE_LANE_V093_FIRST_OFFICIAL_SECOND_FINMIND_GAP_ONLY')
          PY
      - name: Execute resumable source-day native ZIP reuse, official fallback and BSG staging
        run: python -m scripts.v095_2026_price_incremental
      - name: Preserve actual source status and failure receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v095-2026-bronze-${{ matrix.source }}-${{ github.run_id }}
          path: v095_2026_price_incremental/result.json
          retention-days: 90
          if-no-files-found: warn
