name: JARVIS v0.97 TDCC TAIFEX canonical diagnostic and exact-date audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v097_exact_date_g2_backcheck.yml'
      - 'scripts/v097_two_source_exact_date_backcheck.py'
  workflow_dispatch:
  schedule:
    - cron: '13 * * * *'
permissions:
  contents: read
concurrency:
  group: jarvis-v097-exact-date-g2-canonical
  cancel-in-progress: false
jobs:
  test_and_compare:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        source: [TDCC, TAIFEX]
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimum source QA dependencies
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: Verify runtime imports and strict selftests
        id: selftest
        shell: bash
        run: |
          set -o pipefail
          python -m py_compile scripts/v097_two_source_exact_date_backcheck.py scripts/v097_two_source_native_date_diff.py scripts/v097_two_source_pilot_g2.py
          PYTHONPATH=. python scripts/v097_two_source_exact_date_backcheck.py selftest 2>&1 | tee selftest_${{ matrix.source }}.log
          PYTHONPATH=. python scripts/v097_two_source_native_date_diff.py selftest 2>&1 | tee -a selftest_${{ matrix.source }}.log
          PYTHONPATH=. python scripts/v097_two_source_pilot_g2.py selftest 2>&1 | tee -a selftest_${{ matrix.source }}.log
      - name: Diagnose Drive authorization and original source exact-date comparison
        id: compare
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python scripts/v097_two_source_exact_date_backcheck.py source "${{ matrix.source }}" 2>&1 | tee compare_${{ matrix.source }}.log
      - name: Write visible report even when Drive authentication or comparisons failed
        if: always()
        shell: bash
        run: |
          {
            echo "## JARVIS v0.97 ${{ matrix.source }} exact-date diagnostics"
            echo "Run ID: ${{ github.run_id }}"
            echo "Commit: ${{ github.sha }}"
            echo "Selftest: ${{ steps.selftest.outcome }}"
            echo "Bronze/source compare: ${{ steps.compare.outcome }}"
            echo "If comparison failed, see compare_${{ matrix.source }}.log in the uploaded artifact and Actions logs."
            echo "No official G2 PASS or Silver/Gold authorized from this job."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v097-g2-${{ matrix.source }}-diagnostics-${{ github.run_id }}
          path: |
            selftest_${{ matrix.source }}.log
            compare_${{ matrix.source }}.log
          if-no-files-found: warn
          retention-days: 14
