name: JARVIS v097 Silver READY Evidence Pilot (NDC)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/v097_ap_silver_ready_pilot.yml'
permissions:
  contents: read
concurrency:
  group: v097-ap-silver-ready-ndc-pilot
  cancel-in-progress: false
jobs:
  release-gate-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests
      - name: Verify release rule and downstream manifest gates
        run: |
          PYTHONPATH=. python scripts/v097_ap_silver_input_gate.py selftest
          PYTHONPATH=. python scripts/v097_ap_publish_artifacts.py selftest
      - name: Issue evidence backed NDC Silver input attestations
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: PYTHONPATH=. python scripts/v097_ap_silver_input_gate.py
      - name: Build auditable seven-source disposition ledger and Silver READY manifest
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: PYTHONPATH=. python scripts/v097_ap_publish_artifacts.py
