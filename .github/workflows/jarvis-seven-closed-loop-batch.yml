name: JARVIS bounded real closed-loop combined batch
on:
  push:
    branches: [codex/seven-source-closed-loop-design-20261029]
    paths: [.github/workflows/jarvis-seven-closed-loop-batch.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: jarvis-real-closed-loop-qa
  cancel-in-progress: false
jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-qa.lock
      - name: Restore immutable original and reviewed ledgers
        run: |
          mkdir original frozen
          git fetch --depth=1 origin refs/heads/jarvis-handoff-import/20261029-40806985547:refs/remotes/origin/original
          git archive refs/remotes/origin/original | tar -x -C original
          git fetch --depth=1 origin refs/heads/jarvis-handoff-replay/20261029-40812627597:refs/remotes/origin/frozen
          git archive refs/remotes/origin/frozen | tar -x -C frozen
      - name: Real native download and crash after isolated Drive save
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python -m scripts.v093_closed_loop_live_batch start --namespace combined-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: closed-loop-start
          path: results
          retention-days: 90
  resume:
    needs: start
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-qa.lock
      - uses: actions/download-artifact@v4
        with:
          name: closed-loop-start
          path: expected
      - name: Recover actual saved RAW and revalidate in a fresh runner
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python -m scripts.v093_closed_loop_live_batch resume --namespace combined-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: closed-loop-resume
          path: results
          retention-days: 90
