name: JARVIS v0.95 targeted NDC and FinMind data contract recheck (isolated)
on:
  push:
    branches: [test/jarvis-v095-one-shot-fast-20261105]
    paths:
      - .github/workflows/v095-targeted-recheck.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jarvis-v095-targeted-recheck
  cancel-in-progress: false
jobs:
  validate:
    name: Historical source numeric data / ${{ matrix.source }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        source: [NDC, FinMind]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/jarvis-v095-one-shot-fast-20261105
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth-httplib2 google-auth-oauthlib
      - name: Verify actual archived Excel or JSON raw numeric rows and SHA
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: PYTHONPATH=. python tests/v095_seven_numeric_provenance_qa.py --source "${{ matrix.source }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v095-targeted-${{ matrix.source }}-${{ github.run_id }}
          path: v095_content_qa/${{ matrix.source }}/report.json
          retention-days: 14
