name: C1 v0.93 Cross Asset 72 September Pilot
on:
  push:
    paths:
      - '.github/workflows/v093-cross-asset-72-sep-pilot.yml'
  workflow_dispatch:
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-api-python-client google-auth google-auth-httplib2
      - name: Capture 72 candidates to isolated Drive staging folder
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python -u -m scripts.cross_asset_72_pilot
