name: JARVIS TPEx monthly historical HTML row probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v095-tpex-monthly-row-probe.yml'
permissions:
  contents: read
jobs:
  parse-official-historical-index-tables:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect official monthly index rows 2000 2010 2026
        run: |
          python - <<'PY'
          import re,urllib.request,urllib.parse
          from html.parser import HTMLParser
          class H(HTMLParser):
            def __init__(self):super().__init__();self.rows=[];self.row=None;self.cell=None
            def handle_starttag(self,t,a):
              if t=='tr':self.row=[]
              if t in ('td','th') and self.row is not None:self.cell=[]
            def handle_data(self,s):
              if self.cell is not None:self.cell.append(s)
            def handle_endtag(self,t):
              if t in ('td','th') and self.cell is not None:self.row.append(''.join(self.cell).strip());self.cell=None
              if t=='tr' and self.row is not None:
                if self.row:self.rows.append(self.row)
                self.row=None
          for year in (2000,2010,2026):
            month=f"{year-1911}/01"
            base="https://www.tpex.org.tw/web/stock/aftertrading/daily_trading_index/st41_result.php"
            url=base+'?'+urllib.parse.urlencode({'l':'zh-tw','d':month,'s':'0,asc,0','o':'htm'})
            with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=18) as r:raw=r.read(400000)
            parser=H();parser.feed(raw.decode('utf-8','replace'))
            print('YEAR',year,'BYTES',len(raw),'ROWS',len(parser.rows),'SAMPLE',repr(parser.rows[:13])[:1700])
          PY
