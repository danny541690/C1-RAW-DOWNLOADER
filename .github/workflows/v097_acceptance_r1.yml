name: JARVIS v0.97 R1 G0-G4 continuous acceptance
# 2026-11-20 v0.98 preflight freeze: automated triggers disabled, preserve manual only.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write
concurrency:
  group: jarvis-v097-r1-acceptance-single-writer
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Google Drive client before all regression imports
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: R1 complete gate and official-format regression tests
        run: |
          set -euo pipefail
          python -m py_compile scripts/v097_acceptance_engine_r1.py
          PYTHONPATH=. python scripts/v097_seven_source_release_standard_v2.py selftest
          PYTHONPATH=. python scripts/v097_acceptance_engine_r1.py selftest
          PYTHONPATH=. python scripts/v097_seven_historical_format_registry.py selftest
          PYTHONPATH=. python scripts/v097_schema_gate_v21.py selftest
          PYTHONPATH=. python scripts/v097_v3_contract_registry.py selftest
          PYTHONPATH=. python scripts/v097_v3_source_worker.py selftest
          PYTHONPATH=. python scripts/v097_v3_unified_master.py selftest
          PYTHONPATH=. python scripts/v097_g2g3_formal_contracts_v2.py selftest
          PYTHONPATH=. python scripts/v097_g2g3_formal_contract_publisher.py selftest
          PYTHONPATH=. python scripts/v097_g2g3_full_native_validation.py selftest
          PYTHONPATH=. python scripts/v097_g2g3_tdcc_native_html.py selftest
          PYTHONPATH=. python scripts/v097_g2g3_typed_contract_audit.py selftest
          PYTHONPATH=. python scripts/v097_g2g3_contract_discovery.py selftest
      - name: Check Google OAuth and Drive read authorization (fail closed)
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: PYTHONPATH=. python scripts/v097_acceptance_engine_r1.py preflight
  gate:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix:
        include:
          - {source: TWSE, shard: 0}
          - {source: TWSE, shard: 1}
          - {source: TPEx, shard: 0}
          - {source: TPEx, shard: 1}
          - {source: MOPS, shard: 0}
          - {source: TDCC, shard: 0}
          - {source: TDCC, shard: 1}
          - {source: TDCC, shard: 2}
          - {source: TDCC, shard: 3}
          - {source: TDCC, shard: 4}
          - {source: TDCC, shard: 5}
          - {source: TAIFEX, shard: 0}
          - {source: NDC, shard: 0}
          - {source: FinMind, shard: 0}
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      R1_BATCH: '200'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Drive client
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: Evaluate source G0-G4; preserve original Bronze
        run: PYTHONPATH=. python scripts/v097_acceptance_engine_r1.py "${{ matrix.source }}" "${{ matrix.shard }}"
  reconcile:
    needs: [preflight, gate]
    if: ${{ always() && needs.preflight.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Drive client
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: Reconcile seven-source 74750 cohort and publish R1 Master
        run: PYTHONPATH=. python scripts/v097_acceptance_engine_r1.py aggregate
      - name: Publish source execution summary
        if: ${{ always() }}
        run: |
          echo "## JARVIS R1 Run ${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "G0-G4 workers: ${{ needs.gate.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Unattested G2/G3 remain PENDING; Bronze read-only; Silver/Gold disabled." >> "$GITHUB_STEP_SUMMARY"
  status:
    needs: [preflight, gate, reconcile]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify whole run and print actionable status
        run: |
          echo "Preflight: ${{ needs.preflight.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Gate: ${{ needs.gate.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Reconcile: ${{ needs.reconcile.result }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ needs.preflight.result }}" != "success" ] || [ "${{ needs.gate.result }}" != "success" ] || [ "${{ needs.reconcile.result }}" != "success" ]; then
            echo "::error::R1 run incomplete: inspect individual gate jobs and repair auth/evidence before certification"
            exit 1
          fi

  continue:
    needs: [status, reconcile]
    if: ${{ needs.status.result == 'success' && needs.reconcile.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Drive API dependencies
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: Decide from checkpoint/master whether another R1 batch is required
        id: state
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: PYTHONPATH=. python scripts/v097_acceptance_engine_r1.py watchdog
      - name: Dispatch the next R1 batch automatically, no user prompt
        if: ${{ steps.state.outputs.continue == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run v097_acceptance_r1.yml --repo "$GH_REPO" --ref main
          echo "NEXT_R1_BATCH_DISPATCHED" >> "$GITHUB_STEP_SUMMARY"
