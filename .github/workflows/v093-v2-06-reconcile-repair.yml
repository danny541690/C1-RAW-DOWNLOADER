name: JARVIS v0.93 LIVE RECONCILE REPAIR
on:
  schedule:
    - cron: '15 * * * *'
  push:
    paths:
      - '.github/workflows/v093-v2-06-reconcile-repair.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: jarvis-v093-live-reconcile-repair
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-qa.lock
      - run: python -m pip install -r requirements-qa.lock
      - name: Validate deployed repair contracts
        run: python -m unittest discover -s tests -q
      - name: Reconcile latest to oldest with persistent cursor
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            python -m scripts.v093_stage06_live --minutes 5 --max-months 1
          else
            python -m scripts.v093_stage06_live --minutes 60
          fi
      - name: Execute approved repairs under the existing PRICE owner pool
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            python -m scripts.v093_stage06_live --owner-price --minutes 6 --cutover-price
          else
            python -m scripts.v093_stage06_live --owner-price --minutes 6
          fi
