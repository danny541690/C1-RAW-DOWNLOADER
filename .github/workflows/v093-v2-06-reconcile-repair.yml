# Continuous rechecks also bound slow ownership reads.
name: JARVIS v0.93 LIVE RECONCILE REPAIR
on:
  schedule:
    - cron: '15 * * * *'
  push:
    paths:
      - '.github/workflows/v093-v2-06-reconcile-repair.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  repair:
    concurrency:
      group: jarvis-v093-live-reconcile-repair
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-qa.lock
      - run: python -m pip install -r requirements-qa.lock
      - name: Validate deployed repair contracts
        run: python -m unittest discover -s tests -q
      - name: Check shared API budget before taking the reconciliation lease
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.v093_github_budget --minimum 250 --max-wait 300
      - name: Reconcile latest to oldest with persistent cursor
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.v093_stage06_live --minutes 60 --continuous --recheck-seconds 300
  financial-repairs:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    concurrency:
      group: jarvis-v093-live-financial
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-qa.lock
      - run: python -m pip install -r requirements-qa.lock
      - name: Check API budget before acquiring the FINANCIAL owner
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.v093_github_budget --minimum 400 --max-wait 300
      - name: Consume approved repairs under the existing FINANCIAL owner pool
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.v093_stage06_live --owner-stage FINANCIAL --minutes 6
