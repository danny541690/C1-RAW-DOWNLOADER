name: JARVIS v0.95 Single-Repo R2 Plan Gate (No Downloads)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/v095_single_repo_fast_backfill_r2.json'
      - 'scripts/v095_single_repo_plan_gate.py'
      - '.github/workflows/v095-single-repo-r2-plan-audit.yml'
permissions:
  contents: read
concurrency:
  group: v095-r2-plan-only
  cancel-in-progress: false
jobs:
  plan-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate single-repo configuration and bulk start lock
        run: python scripts/v095_single_repo_plan_gate.py --out r2_plan_audit/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v095-r2-plan-only-${{ github.run_id }}
          path: r2_plan_audit/
          if-no-files-found: warn
