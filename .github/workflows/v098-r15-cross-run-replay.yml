name: JARVIS v0.98 R15 Cross-Run Sandbox Replay Gate
# Test only. Reads prior sandbox Master and two small copies; no Bronze migration.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jarvis-v098-r15-isolated-single
  cancel-in-progress: false
jobs:
  verify-no-duplicate-across-run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'google-api-python-client>=2.140,<3' 'google-auth>=2.30,<3' 'google-auth-oauthlib>=1.2,<2'
      - name: Read previous synthetic Master (must not create again)
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python scripts/v098_r15_sandbox_gate.py ledger --out r15_replay/ledger.json
      - name: Check two original source copies replay identically
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          python scripts/v098_r15_sandbox_gate.py copy --source TWSE --out r15_replay/TWSE.json
          python scripts/v098_r15_sandbox_gate.py copy --source TPEx --out r15_replay/TPEx.json
      - name: Assert zero second-run writes and unchanged total identities
        run: |
          python - <<'PY'
          import json,pathlib
          ledger=json.loads(pathlib.Path('r15_replay/ledger.json').read_text())
          copies=[json.loads(pathlib.Path('r15_replay/'+s+'.json').read_text()) for s in ['TWSE','TPEx']]
          assert ledger['status']=='PASS_SANDBOX_DRIVE_READBACK'
          assert ledger['new_upload']==0 and ledger['replayed']==1 and ledger['verified']==1
          assert all(x['status']=='PASS_SOURCE_TARGET_SHA256' and x['new_upload']==0
                     and x['replayed']==1 and x['verified']==1 for x in copies)
          result={'status':'PASS_CROSS_RUN_REPLAY','snapshot_reused':1,
                  'real_copy_identities_reused':2,'second_run_new_files':0,
                  'no_duplicate_verified':True,
                  'production_atomic_CAS':False,
                  'production_full_file_manifest':False,
                  'bulk_migration_allowed':False}
          pathlib.Path('r15_replay/summary.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r15-cross-run-no-duplicate-report
          path: r15_replay/
          if-no-files-found: warn
