name: JARVIS v0.93 Real Native Parser Acceptance
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/v093-v2-real-native-parser-acceptance.yml'
      - 'scripts/v093_isolated_real_native_parser_gate.py'
      - 'scripts/v093_standard_r2.py'
      - 'scripts/v093_native_numeric_sanity.py'
      - 'scripts/v093_source_pit_unit_evidence.py'
      - 'tests/test_v093_source_pit_unit_evidence.py'
      - 'scripts/v093_twse_disclosure_pit.py'
      - 'tests/test_v093_twse_disclosure_pit.py'
      - 'tests/test_v093_twse_all_rows_pit.py'
      - 'scripts/v093_cross_source_numeric_audit.py'
      - 'tests/test_v093_cross_source_numeric_audit.py'
      - 'tests/test_v093_native_numeric_sanity.py'
      - 'tests/test_v093_finmind_annual_rows_adapter.py'
      - 'tests/test_v093_mops_html_financial_classification.py'
      - 'tests/test_v093_tpex_ex_dividend_event_dates.py'
      - 'tests/test_v093_historical_date_safety.py'
      - 'scripts/v093_five_stage_combined_contract.py'
      - '.github/workflows/v093-raw-resume.yml'
      - '.github/workflows/v093-2024-four-source-annual-capture.yml'
      - '.github/workflows/v093-layer02-standard-r2.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-qa.lock
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -q
  five-stage-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-qa.lock
      - name: Verify actual five-stage workflow contracts and 322-month scope
        run: python3 -m scripts.v093_five_stage_combined_contract
  real-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        month: ['2014-04','2024-06','2025-01','2026-09']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-qa.lock
      - name: Read-only parse real ZIP contents to native R2 rows
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          MONTH: ${{ matrix.month }}
        run: |
          mkdir -p reports
          python3 - <<'PY'
          import json,os
          from scripts.annual_actual_firstpass import Drive,service
          from scripts.v093_isolated_real_native_parser_gate import run
          month=os.environ['MONTH']
          # Expand real TWSE/TPEx ZIP member inspection, bounded to 30 MB.
          r=run(Drive(service()),month,max_archive=50_000_000,max_member=30_000_000,max_members=60) if month=='2026-09' else run(Drive(service()),month)
          with open('reports/native-parser.json','w') as f:json.dump(r,f,ensure_ascii=False,indent=2)
          print('REAL_NATIVE_PARSER_ACCEPTANCE '+json.dumps(r,ensure_ascii=False,sort_keys=True),flush=True)
          assert r['certified'] is False and r['drive_writes']==0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: native-parser-${{ matrix.month }}
          path: reports/native-parser.json
  summary:
    needs: [regression,real-native,five-stage-contract]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: native-parser-*
          path: parts
      - name: Aggregate parser results and highlight real conversion gaps
        run: |
          python3 - <<'PY'
          import glob,json
          paths=glob.glob('parts/*/native-parser.json')
          assert len(paths)==4,paths
          reports=[json.load(open(p)) for p in paths]
          cells=sum(s['stats'].get('native_cells_staged',0) for r in reports for s in r['sources'].values())
          attempted=sum(s['stats'].get('members_attempted',0) for r in reports for s in r['sources'].values())
          errors=sum(s['stats'].get('parse_errors',0) for r in reports for s in r['sources'].values())
          source_summary={}
          for source in ('TWSE','TPEx','MOPS','FinMind'):
            samples=[r['sources'][source] for r in reports]
            source_summary[source]={
              'members_attempted':sum(s['stats'].get('members_attempted',0) for s in samples),
              'unverified_numeric_cells':sum(s['stats'].get('native_cells_staged',0) for s in samples),
              'parse_errors':sum(s['stats'].get('parse_errors',0) for s in samples),
              'oversize_skipped':sum(s['stats'].get('oversize_skipped',0) for s in samples),
              'zero_cell_members':sum(s['stats'].get('members_without_cells',0) for s in samples)
            }
          missing_archives={r['month']:[src for src,details in r['sources'].items() if details['status']=='NO_BOUNDED_ZIP_SAMPLE'] for r in reports}
          sanity_keys=('invalid_date','invalid_stock_id','nonfinite_numeric','identifier_as_numeric','premature_verification','premature_publication','duplicate_lineage_key')
          sanity={k:sum(s['stats'].get('sanity_'+k,0) for r in reports for s in r['sources'].values()) for k in sanity_keys}
          cross_source={"candidate_keys":sum(r["cross_source_close"]["candidate_keys"] for r in reports),"compared_pairs":sum(sum(r["cross_source_close"]["compared_pairs"].values()) for r in reports),"mismatches":sum(sum(r["cross_source_close"]["mismatch"].values()) for r in reports),"duplicate_conflicts":sum(r["cross_source_close"]["duplicate_conflicts"] for r in reports),"certified":False}
          blockers=[]
          if cross_source["mismatches"] or cross_source["duplicate_conflicts"]:blockers.append("CROSS_SOURCE_NUMERIC_DISAGREEMENT")
          if not cross_source["compared_pairs"]:blockers.append("NO_INDEPENDENT_CROSS_SOURCE_NUMERIC_OVERLAP")
          if any(sanity.values()):blockers.append('NATIVE_SANITY_VIOLATIONS')
          if any(missing_archives.values()):blockers.append('MISSING_OR_OVERSIZE_SOURCE_ARCHIVES')
          if errors:blockers.append('UNRESOLVED_PARSE_ERRORS')
          if any(v['oversize_skipped'] for v in source_summary.values()):blockers.append('UNINSPECTED_LARGE_MEMBERS')
          if any(v['zero_cell_members'] for v in source_summary.values()):blockers.append('UNMAPPED_OR_EMPTY_MEMBERS')
          blockers.extend(['PIT_UNIT_NUMERIC_QA_UNAPPROVED','FIVE_REAL_STAGE_IMPLEMENTATIONS_NOT_CONNECTED'])
          decision={'months':len(reports),'members_attempted':attempted,'native_cells_staged_unverified':cells,'parse_errors':errors,'native_sanity':sanity,'cross_source_close':cross_source,'sources':source_summary,'missing_or_oversize_archives_by_month':missing_archives,'production_writes':0,'certified':False,'release':'BLOCKED','blockers':blockers}
          assert all(not r['certified'] and r['drive_writes']==0 for r in reports)
          assert errors==sum(v['parse_errors'] for v in source_summary.values())
          print('REAL_NATIVE_PARSER_COMBINED_AUDIT '+json.dumps(decision,sort_keys=True),flush=True)
          print('RELEASE_GATE=BLOCKED_NO_CRON_ACTIVATION',flush=True)
          PY
