name: JARVIS v0.95 publish six source DATE progress to Google Drive
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v095-publish-date-progress-drive.yml'
      - 'scripts/v095_publish_date_progress_to_drive.py'
permissions:
  contents: read
concurrency:
  group: jarvis-v095-date-progress-snapshot
  cancel-in-progress: false
jobs:
  publish-date-evidence:
    if: github.repository == 'danny541690/C1-RAW-DOWNLOADER'
    runs-on: ubuntu-latest
    timeout-minutes: 17
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile strict six-source date-progress report
        run: python -m py_compile scripts/v095_publish_date_progress_to_drive.py
      - name: Read latest immutable Drive cursors and archive dated progress sheet with SHA
        run: |
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 pyarrow
          python -u -m scripts.v095_publish_date_progress_to_drive
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v095-date-progress-drive-${{ github.run_id }}
          path: v095_schedule_date_progress/
          retention-days: 90
          if-no-files-found: warn
