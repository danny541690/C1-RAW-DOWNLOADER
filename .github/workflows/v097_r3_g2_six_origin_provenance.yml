name: JARVIS R3 G2 six source real original download provenance census
on:
  push:
    branches: [r3-bronze-silver-ready-staging-20261118]
    paths: ['.github/workflows/v097_r3_g2_six_origin_provenance.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jarvis-r3-six-source-original-60-origin-provenance
  cancel-in-progress: false
jobs:
  source-byte-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: Inspect real immutable archive members for original official source URLs and historical native dataset identity
        run: |
          set -euo pipefail
          python -m py_compile scripts/v097_r3_g2_six_source_original_url_provenance.py
          PYTHONPATH=. python scripts/v097_r3_g2_six_source_original_url_provenance.py
      - if: always()
        run: echo 'Archive manifest provenance only; no formal G2 PASS until official original bytes, native dataset/era and historical date are independently proved. Bronze read-only.' >> "$GITHUB_STEP_SUMMARY"
