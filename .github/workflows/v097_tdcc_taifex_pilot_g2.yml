name: JARVIS v0.97 TDCC TAIFEX pilot-first G2 format QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v097_tdcc_taifex_pilot_g2.yml'
      - 'scripts/v097_two_source_pilot_g2.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jarvis-v097-two-source-g2-format-single-writer
  cancel-in-progress: false
jobs:
  sample_then_batch:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      G2_TWO_SOURCE_BATCH: '50'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QA prerequisites
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4 openpyxl
      - name: Unit tests before Drive reads
        run: |
          set -euo pipefail
          python -m py_compile scripts/v097_two_source_pilot_g2.py
          PYTHONPATH=. python scripts/v097_two_source_pilot_g2.py selftest
          PYTHONPATH=. python scripts/v097_g2g3_tdcc_native_html.py selftest
      - name: TDCC 12-file representative pilot
        id: tdcc
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/v097_two_source_pilot_g2.py pilot TDCC | tee tdcc_pilot.log
          if grep -q '"allow_incremental_format_batch":true' tdcc_pilot.log; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi
      - name: TAIFEX 12-file representative pilot
        id: taifex
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/v097_two_source_pilot_g2.py pilot TAIFEX | tee taifex_pilot.log
          if grep -q '"allow_incremental_format_batch":true' taifex_pilot.log; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Gated TDCC incremental native-format batch
        if: steps.tdcc.outputs.ready == 'true'
        run: PYTHONPATH=. python scripts/v097_two_source_pilot_g2.py batch TDCC
      - name: Gated TAIFEX incremental native-format batch
        if: steps.taifex.outputs.ready == 'true'
        run: PYTHONPATH=. python scripts/v097_two_source_pilot_g2.py batch TAIFEX
      - name: Summary and strict certification boundary
        if: always()
        run: |
          echo "## TDCC/TAIFEX sample-first format QA" >> "$GITHUB_STEP_SUMMARY"
          echo "TDCC sample format gate: ${{ steps.tdcc.outputs.ready }}" >> "$GITHUB_STEP_SUMMARY"
          echo "TAIFEX sample format gate: ${{ steps.taifex.outputs.ready }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Each batch requires its own era-format samples clean; only approved buckets. Reports/CK saved to Google Drive." >> "$GITHUB_STEP_SUMMARY"
          echo "All decisions are FORMAT_CANDIDATE only. No official G2 certificate, no Bronze writes, no Silver/Gold." >> "$GITHUB_STEP_SUMMARY"
