name: JARVIS September TWSE credit Bronze Silver Gold
on:
  push:
    branches: [main]
    paths: [".github/workflows/v095-twse-credit-three-layer.yml","scripts/v095_202609_twse_credit_three_layer.py"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  convert-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pyarrow google-api-python-client google-auth google-auth-httplib2
      - name: Validate native TWSE credit balance units and convert Silver then Gold
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python scripts/v095_202609_twse_credit_three_layer.py
      - name: Retain execution receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twse-credit-202609-${{ github.run_id }}
          path: credit_result/
          if-no-files-found: warn
