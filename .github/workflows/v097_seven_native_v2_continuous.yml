name: JARVIS v097 Seven Native Historical Parsers V2 Continuous
on:
  workflow_dispatch:
    inputs:
      depth:
        default: "0"
        required: false
        type: string
  push:
    paths:
      - scripts/v097_seven_native_v2_probe.py
      - scripts/v097_seven_deep_format_inspector.py
      - scripts/v097_d_seven_source_gate.py
      - scripts/v097_taifex_mops_format_diagnostics.py
      - scripts/v097_seven_historical_format_registry.py
      - .github/workflows/v097_seven_native_v2_continuous.yml
  schedule:
    - cron: '2,17,32,47 * * * *'
permissions:
  contents: read
  actions: write
concurrency:
  group: v097-seven-native-v2
  cancel-in-progress: false
jobs:
  source-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        source: [TWSE, TPEx, MOPS, TDCC, TAIFEX, NDC, FinMind]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests
      - name: All seven historical periods and source-native parser negative tests
        run: |
          PYTHONPATH=. python scripts/v097_seven_historical_format_registry.py selftest
          PYTHONPATH=. python scripts/v097_seven_source_specific_resolvers.py selftest
          PYTHONPATH=. python scripts/v097_seven_native_v2_probe.py selftest
          PYTHONPATH=. python scripts/v097_seven_deep_format_inspector.py
          PYTHONPATH=. python scripts/v097_taifex_mops_format_diagnostics.py selftest
      - name: Recheck only typed unresolved native-format evidence; immutable Bronze
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          SOURCE_BATCH: '12'
        run: PYTHONPATH=. python scripts/v097_seven_native_v2_probe.py '${{ matrix.source }}'
  d-gate:
    needs: source-parser
    if: always() && needs.source-parser.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        source: [TWSE, TPEx, MOPS, TDCC, TAIFEX, NDC, FinMind]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests
      - name: Reject invented triple evidence and retain existing 35467 formal READY
        run: PYTHONPATH=. python scripts/v097_d_seven_source_gate.py selftest
      - name: Reconcile native parser evidence with formal gate and independent numerical attestations
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          D_BATCH: '300'
        run: PYTHONPATH=. python scripts/v097_d_seven_source_gate.py '${{ matrix.source }}'
  continuation:
    needs: [source-parser, d-gate]
    if: always() && needs.source-parser.result != 'cancelled' && needs.d-gate.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests
      - name: Immediate continuation while any of seven source adapters has queued records
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEPTH: ${{ inputs.depth || '0' }}
        run: |
          PENDING=$(python - <<'PY'
          from scripts.v097_bronze_autopilot import source_api,SOURCES
          from scripts.v097_seven_native_v2_probe import SKIP_READY_PARSER
          api,control,quality,match,load_json,*_=source_api()
          total=0
          for src in SOURCES:
              inf=match(api,quality,"v097_AP_INPUT_"+src+".json")
              prev=match(api,control,"v097_AP_CHECKPOINT_"+src+".json")
              new=match(api,control,"v097_SEVEN_FORMAT_V2_CK_"+src+".json")
              if not inf or not prev:raise RuntimeError("MISSING_SOURCE_"+src)
              inp=load_json(api,inf["id"])["rows"]
              old=load_json(api,prev["id"])["done"]
              ck=load_json(api,new["id"])["done"] if new else {}
              eligible={x["source_id"] for x in inp if old.get(x["source_id"],{}).get("status") not in SKIP_READY_PARSER[src]}
              if not set(ck).issubset(eligible):raise RuntimeError("CHECKPOINT_SCOPE_INVALID_"+src)
              total+=len(eligible)-len(ck)
              # Keep dispatching if D-stage evidence gating has fallen behind
              # already available native records or preserved formal READY.
              df=match(api,control,"v097_D_THREE_WAY_GATE_CK_"+src+".json")
              dd=load_json(api,df["id"])["done"] if df else {}
              source_release_run=None
              # Existing READY count need not force a full backfill to keep
              # the active parser loop alive: D handles source checkpoint rows
              # and preserved READY from frozen input independently.
              total+=len(set(ck)-set(dd))
              from scripts.v097_seven_native_v2_probe import retry_ids
              total+=len(retry_ids({"done":ck},eligible))
          print(total)
          PY
          )
          echo "SEVEN_NATIVE_V2_PENDING=$PENDING"
          if ! [[ "$DEPTH" =~ ^[0-9]+$ ]]; then exit 1; fi
          if [ "$PENDING" -eq 0 ]; then echo "ALL_SEVEN_NATIVE_V2_AND_D_GATES_CAUGHT_UP; independently verified numerical data still required for READY increases"; exit 0; fi
          if [ "$DEPTH" -ge 60 ]; then echo "CHAIN_LIMIT_60 backup schedule will resume"; exit 0; fi
          gh workflow run v097_seven_native_v2_continuous.yml --ref main -f depth="$((DEPTH+1))"
          echo "SEVEN_NATIVE_V2_NEXT_RUN_ACCEPTED_DEPTH=$((DEPTH+1))"
