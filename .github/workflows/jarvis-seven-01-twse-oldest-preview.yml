name: 證交所排程一之二（1-2）｜最舊往新｜候選執行入口（正式未啟用）
on:
  workflow_dispatch:
    inputs:
      continuation_id:
        description: Durable continuation identity; empty for initial guarded start
        type: string
        required: false
      mode:
        description: Entry validation uses fixtures; production remains blocked
        type: choice
        options: [entry-validation, production]
        default: entry-validation
permissions:
  contents: write
  actions: write
concurrency:
  group: jarvis-seven-entry-twse-asc
  cancel-in-progress: false
jobs:
  worker:
    uses: ./.github/workflows/jarvis-seven-worker.yml
    with:
      source: TWSE
      direction: ASC
      mode: ${{ inputs.mode }}
      continuation_id: ${{ inputs.continuation_id }}
    secrets: inherit
