name: JARVIS v0.97 TDCC TAIFEX exact same-date Bronze-vs-source validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v097_exact_date_g2_backcheck.yml'
      - 'scripts/v097_two_source_exact_date_backcheck.py'
  workflow_dispatch:
  schedule:
    - cron: '13,43 * * * *'
permissions:
  contents: read
concurrency:
  group: jarvis-v097-exact-date-g2-two-sources
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        source: [TDCC, TAIFEX]
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API/CSV dependencies
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: Test exact date matching and parser invariants
        run: |
          set -euo pipefail
          python -m py_compile scripts/v097_two_source_exact_date_backcheck.py
          PYTHONPATH=. python scripts/v097_two_source_exact_date_backcheck.py selftest
          PYTHONPATH=. python scripts/v097_two_source_native_date_diff.py selftest
      - name: Compare same date and native dataset with existing Bronze
        run: PYTHONPATH=. python scripts/v097_two_source_exact_date_backcheck.py source "${{ matrix.source }}"
      - name: Strict G2 boundary
        if: always()
        run: echo 'Only same date and same dataset; third-party archived open data is not a first-party PIT certificate. No Silver/Gold.' >> "$GITHUB_STEP_SUMMARY"
