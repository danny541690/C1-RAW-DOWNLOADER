name: JARVIS stage06 all-data financial repair expansion
on:
  push:
    paths:
      - '.github/workflows/jarvis-stage06-financial-expand-20261022.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: jarvis-stage06-financial-expansion
  cancel-in-progress: false
jobs:
  financial:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-qa.lock
      - run: python -m pip install -r requirements-qa.lock
      - name: Full regression including financial cells and all-data coverage gates
        run: python -m unittest discover -s tests -q
      - name: Repair the verified financial backlog under the FINANCIAL owner
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.v093_stage06_live --owner-stage FINANCIAL --owner-month 2023-03 --minutes 15 --cutover-owner
