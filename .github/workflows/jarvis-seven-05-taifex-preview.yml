name: 期交所排程五之一（5-1）｜最新往舊｜受控執行入口
run-name: '${{ github.workflow }} | ${{ inputs.mode }} | ${{ inputs.continuation_id }}'
on:
  workflow_dispatch:
    inputs:
      continuation_id:
        description: Durable continuation identity; empty for initial guarded start
        type: string
        required: false
      mode:
        description: Entry validation uses fixtures; production remains blocked
        type: choice
        options: [entry-validation, production]
        default: entry-validation
permissions:
  contents: write
  actions: write
concurrency:
  group: jarvis-seven-entry-taifex-desc
  cancel-in-progress: false
jobs:
  worker:
    uses: ./.github/workflows/jarvis-seven-worker.yml
    with:
      source: TAIFEX
      direction: DESC
      mode: ${{ inputs.mode }}
      continuation_id: ${{ inputs.continuation_id }}
    secrets: inherit
