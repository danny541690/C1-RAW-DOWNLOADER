name: JARVIS v0.98 R18 Repair and Two-Side Byte Format Verification
# Six-source metadata is reused. Only TWSE/TPEx conflict groups and existing R15
# isolated targets are read, up to 12 MB each. Detailed IDs remain private Drive.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jarvis-v098-r18-single-controller
  cancel-in-progress: false
jobs:
  repair-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/v098_r18_repair_verify.py --selftest --out r18_selftest/selftest.json
      - uses: actions/upload-artifact@v4
        with:
          name: r18-selftest
          path: r18_selftest/
  source-target-byte-checks:
    needs: repair-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        source: [TWSE, TPEx]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'google-api-python-client>=2.140,<3' 'google-auth>=2.30,<3' 'google-auth-oauthlib>=1.2,<2'
      - name: Verify real raw duplicate groups and raw vs Drive recovery copy bytes; keep private details private
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python scripts/v098_r18_repair_verify.py --source "${{ matrix.source }}" --out r18_public/${{ matrix.source }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r18-public-${{ matrix.source }}
          path: r18_public/
          if-no-files-found: warn
  central-reconciler:
    needs: [repair-preflight, source-target-byte-checks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: r18-public-*
          path: r18_public/
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: r18-selftest
          path: r18_selftest/
      - name: 'Fail closed: no bytes mismatch, all conflict groups accounted'
        run: |
          python - <<'PY'
          import json,pathlib,sys
          if json.loads(pathlib.Path('r18_selftest/selftest.json').read_text())['status']!='PASS':sys.exit('Selftest failed')
          rows=[json.loads(x.read_text()) for x in pathlib.Path('r18_public').glob('*.json')]
          if len(rows)!=2 or {x.get('source') for x in rows}!={'TWSE','TPEx'}:sys.exit('Missing receipts')
          if any(r.get('status')!='PASS_REAL_BYTES_OR_COVERAGE_HOLD' for r in rows):sys.exit('Real copy or duplicate evidence failed')
          if sum(r.get('duplicate_groups',0) for r in rows)!=7:sys.exit('Conflict count drift')
          if sum(r.get('source_staging_bytes_sha_match',0) for r in rows)!=2:sys.exit('Sample comparison incomplete')
          report={'status':'PASS_R18_BYTE_VERIFICATION_NOT_PRODUCTION_READY',
             'groups':sum(r['duplicate_groups'] for r in rows),
             'duplicate_groups_verified_by_bytes':sum(r['byte_sha_verified_groups'] for r in rows),
             'metadata_only_groups':sum(r['metadata_only_groups'] for r in rows),
             'content_mismatch_groups':sum(r['byte_sha_mismatch_groups'] for r in rows),
             'real_source_to_Drive_sandbox_SHA256':2,
             'format_profiles':[{'source':r['source'],'origin':r['origin_profile_type'],
               'sandbox_target':r['target_profile_type'],'zip_crc_ok':r['staging_zip_crc_ok']} for r in rows],
             'detailed_lineage_in_private_Drive':True,
             'source_originals_immutable':True,
             'legacy_74750_vs_78281_membership_verified':False,
             'dataset_coverage_certified':False,
             'cross_run_atomic_lease_certified':False,
             'formal_Bronze_destination_certified':False,
             'production_bulk_migration_allowed':False}
          pathlib.Path('r18_final').mkdir(exist_ok=True)
          pathlib.Path('r18_final/summary.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r18-central-summary
          path: r18_final/
          if-no-files-found: warn
