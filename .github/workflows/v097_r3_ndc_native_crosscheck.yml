name: JARVIS R3 NDC 10 real original workbook cell crosscheck
on:
  push:
    branches:
      - r3-bronze-silver-ready-staging-20261118
    paths:
      - '.github/workflows/v097_r3_ndc_native_crosscheck.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jarvis-r3-ndc-original-native-crosscheck
  cancel-in-progress: false
jobs:
  official-xlsx-native-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Drive evidence reader
        run: python -m pip install google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: Crosscheck native XLSX and 10 frozen NDC JSON originals
        run: |
          set -euo pipefail
          python -m py_compile scripts/v097_r3_ndc_xlsx_native_crosscheck.py
          PYTHONPATH=. python scripts/v097_r3_ndc_xlsx_native_crosscheck.py
      - if: always()
        run: echo 'Independent native workbook SHA and every historical sheet cell checked. Publication PIT and official edition approval remain separate; no false G2 PASS.' >> "$GITHUB_STEP_SUMMARY"
