name: JARVIS v0.98 Copy-Only Diagnostic Canary
# 0.93 source read-only. No data download, schema, numeric/PIT QA, Silver or Gold.
on:
  push:
    branches: [jarvis-v098-bronze-copy-only-20261120]
    paths:
      - scripts/v098_bronze_copy_only.py
      - .github/workflows/v098-bronze-copy-only.yml
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: 'auto = verify live canary, then copy all; self-test/preflight/canary also available'
        options: [self-test, preflight, canary]
        default: self-test
      workers:
        type: choice
        options: ['1', '2', '3', '4', '5', '6']
        default: '3'
      production_ack:
        type: string
        description: 'auto only: COPY_093_TO_098'
        required: false
permissions:
  contents: read
concurrency:
  group: v098-raw-copy-only-single-writer
  cancel-in-progress: true
jobs:
  copy-only:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check syntax
        run: python -m py_compile scripts/v098_bronze_copy_only.py
      - name: Local 25MB SHA and 8-worker replay test
        run: python scripts/v098_bronze_copy_only.py --mode self-test
      - name: Install Google Drive API
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'self-test')
        run: python -m pip install --disable-pip-version-check 'google-api-python-client>=2.140,<3' 'google-auth>=2.30,<3'
      - name: Refuse auto without explicit release
        if: false
        env:
          ACK: ${{ inputs.production_ack }}
        run: |
          test "$ACK" = "COPY_093_TO_098" || { echo 'Missing copy-only release acknowledgement'; exit 1; }
      - name: Real Drive 6 MB-scale copies / interruption / parallel replay
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'canary'))
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          WORKERS: ${{ inputs.workers || '3' }}
        run: python scripts/v098_bronze_copy_only.py --mode canary --workers "$WORKERS"
      - name: Complete original-only full copy
        if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'preflight')
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          WORKERS: ${{ inputs.workers }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$MODE" = "auto" ]; then MODE=migrate; fi
          python scripts/v098_bronze_copy_only.py --mode "$MODE" --workers "$WORKERS"
