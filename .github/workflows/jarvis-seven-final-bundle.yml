name: JARVIS consolidated final prelaunch checks and explicit release gates
on:
  push:
    branches: [codex/seven-source-closed-loop-design-20261029]
    paths: [.github/workflows/jarvis-seven-final-bundle.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: jarvis-final-prelaunch-bundle
  cancel-in-progress: false
jobs:
  final-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-qa.lock
      - name: Run entire repository offline test suite
        run: |
          python - <<'PYTEST'
          import json,re,subprocess,sys
          from pathlib import Path
          out=Path('results');out.mkdir(exist_ok=True)
          p=subprocess.run([sys.executable,'-m','unittest','discover','-s','tests','-p','test_*.py','-v'],capture_output=True,text=True)
          log=p.stdout+p.stderr
          for offset in range(0,len(log),100000):
              (out/('full-repo-'+str(offset//100000)+'.log')).write_text(log[offset:offset+100000])
          match=re.search(r'Ran (\d+) tests?',log)
          result=dict(schema='JARVIS_FULL_REPOSITORY_OFFLINE_RESULT_V1',tests=int(match[1]) if match else None,exit_code=p.returncode,passed=p.returncode==0,source_environment='REPOSITORY_OFFLINE_TESTS',production_activation=False)
          (out/'full-repo-summary.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result))
          print('\n'.join(log.splitlines()[-12:]))
          raise SystemExit(p.returncode)
          PYTEST
      - name: Consolidated regression, twelve production gates and rejection evidence storage
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python -m scripts.v093_final_prelaunch_bundle --probe-drive
      - name: Automatically publish all final check results
        if: always()
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python -m scripts.v093_acceptance_publish --source TWSE --job final-prelaunch --status '${{ job.status }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-prelaunch-checks
          path: |
            results
            publication
          retention-days: 90
