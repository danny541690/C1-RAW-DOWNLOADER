name: JARVIS v0.97 - Repair legacy TPEx prices and MOPS revenue V2
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v097_legacy_tpex_mops_v2.py'
      - '.github/workflows/v097-legacy-tpex-mops-v2.yml'
  workflow_dispatch:
  schedule:
    - cron: '11,41 * * * *'
permissions:
  contents: read
concurrency:
  group: v097-tpex-mops-v2-single
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'danny541690/C1-RAW-DOWNLOADER'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - run: |
          python -m py_compile scripts/v097_legacy_tpex_mops_v2.py
          PYTHONPATH=. python scripts/v097_legacy_tpex_mops_v2.py
  bootstrap:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: One-writer bootstrap V2 quarantine for legacy TPEx and MOPS
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          LEGACY_REPAIR_MODE: bootstrap
        run: PYTHONPATH=. python scripts/v097_legacy_tpex_mops_v2.py
  repair-six-lanes:
    needs: bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        lane: [0,1,2,3,4,5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: Actual source byte SHA -> historical schema conversion -> dest SHA verified
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          LEGACY_REPAIR_MODE: lane
          LEGACY_REPAIR_LANE: ${{ matrix.lane }}
          LEGACY_BATCH: '15'
        run: |
          for round in $(seq 1 20); do
            log=$(PYTHONPATH=. python scripts/v097_legacy_tpex_mops_v2.py)
            echo "$log"
            if [ "$(echo "$log" | grep -c '"remaining": 0')" -ge 2 ]; then
              break
            fi
          done
  summary:
    needs: repair-six-lanes
    if: always() && needs.repair-six-lanes.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: Produce verified repair/hold counts and original lineage to Drive
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          LEGACY_REPAIR_MODE: summary
        run: PYTHONPATH=. python scripts/v097_legacy_tpex_mops_v2.py
