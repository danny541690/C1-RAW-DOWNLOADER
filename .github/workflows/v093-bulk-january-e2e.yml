name: JARVIS 2024 Bulk January Real Monthly E2E
on:
  push:
    paths:
      - '.github/workflows/v093-bulk-january-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  january:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install google-api-python-client google-auth google-auth-httplib2
      - name: TWSE TPEx all weekdays of January - persistent checkpoint per day
        env:
          PYTHONPATH: .
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: python3 -u scripts/bulk_monthly_capture.py --year 2024 --month 1
