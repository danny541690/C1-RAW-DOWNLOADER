name: JARVIS v0.93 FOUR SOURCE MINI E2E
on:
  push:
    paths:
      - '.github/workflows/v093-four-source-mini-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  four-source-actual-drive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install google-api-python-client google-auth google-auth-httplib2
      - name: All four free sources true download Drive upload and SHA readback
        env:
          PYTHONPATH: .
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: python3 -u scripts/four_source_mini_e2e.py
