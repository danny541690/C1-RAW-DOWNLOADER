name: JARVIS v0.97 TDCC TAIFEX matched-date original versus official audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v097_two_source_native_date_diff.yml'
      - 'scripts/v097_two_source_native_date_diff.py'
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: read
concurrency:
  group: jarvis-v097-native-date-diff-tdcc-taifex
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        source: [TDCC, TAIFEX]
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original format and official-source comparison clients
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: Date-key matched source-native regression test
        run: |
          python -m py_compile scripts/v097_two_source_native_date_diff.py
          PYTHONPATH=. python scripts/v097_two_source_native_date_diff.py selftest
      - name: Read immutable Bronze and produce field-by-field source differential evidence
        run: PYTHONPATH=. python scripts/v097_two_source_native_date_diff.py source "${{ matrix.source }}"
      - name: Mark official evidence boundary
        if: always()
        run: echo 'No formal G2 PASS without same date and same dataset authoritative origin evidence. Bronze unchanged.' >> "$GITHUB_STEP_SUMMARY"
