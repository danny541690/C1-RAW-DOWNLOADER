name: JARVIS v0.95 2026 TDCC independent Bronze and downstream gate
# 2026 source-scoped writer; verified Bronze -> Silver -> available descriptive Gold immediately; PIT remains blocked.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v095-2026-source-tdcc.yml'
      - 'scripts/v095_2026_four_source_archive_intake.py'
      - 'scripts/v095_2026_immediate_silver_gold.py'
  schedule:
    - cron: '10,40 * * * *'
permissions:
  contents: read
concurrency:
  group: jarvis-v095-2026-source-tdcc-single-writer
  cancel-in-progress: false
jobs:
  source-tdcc:
    if: github.repository == 'danny541690/C1-RAW-DOWNLOADER'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      V095_BRONZE_SOURCE: 'TDCC'
      V095_ARCHIVE_BATCH: '3'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: G0 preflight 2000-2026 source-specific dates and publication rules
        run: |
          python -m unittest discover -s tests -p 'test_v095_market_release_calendar_2000_2026.py' -v
          python - <<'PY'
          from scripts.v095_market_release_calendar_2000_2026 import contracts,market_day
          contracts()
          state,_=market_day('2026-01-02','TDCC')
          print('SOURCE_G0_MARKET_STATE:',state)
          PY
      - name: Install exact common Drive, Arrow and source adapter dependencies once
        run: python -m pip install --disable-pip-version-check pyarrow openpyxl google-api-python-client google-auth google-auth-httplib2
      - name: Check non-release gates and compile source-specific adapters
        run: |
          python - <<'PY'
          import json
          x=json.load(open('governance/v095/PHASE1_FLAGS.json'))
          assert x['BULK_COPY_APPROVED'] is False and x['RELEASE_APPROVED'] is False
          print('V095_SOURCE_ISOLATED_CANDIDATE_ONLY')
          PY
          python -m py_compile scripts/v095_2026_four_source_archive_intake.py scripts/v095_2026_immediate_silver_gold.py
      - name: Admit SHA CRC manifest-proven v0.93 Bronze archive candidates only
        run: python -m scripts.v095_2026_four_source_archive_intake
      - name: Convert available Bronze into Silver then supported descriptive Gold immediately
        run: python -u -m scripts.v095_2026_immediate_silver_gold
      - name: Preserve full per-partition actual results, exceptions and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v095-2026-tdcc-source-${{ github.run_id }}
          path: |
            v095_2026_source_archives/result.json
            v095_2026_immediate_downstream/result.json
            v095_2026_immediate_downstream/missing_indicators.json
          if-no-files-found: warn
          retention-days: 90
