name: JARVIS R3 ONE-CLICK PRELAUNCH ALL-IN-ONE (BLOCK RELEASE)
# 2026-11-18 explicit user-authorized combined prelaunch rerun; staging only.
# This test is not the missing official per-dataset contract or production G5 release.
on:
  push:
    branches:
      - r3-bronze-silver-ready-staging-20261118
    paths:
      - '.github/workflows/v097_r3_one_click_prelaunch.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jarvis-r3-oneclick-staging
  cancel-in-progress: false
jobs:
  gates-and-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: R3 code compile and existing historical registry selftest
        run: |
          set -euo pipefail
          python -m py_compile scripts/v097_r3_gate_core.py scripts/v097_r3_snapshot_audit.py scripts/v097_r3_workflow_collision_audit.py scripts/v097_r3_prelaunch_readiness.py
          PYTHONPATH=. python scripts/v097_seven_historical_format_registry.py selftest
          python -m py_compile scripts/v097_r3_formal_release_contracts.py
      - name: Combined 70 / 700 / 1000 / 74750 / G0-G5 regression
        run: |
          set -euo pipefail
          for case in test_v097_r3_gate_core.py test_v097_r3_extended_bundle.py test_v097_r3_full_cohort.py test_v097_r3_snapshot_audit.py test_v097_r3_prelaunch_readiness.py test_v097_r3_formal_release_contracts.py; do
            PYTHONPATH=. python -m unittest discover -s tests -p "$case" -v
          done
      - name: Inspect old dispatch and potential writers
        run: PYTHONPATH=. python scripts/v097_r3_workflow_collision_audit.py --assert-blocked
      - name: Live G0 handover check for R1 V3 and other legacy workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=. python scripts/v097_r3_live_handover_audit.py audit
      - name: Create fail-closed Go/No-Go report
        run: PYTHONPATH=. python scripts/v097_r3_prelaunch_readiness.py --output /tmp/r3-release-verdict.json
      - uses: actions/upload-artifact@v4
        with:
          name: r3-oneclick-g0-g5-nonrelease-verdict
          path: /tmp/r3-release-verdict.json
  real-bronze-read:
    needs: gates-and-synthetic
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: Real frozen cohort and seven destination SHAs (read-only)
        run: PYTHONPATH=. python scripts/v097_r3_real_bronze_canary.py read-only
  real-70-sample:
    needs: real-bronze-read
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: Seventy real Bronze stratified SHA samples, 10 per source
        run: PYTHONPATH=. python scripts/v097_r3_real_70_canary.py read-only
  real-contract-census:
    needs: real-70-sample
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: Read existing official G2 G3 certificate registries and G4 mapping candidates
        run: PYTHONPATH=. python scripts/v097_r3_live_contract_census.py read-only
  real-formal-70:
    needs: real-contract-census
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: Actual frozen 70 through formal G2 G3 G4 (no false promotion)
        run: PYTHONPATH=. python scripts/v097_r3_real_formal_70_pilot.py read-only
  drive-staging-readback:
    needs: real-formal-70
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: R3 staging namespace receipt commit and readback
        run: PYTHONPATH=. python scripts/v097_r3_drive_staging_commit_probe.py staging-readback
  final:
    needs: [gates-and-synthetic,real-bronze-read,real-70-sample,real-contract-census,real-formal-70,drive-staging-readback]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Final honest prelaunch result
        env:
          GATES: ${{ needs.gates-and-synthetic.result }}
          REAL: ${{ needs.real-bronze-read.result }}
          REAL70: ${{ needs.real-70-sample.result }}
          CONTRACTS: ${{ needs.real-contract-census.result }}
          FORMAL70: ${{ needs.real-formal-70.result }}
          DRIVE: ${{ needs.drive-staging-readback.result }}
        run: |
          echo "## R3 one-click PRELAUNCH" >> "$GITHUB_STEP_SUMMARY"
          echo "Synthetic/G0: $GATES" >> "$GITHUB_STEP_SUMMARY"
          echo "Real Bronze SHA: $REAL" >> "$GITHUB_STEP_SUMMARY"
          echo "Stratified real 70: $REAL70" >> "$GITHUB_STEP_SUMMARY"
          echo "Live G2/G3/G4 contract census: $CONTRACTS" >> "$GITHUB_STEP_SUMMARY"
          echo "70 real R3 G2/G3/G4 formal assessments: $FORMAL70" >> "$GITHUB_STEP_SUMMARY"
          echo "Isolated Drive receipt: $DRIVE" >> "$GITHUB_STEP_SUMMARY"
          echo '**PRODUCTION RELEASE BLOCKED** until old writer cutover, official G2/G3/G4 certificates and production G5 have been independently verified.' >> "$GITHUB_STEP_SUMMARY"
          if [ "$GATES" != success ] || [ "$REAL" != success ] || [ "$REAL70" != success ] || [ "$CONTRACTS" != success ] || [ "$FORMAL70" != success ] || [ "$DRIVE" != success ]; then exit 1; fi
