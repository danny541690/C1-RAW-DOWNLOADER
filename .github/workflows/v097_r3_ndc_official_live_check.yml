name: JARVIS R3 NDC official live XLSX source SHA recheck
on:
  push:
    branches: [r3-bronze-silver-ready-staging-20261118]
    paths: ['.github/workflows/v097_r3_ndc_official_live_check.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jarvis-r3-ndc-live-origin-sha-review
  cancel-in-progress: false
jobs:
  official-source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - run: PYTHONPATH=. python scripts/v097_r3_ndc_live_origin_recheck.py
      - if: always()
        run: echo 'Official live byte match is only one required input; publication-era PIT and original native layout still require separate evidence before G2 PASS.' >> "$GITHUB_STEP_SUMMARY"
