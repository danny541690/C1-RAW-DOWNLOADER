name: JARVIS v0.97 - Official 3-way exception closure ledger
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v097_exception_official_closure.py'
      - '.github/workflows/v097-official-exception-closure.yml'
  workflow_dispatch:
  schedule:
    - cron: '9,39 * * * *'
permissions:
  contents: read
concurrency:
  group: v097-official-closure-ledger-single
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'danny541690/C1-RAW-DOWNLOADER'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests
      - name: Verify three terminal statuses require actual evidence
        run: |
          python -m py_compile scripts/v097_exception_official_closure.py
          PYTHONPATH=. python scripts/v097_exception_official_closure.py
  reconcile-and-publish:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests
      - name: Join frozen V4 6358 and residual 1131 by file ID; write per-file next action, no false certified status
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          OFFICIAL_CLOSURE_MODE: ledger
        run: PYTHONPATH=. python scripts/v097_exception_official_closure.py
