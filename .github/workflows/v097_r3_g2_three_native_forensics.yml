name: JARVIS R3 G2 MOPS TDCC TAIFEX 30 native header value deep forensic
# Canonical native table column-width JSON keys for remote receipt verification.
on:
  push:
    branches: [r3-bronze-silver-ready-staging-20261118]
    paths: ['.github/workflows/v097_r3_g2_three_native_forensics.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jarvis-r3-three-source-30-native-historical-forensics
  cancel-in-progress: false
jobs:
  native-per-field-date-value-inspection:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: Real 30 frozen source native headers contents historical edition diagnostics
        run: |
          set -euo pipefail
          python -m py_compile scripts/v097_r3_g2_three_source_native_forensics.py
          PYTHONPATH=. python scripts/v097_r3_g2_three_source_native_forensics.py
      - if: always()
        run: |
          echo 'Distinct dataset native field structure and historical source are required. No false G2 PASS on SHA/header-only samples.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Bronze read-only. Keep previous 324 G2 QA immutable; no Silver/Gold.' >> "$GITHUB_STEP_SUMMARY"
