name: JARVIS R3 MOPS TDCC historical native rows official endpoint replay
on:
  push:
    branches: [r3-bronze-silver-ready-staging-20261118]
    paths: ['.github/workflows/v097_r3_mops_tdcc_official_cells.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jarvis-r3-mops-tdcc-real-original-cell-compare
  cancel-in-progress: false
jobs:
  compare-original-values-to-official:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: Compare real MOPS official OTC revenue and TDCC weekly source table all original values
        run: |
          set -euo pipefail
          python -m py_compile scripts/v097_r3_mops_tdcc_real_row_official_crosscheck.py
          PYTHONPATH=. python scripts/v097_r3_mops_tdcc_real_row_official_crosscheck.py
      - if: always()
        run: echo 'Recheck only official historical origin or query. No false G2 PASS on homepage or incomplete date/PIT evidence.' >> "$GITHUB_STEP_SUMMARY"
