name: JARVIS v0.97 - Admit 2025 officially checked TDCC special originals
on:
  workflow_run:
    workflows:
      - "JARVIS v0.97 - 2025 TDCC official historic same-day totals comparison"
    types:
      - completed
  workflow_dispatch:
  schedule:
    - cron: '29,59 * * * *'
permissions:
  contents: read
concurrency:
  group: v097-2025-official-special-raw
  cancel-in-progress: false
jobs:
  selftest:
    if: github.repository == 'danny541690/C1-RAW-DOWNLOADER' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests
      - run: |
          python -m py_compile scripts/v097_tdcc_2025_official_special_admit.py
          PYTHONPATH=. python scripts/v097_tdcc_2025_official_special_admit.py
  bootstrap:
    needs: selftest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests
      - name: Prepare 0.97 2025 officially matched TDCC isolated special RAW
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          TDCC_RECOVER_MODE: bootstrap
        run: PYTHONPATH=. python scripts/v097_tdcc_2025_official_special_admit.py
  copy-six-lanes:
    needs: bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        lane: [0,1,2,3,4,5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests
      - name: Official same-day proof and independent v0.93 source 0.97 quarantine original-destination SHA admission
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          TDCC_RECOVER_MODE: lane
          TDCC_2025_ADMIT_LANE: ${{ matrix.lane }}
          TDCC_2025_ADMIT_BATCH: '25'
        run: |
          for n in $(seq 1 15); do
            result=$(PYTHONPATH=. python scripts/v097_tdcc_2025_official_special_admit.py)
            echo "$result"
            if echo "$result" | grep -q '"remaining": 0'; then break; fi
          done
  summary:
    needs: copy-six-lanes
    if: always() && needs.copy-six-lanes.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests
      - name: Publish original 2025 official and SHA proofs; ordinary stock Bronze unchanged
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          TDCC_RECOVER_MODE: summary
        run: PYTHONPATH=. python scripts/v097_tdcc_2025_official_special_admit.py
