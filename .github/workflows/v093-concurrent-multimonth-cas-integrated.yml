name: JARVIS v0.93 Concurrent Multi-Month CAS Integrated Gate
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/v093-concurrent-multimonth-cas-integrated.yml'
permissions:
  contents: write
jobs:
  seed:
    runs-on: ubuntu-latest
    outputs:
      manifest: ${{ steps.init.outputs.manifest }}
      sha: ${{ steps.init.outputs.sha }}
    steps:
      - id: init
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os,json,base64,urllib.request
          path='.github/test-state/multimonth-'+os.environ['RUN_ID']+'.json'
          data={'jobs':{},'test_scope':'isolated_concurrent_manifest'}
          h={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'}
          body={'message':'test: seed isolated multi-month manifest','content':base64.b64encode(json.dumps(data,sort_keys=True).encode()).decode()}
          req=urllib.request.Request('https://api.github.com/repos/'+os.environ['REPO']+'/contents/'+path,data=json.dumps(body).encode(),method='PUT',headers=h)
          with urllib.request.urlopen(req,timeout=30) as r:result=json.load(r)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('manifest='+path+'\nsha='+result['content']['sha']+'\n')
          print('MULTIMONTH_SEED_PASS '+json.dumps({'manifest':path,'jobs':0}))
          PY
  writers:
    needs: seed
    strategy:
      fail-fast: false
      matrix:
        writer: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      MANIFEST: ${{ needs.seed.outputs.manifest }}
      SEED_SHA: ${{ needs.seed.outputs.sha }}
      WRITER: ${{ matrix.writer }}
    steps:
      - name: Four independent runners CAS merge three months each
        run: |
          python3 - <<'PY'
          import os,json,base64,hashlib,urllib.request,urllib.error,time
          h={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'}
          url='https://api.github.com/repos/'+os.environ['REPO']+'/contents/'+os.environ['MANIFEST']
          writer=int(os.environ['WRITER'])
          months=[f'2026-{i+1:02d}' for i in range(writer*3,(writer+1)*3)]
          updates={m+':ohlc:RAW':{'status':'DATA_PRESENT_PENDING_QA','sha256':hashlib.sha256((m+':ohlc:RAW').encode()).hexdigest(),'certified':False,'writer':writer} for m in months}
          conflicts=0
          for attempt in range(1,13):
              if attempt==1:
                  sha=os.environ['SEED_SHA']
                  obj={'jobs':{},'test_scope':'isolated_concurrent_manifest'}
              else:
                  with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=30) as r:cur=json.load(r)
                  sha=cur['sha'];obj=json.loads(base64.b64decode(cur['content']))
              for key,val in updates.items():
                  if key in obj['jobs'] and obj['jobs'][key]!=val:raise AssertionError('OVERWRITE_CONFLICT')
                  obj['jobs'][key]=val
              body={'message':f'test: writer {writer} CAS merge {attempt}','sha':sha,'content':base64.b64encode(json.dumps(obj,sort_keys=True).encode()).decode()}
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,data=json.dumps(body).encode(),method='PUT',headers=h),timeout=30) as r:status=r.status
              except urllib.error.HTTPError as e:
                  if e.code not in (409,422):raise
                  status=e.code
              print('MULTIMONTH_CAS_ATTEMPT '+json.dumps({'writer':writer,'attempt':attempt,'status':status}),flush=True)
              if status==200:break
              conflicts+=1
              time.sleep(min(0.5*attempt,3))
          else:raise AssertionError('CAS_RETRY_EXHAUSTED')
          print('MULTIMONTH_WRITER_PASS '+json.dumps({'writer':writer,'months':months,'records':len(updates),'conflicts':conflicts}),flush=True)
          PY
  verify:
    needs: [seed,writers]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      MANIFEST: ${{ needs.seed.outputs.manifest }}
      SEED_SHA: ${{ needs.seed.outputs.sha }}
    steps:
      - name: Independent durable manifest readback and stale update rejection
        run: |
          python3 - <<'PY'
          import os,json,base64,hashlib,urllib.request,urllib.error
          h={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'}
          url='https://api.github.com/repos/'+os.environ['REPO']+'/contents/'+os.environ['MANIFEST']
          def read():
              with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=30) as r:return json.load(r)
          current=read()
          obj=json.loads(base64.b64decode(current['content']))
          jobs=obj['jobs']
          assert len(jobs)==12,len(jobs)
          for i in range(12):
              month=f'2026-{i+1:02d}'
              key=month+':ohlc:RAW'
              assert key in jobs,key
              row=jobs[key]
              assert row['writer']==i//3
              assert row['sha256']==hashlib.sha256(key.encode()).hexdigest()
              assert row['status']=='DATA_PRESENT_PENDING_QA' and row['certified'] is False
          stale={'message':'test: stale SHA should fail','sha':os.environ['SEED_SHA'],'content':base64.b64encode(json.dumps({'jobs':{}},sort_keys=True).encode()).decode()}
          try:
              with urllib.request.urlopen(urllib.request.Request(url,data=json.dumps(stale).encode(),method='PUT',headers=h),timeout=30) as r:status=r.status
          except urllib.error.HTTPError as e:status=e.code
          assert status in (409,422),status
          assert len(json.loads(base64.b64decode(read()['content']))['jobs'])==12
          print('MULTIMONTH_CROSS_RUNNER_CAS_INTEGRATION_PASS '+json.dumps({'writers':4,'months':12,'entries':12,'lost_updates':0,'false_certifications':0,'stale_update_rejected':True,'stale_status':status,'durable_store':'GitHub Contents API','real_drive_writes':0}),flush=True)
          print('RELEASE_GATE=BLOCKED_NO_DRIVE_TRANSACTION_OR_CANCEL_RECOVERY_IN_THIS_TEST')
          PY
