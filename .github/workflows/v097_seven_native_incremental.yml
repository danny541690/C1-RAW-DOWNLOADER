name: JARVIS v0.97 seven-source R3 evidence reuse and incremental native QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v097_seven_native_incremental.yml'
  workflow_dispatch:
  schedule:
    - cron: '5,20,35,50 * * * *'
permissions:
  contents: read
concurrency:
  group: jarvis-v097-seven-native-incremental-one-writer
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify seven-source R3 separation and schema source code
        run: |
          set -euo pipefail
          python -m py_compile scripts/v097_seven_native_incremental.py scripts/v097_seven_source_format_smoke.py scripts/v097_two_source_pilot_g2.py
          PYTHONPATH=. python scripts/v097_seven_native_incremental.py selftest
          PYTHONPATH=. python scripts/v097_seven_historical_format_registry.py selftest
          PYTHONPATH=. python scripts/v097_v3_contract_registry.py selftest
          PYTHONPATH=. python scripts/v097_g2g3_tdcc_native_html.py selftest
          PYTHONPATH=. python scripts/v097_seven_source_format_smoke.py selftest
  sources:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        source: [TWSE, TPEx, MOPS, TDCC, TAIFEX, NDC, FinMind]
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      SEVEN_INC_SAMPLE: '6'
      SEVEN_INC_BATCH: '100'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native format parser and Drive API dependencies
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4 openpyxl
      - name: Checkpoint-reuse first, then original Bronze read-only increment
        run: PYTHONPATH=. python scripts/v097_seven_native_incremental.py source "${{ matrix.source }}"
      - name: Per-source guardrail
        if: always()
        run: echo 'R3 QA 325 kept separate from G5 Master; no automatic G2 PASS, no Bronze/Silver/Gold changes.' >> "$GITHUB_STEP_SUMMARY"
