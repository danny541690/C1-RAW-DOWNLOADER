name: JARVIS R3 MOPS actual first G2 with 2025 historical listing universe
# Source 857 numeric values matched, four 2026 IPOs excluded; normalize reviewer alias JSON tuple for Drive readback.
on:
  push:
    branches: [r3-bronze-silver-ready-staging-20261118]
    paths: ['.github/workflows/v097_r3_mops_historical_issuer_asof_g2.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jarvis-r3-mops-historical-issuer-asof-first-source-g2
  cancel-in-progress: false
jobs:
  historic-issuer-normalized-official-source-G2:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4
      - name: Verify 2025 native issuer values excluding 2026 newcomers and 2026 new-name aliases with official IPO evidence
        run: |
          set -euo pipefail
          python -m py_compile scripts/v097_r3_mops_revenue_historical_id_asof_g2.py
          PYTHONPATH=. python scripts/v097_r3_mops_revenue_historical_id_asof_g2.py
      - if: always()
        run: echo 'Any missing official first-listed evidence, numeric row mismatch or wrong native source SHA holds G2. PIT before Nov 2026 forbidden. Bronze immutable.' >> "$GITHUB_STEP_SUMMARY"
