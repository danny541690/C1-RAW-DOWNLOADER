name: FinMind Free - equal-scope comparison
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/finmind-free-compare.yml"
      - "scripts/finmind_plan_compare.py"
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test FinMind real APIs (no Drive writes)
        env:
          FINMIND_PLAN: FREE
        run: python3 scripts/finmind_plan_compare.py
      - name: Upload actual API observed comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finmind-free-compare-report
          path: finmind_plan_comparison/
          retention-days: 7
          if-no-files-found: warn
