name: 期交所排程五之一（5-1）｜最新往舊｜候選預覽
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jarvis-seven-preview-taifex-desc
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate source and direction
        run: python -m scripts.v093_seven_source_plan --source TAIFEX --direction DESC --as-of 2026-10-29 --out results/TAIFEX-DESC-design.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-5-1-preview-${{ github.run_id }}
          path: results/TAIFEX-DESC-design.json
          retention-days: 30
