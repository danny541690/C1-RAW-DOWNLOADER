name: JARVIS v0.93 Price Basis Diagnostic Readonly
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/v093-price-basis-diagnostic-readonly.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect source field basis, raw values and monthly date bounds
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,json,decimal,datetime
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 JARVIS-Readonly-Price-Diagnostic'})
            with urllib.request.urlopen(req,timeout=20) as r:return json.loads(r.read(1000000))
          for year,mm in ((2026,8),(2014,10)):
            month=f'{year}-{mm:02d}'
            last=(datetime.date(year+1,1,1) if mm==12 else datetime.date(year,mm+1,1))-datetime.timedelta(days=1)
            tw=get('https://www.twse.com.tw/rwd/zh/afterTrading/STOCK_DAY?'+urllib.parse.urlencode({'date':f'{year}{mm:02d}01','stockNo':'2330','response':'json'}))
            fm=get('https://api.finmindtrade.com/api/v4/data?'+urllib.parse.urlencode({'dataset':'TaiwanStockPrice','data_id':'2330','start_date':f'{month}-01','end_date':last.isoformat()}))
            rows=tw.get('data',[])
            frows=fm.get('data',[])
            output={'month':month,'twse_fields':tw.get('fields',[]),'twse_first':rows[0] if rows else None,'finmind_first':frows[0] if frows else None,'finmind_last_date':frows[-1].get('date') if frows else None,'finmind_count':len(frows),'twse_count':len(rows)}
            if rows and frows:
              a=str(rows[0][7]).replace(',','')
              b=str(frows[0].get('close'))
              try:output['first_close_ratio_twse_over_finmind']=str(decimal.Decimal(a)/decimal.Decimal(b))
              except Exception:pass
            print('PRICE_BASIS_DIAGNOSTIC '+json.dumps(output,ensure_ascii=False),flush=True)
          print('DIAGNOSTIC_READONLY_FINISHED',flush=True)
          PY
