name: JARVIS v097 Seven Source Silver READY Gate Independent Pilot
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/v097_ap_silver_ready_all_pilot.yml'
permissions:
  contents: read
concurrency:
  group: v097-ap-silver-all-pilot
  cancel-in-progress: false
jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        source: [TWSE, TPEx, MOPS, TDCC, TAIFEX, NDC, FinMind]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests
      - name: Self-test source-specific accept/reject policy
        run: PYTHONPATH=. python scripts/v097_ap_silver_input_gate_all.py selftest
      - name: Reconcile frozen QA evidence and issue source-specific release
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: PYTHONPATH=. python scripts/v097_ap_silver_input_gate_all.py '${{ matrix.source }}'
  aggregate:
    needs: [gates]
    if: always() && needs.gates.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests
      - name: Self-test consolidated Silver READY publisher
        run: PYTHONPATH=. python scripts/v097_ap_publish_artifacts.py selftest
      - name: Write 74750 file-by-file READY/HOLD/pending results, signed by immutable receipts
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: PYTHONPATH=. python scripts/v097_ap_publish_artifacts.py
